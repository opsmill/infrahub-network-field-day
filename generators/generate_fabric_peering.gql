query GenerateFabricPeeringQuery($name: String!) {
  # The ordered intent. Aliased `target:` because the artifact definition
  # parameterises this generator on the service's name.
  target: ServiceFabricPeering(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        # Drives withdrawal. Until cycle 037 this generator ignored status
        # entirely, so a decommissioned peering service kept every BGP session
        # it had derived -- the service said gone and the fabric said up.
        status {
          value
        }
        cluster {
          node {
            id
            name {
              value
            }
            local_asn {
              value
            }
            # The sessions that already exist. Fetched so the generator can
            # tell "adopt" from "create": an existing session keeps its name,
            # enabled flag and address, and only peer_asn is rewritten.
            # Omitting this block breaks adoption -- see research.md R3.
            fabric_peerings {
              edges {
                node {
                  id
                  name {
                    value
                  }
                  peer_asn {
                    value
                  }
                  enabled {
                    value
                  }
                  peer_device {
                    node {
                      __typename
                      id
                      display_label
                    }
                  }
                  peer_address {
                    node {
                      id
                      address {
                        value
                      }
                    }
                  }
                }
              }
            }
            # The cabling. Each node's interface reaches a link, and the link
            # holds BOTH of its endpoints -- including the node's own
            # interface, which is why every interface id is selected: the near
            # end is excluded by id at the far side (research.md R2).
            nodes {
              edges {
                node {
                  __typename
                  id
                  ... on ComputePhysicalServer {
                    name {
                      value
                    }
                    interfaces {
                      edges {
                        node {
                          __typename
                          id
                          ... on InterfacePhysical {
                            connector {
                              node {
                                __typename
                                ... on NetworkLink {
                                  id
                                  connected_endpoints {
                                    edges {
                                      node {
                                        __typename
                                        id
                                        ... on InterfacePhysical {
                                          device {
                                            node {
                                              __typename
                                              id
                                              ... on DcimFabricSwitch {
                                                name {
                                                  value
                                                }
                                                role {
                                                  value
                                                }
                                                asn {
                                                  node {
                                                    id
                                                    asn {
                                                      value
                                                    }
                                                  }
                                                }
                                                # The peering SVI, added by cycle
                                                # 015. Selected by interface role
                                                # rather than by VLAN id or name,
                                                # so a second cluster on a
                                                # different VLAN still resolves.
                                                interfaces {
                                                  edges {
                                                    node {
                                                      __typename
                                                      id
                                                      ... on InterfaceVirtual {
                                                        name {
                                                          value
                                                        }
                                                        role {
                                                          value
                                                        }
                                                        ip_addresses {
                                                          edges {
                                                            node {
                                                              id
                                                              address {
                                                                value
                                                              }
                                                            }
                                                          }
                                                        }
                                                      }
                                                    }
                                                  }
                                                }
                                              }
                                            }
                                          }
                                        }
                                      }
                                    }
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
}
