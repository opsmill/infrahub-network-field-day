query GenerateAppAccessQuery($name: String!) {
  # The ordered intent. Aliased `target:` because the generator is
  # parameterised on the service's name, the same way generate_fabric_peering
  # is.
  target: ServiceAppAccess(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        status {
          value
        }
        requester {
          value
        }
        justification {
          value
        }
        # A list of TCP ports. An EMPTY list is rejected by the generator
        # rather than read as "all ports" -- the lab's FirewallAccess CRD
        # makes the same choice with minItems: 1.
        ports {
          value
        }
        # The application. Its VRF is how the destination zone is derived:
        # ServiceFabricApp.vrf and SecurityZone.vrf both peer IpamVRF, so the
        # zone is the one whose VRF matches. Deriving it from the firewall's
        # interfaces instead cannot work -- the handoff interfaces are /30
        # point-to-points and contain no service VIP.
        application {
          node {
            id
            name {
              value
            }
            # THE MANIFESTS, because the port a grant needs is the port the
            # VIP answers on, and that is a Service's `spec.ports[].port`.
            #
            # `policy_allow_ports` is NOT that port and was read here for two
            # cycles. It is the CiliumNetworkPolicy's ingress port, applied to
            # the PODS -- 8080 for nfd41-demo, whose Service maps 80 -> 8080.
            # So a grant naming no ports derived 8080, the firewall permitted
            # 8080, the VIP answered only on 80, and the request was rendered,
            # merged, pushed and confirmed while reaching nothing.
            #
            # The attachment wins over the inline attribute, the same
            # precedence `crossplane_fabric_app` uses; both are fetched because
            # either may be the one that is set.
            manifests {
              value
            }
            manifests_file {
              node {
                id
              }
            }
            # Which Services get a VIP at all. A ClusterIP service is not
            # reachable from the branch and its ports must not widen a rule --
            # nfd41-demo's `backend` is exactly that case, on 8080.
            service_selector {
              value
            }
            # What the application already permits, so adding is idempotent and
            # withdrawal can tell a prefix this grant added from one a human
            # declared or another grant needs.
            allowed_source_prefixes {
              edges {
                node {
                  id
                  prefix {
                    value
                  }
                }
              }
            }
            # The block its VIPs come from. A grant naming no `destination_vip`
            # permits to this instead -- the set of addresses the application
            # can ever be advertised on.
            vip_block {
              node {
                id
                prefix {
                  value
                }
              }
            }
            vrf {
              node {
                id
                name {
                  value
                }
              }
            }
          }
        }
        # WHERE THE REQUESTER SITS, when they named a site rather than a zone.
        # The site carries the zone and the address-book entry a rule is
        # written from, so "someone at branch-office wants access" resolves to
        # both without the requester knowing either.
        source_site {
          node {
            id
            name {
              value
            }
            security_zone {
              node {
                id
                name {
                  value
                }
                dc_advertised_prefix_list {
                  value
                }
                advertising_device {
                  node {
                    id
                    name {
                      value
                    }
                    avd_custom_hostvars {
                      value
                    }
                  }
                }
              }
            }
            security_source_address {
              node {
                # SecurityGenericAddress is abstract, so the discriminator is
                # mandatory: without it the generated model yields None and the
                # derived source silently disappears.
                __typename
                id
                display_label
                # THE SAME PREFIX THE GRANT'S OWN ADDRESS CARRIES. A grant that
                # names a site rather than an address resolves through here, and
                # that is the normal portal path -- so omitting it would open the
                # application's policy for a grant naming an address directly and
                # not for the one a requester actually makes.
                ... on SecurityIPAMIPPrefix {
                  ip_prefix {
                    node {
                      id
                      prefix {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        }
        # The zone the request comes from, and -- since cycle 032 -- the fabric
        # side of that zone: which prefix list governs what the DC advertises
        # toward it, and which switch applies that list to a BGP neighbor.
        #
        # Both are optional in the schema and four of the six zones carry
        # neither, because the DC advertises nothing toward them. A grant from
        # such a zone gets its firewall rule and no advertisement, which is the
        # honest outcome rather than an error.
        source_zone {
          node {
            id
            name {
              value
            }
            dc_advertised_prefix_list {
              value
            }
            advertising_device {
              node {
                id
                name {
                  value
                }
                # Read to be merged into, never replaced: the attribute is a
                # shared JSON blob and this generator owns one key inside it.
                avd_custom_hostvars {
                  value
                }
              }
            }
          }
        }
        # An existing address-book entry, never a synthesised CIDR, so a
        # generated rule reads the same way as the hand-written ones beside it.
        source_address {
          node {
            id
            __typename
            display_label
            # THE THIRD GATE'S INPUT. The application's own network policy has
            # to name the source as an IpamPrefix, and a SecurityIPAMIPPrefix
            # address already points at exactly that object -- so the grant's
            # source resolves to the right peer without parsing a CIDR or
            # creating anything. An address of any other kind yields nothing
            # here and the grant simply does not open that gate.
            ... on SecurityIPAMIPPrefix {
              ip_prefix {
                node {
                  id
                  prefix {
                    value
                  }
                }
              }
            }
          }
        }
        destination_vip {
          node {
            id
            address {
              value
            }
          }
        }
        # What a previous run already granted.
        granted_source_prefixes {
          edges {
            node {
              id
              prefix {
                value
              }
            }
          }
        }
        granted_rules {
          edges {
            node {
              id
              name {
                value
              }
            }
          }
        }
      }
    }
  }

  # ------------------------------------------------------------------------
  # The firewall's own context, fetched unfiltered because the generator
  # resolves against the whole set rather than by name.
  # ------------------------------------------------------------------------

  # SecurityPolicyRule.policy is mandatory and cardinality one, and the grant
  # does not name a policy. Exactly one policy targets the firewall; anything
  # else is an incomplete model and the generator raises.
  # EVERY OTHER GRANT, so withdrawal does not close a gate somebody else is
  # still using. Two grants may name the same source -- two sites behind one
  # prefix, or the same site asking for two applications -- and the
  # application's `allowed_source_prefixes` is one shared list. Removing what
  # THIS grant recorded without checking the others would revoke access nobody
  # revoked, and it would fail silently: the firewall would still permit the
  # session and the pod would drop it.
  ServiceAppAccess {
    edges {
      node {
        id
        name {
          value
        }
        status {
          value
        }
        application {
          node {
            id
          }
        }
        granted_source_prefixes {
          edges {
            node {
              id
            }
          }
        }
      }
    }
  }
  SecurityPolicy {
    edges {
      node {
        id
        name {
          value
        }
        device_target {
          node {
            id
            display_label
          }
        }
      }
    }
  }

  # The destination-zone lookup: match the application's VRF to a zone's.
  SecurityZone {
    edges {
      node {
        id
        name {
          value
        }
        vrf {
          node {
            id
          }
        }
      }
    }
  }

  # Adoption by (protocol, port), NOT by name. The firewall already declares
  # junos-http (80) and junos-https (443); a grant for 443 must reference the
  # existing object rather than declare a second application for the same
  # port, or the rendered configuration stops reading like the rules beside it.
  SecurityService {
    edges {
      node {
        id
        name {
          value
        }
        port {
          value
        }
        ip_protocol {
          node {
            id
            name {
              value
            }
          }
        }
      }
    }
  }

  # `tcp` and `icmp`. Only tcp is ever used here -- `ports` is a list of TCP
  # ports and ICMP is not requestable through a grant.
  SecurityIPProtocol {
    edges {
      node {
        id
        name {
          value
        }
      }
    }
  }

  # The address book, for two things: adopting an entry that already wraps the
  # grant's VIP, and knowing which book_index values are taken.
  #
  # The book is polymorphic and the value field differs per concrete kind, so a
  # fragment per kind is mandatory. `... on SecurityGenericAddress` would be
  # accepted by GraphQL and then yield None in the generated model, because it
  # discriminates on __typename -- which is always the concrete kind.
  SecurityGenericAddress {
    edges {
      node {
        id
        __typename
        ... on SecurityIPAMIPAddress {
          name {
            value
          }
          book_index {
            value
          }
          ip_address {
            node {
              id
            }
          }
        }
        ... on SecurityIPAMIPPrefix {
          name {
            value
          }
          book_index {
            value
          }
          # The wrapped prefix, so an entry an earlier run created for a derived
          # destination is FOUND rather than duplicated beside itself.
          ip_prefix {
            node {
              id
            }
          }
        }
        ... on SecurityPrefix {
          name {
            value
          }
          book_index {
            value
          }
        }
        ... on SecurityIPAddress {
          name {
            value
          }
          book_index {
            value
          }
        }
      }
    }
  }
}
