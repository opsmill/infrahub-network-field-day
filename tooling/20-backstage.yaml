---
# Backstage, in the tooling cluster.
#
# The portal is here rather than beside Infrahub on the host for one reason: a
# branch user has to reach it THROUGH the firewall. Reaching the request portal
# is itself a firewall decision -- `branch-to-tooling-portal` in
# objects/32_nfd41_security.yml is that permission -- so the tool for requesting
# access is itself behind an access rule.
#
# It talks to Infrahub at 10.90.0.1, the HOST's address on the tooling bridge.
# Not 172.20.41.1: that is the management network, and using it here would mean
# the portal depended on a path the branch cannot see, which is the asymmetry
# this whole design exists to remove.
apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-env
  namespace: nfd41-tooling
data:
  # Every URL the BROWSER will be sent to has to be one the branch desktop can
  # resolve and route to. That rules out localhost, the Tailscale name and the
  # management range, and leaves the tooling address.
  #
  # HTTPS, with a certificate the backend generates for itself. Not for privacy:
  # the frontend calls `crypto.randomUUID`, which exists only in a secure
  # context, so a portal served over plain HTTP signs a user in and then throws
  # `globalThis.crypto.randomUUID is not a function`. See app-config.docker.yaml.
  BACKSTAGE_BASE_URL: "https://10.90.0.11:32001"
  # Dex stays on HTTP. It is the IdP, not the origin the app runs on, and
  # nothing on the page loads from it -- the browser only ever navigates there
  # and back, which no mixed-content rule touches.
  BACKSTAGE_OIDC_METADATA_URL: "http://10.90.0.11:32556/dex/.well-known/openid-configuration"
  BACKSTAGE_OIDC_CLIENT_ID: "backstage"
  # Two addresses for one Infrahub, and they are the same string by coincidence
  # rather than by rule: the backend reaches it over the tooling bridge, the
  # branch user's browser reaches it through the firewall.
  INFRAHUB_ADDRESS: "http://10.90.0.1:8000"
  INFRAHUB_EXTERNAL_ADDRESS: "http://10.90.0.1:8000"
---
apiVersion: v1
kind: Secret
metadata:
  name: backstage-secrets
  namespace: nfd41-tooling
type: Opaque
stringData:
  # Lab values, committed on purpose, like everything else in auth/. The token
  # is the stack's initial admin token; the session secret signs the express
  # session the OIDC strategy keeps its state in.
  BACKSTAGE_OIDC_CLIENT_SECRET: "backstage-dex-secret"
  BACKSTAGE_SESSION_SECRET: "nfd41-lab-backstage-session-secret"
  INFRAHUB_API_TOKEN: "06438eb2-8019-4776-878c-0941b1f1d1ec"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: nfd41-tooling
spec:
  replicas: 1
  selector:
    matchLabels: {app: backstage}
  template:
    metadata:
      labels: {app: backstage}
    spec:
      containers:
        - name: backstage
          image: nfd41/backstage:local
          # There is no registry in this lab and the node's containerd cannot see
          # the host's docker images, so the image is imported directly. Stating
          # the policy means a bad tag fails as ErrImageNeverPull rather than as
          # a confusing attempt to reach docker.io.
          imagePullPolicy: IfNotPresent
          args:
            - "node"
            - "packages/backend"
            - "--config"
            - "app-config.yaml"
            - "--config"
            - "app-config.docker.yaml"
          envFrom:
            - configMapRef: {name: backstage-env}
            - secretRef: {name: backstage-secrets}
          env:
            # The certificate the backend serves, as configuration.
            - name: BACKSTAGE_TLS_CERT
              valueFrom:
                secretKeyRef: {name: backstage-tls, key: tls.crt}
            - name: BACKSTAGE_TLS_KEY
              valueFrom:
                secretKeyRef: {name: backstage-tls, key: tls.key}
            # ... and the same certificate as a trust anchor, because Backstage
            # calls ITSELF. The sign-in resolver looks the user up in the
            # catalog through `https://localhost:7007`, and Node refuses a
            # self-signed peer. The failure arrives inside the OIDC popup as
            #
            #   FetchError: request to https://localhost:7007/api/catalog/
            #   entities/by-name/User/default/alice failed
            #
            # which names the catalog and never mentions TLS. Pointing Node at
            # the certificate is the fix; `NODE_TLS_REJECT_UNAUTHORIZED=0` also
            # works and turns off verification for every outbound call.
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/backstage-tls/tls.crt
          volumeMounts:
            - name: tls
              mountPath: /etc/backstage-tls
              readOnly: true
          ports:
            - containerPort: 7007
          readinessProbe:
            httpGet:
              # HTTPS, and the probe must say so -- the backend now terminates
              # TLS itself. An `http` probe against it fails with an empty reply
              # and the pod never goes Ready, which reads as a crashing app.
              # kubelet does not verify the certificate, so self-signed is fine.
              scheme: HTTPS
              path: /.backstage/health/v1/readiness
              port: 7007
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: tls
          secret: {secretName: backstage-tls}
---
apiVersion: v1
kind: Service
metadata:
  name: backstage
  namespace: nfd41-tooling
spec:
  type: NodePort
  selector: {app: backstage}
  ports:
    - name: https
      port: 7007
      targetPort: 7007
      # Fixed, because it is named in three other places that must agree: the
      # base URL above, the Dex client's redirect URI, and the firewall's
      # `tooling-portal` service object. A NodePort allocated at random would
      # break all three silently.
      nodePort: 32001
