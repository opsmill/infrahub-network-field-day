query CrossplaneFabricAppQuery($name: String!) {
  target: ServiceFabricApp(name__value: $name) {
    edges {
      node {
        id
        name {
          value
        }
        # Cycle 036: a withdrawn application is probed by nobody, so its
        # FabricApp admits no collector.
        status {
          value
        }
        namespace_name {
          value
        }
        exposed {
          value
        }
        # Cycle 034: `dex` merges the lab identity provider's sign-in block into
        # the chart values. Declared, never inferred from the chart name.
        sso_provider {
          value
        }
        chart_repository {
          value
        }
        chart_name {
          value
        }
        chart_version {
          value
        }
        chart_values {
          value
        }
        service_selector {
          value
        }
        communities {
          value
        }
        workload_selector {
          value
        }
        policy_default_deny {
          value
        }
        policy_allow_dns {
          value
        }
        policy_allow_intra_namespace {
          value
        }
        policy_allow_egress_api_server {
          value
        }
        policy_allow_egress_internet {
          value
        }
        policy_allow_ports {
          value
        }
        vrf {
          node {
            id
            name {
              value
            }
          }
        }
        vip_block {
          node {
            id
            prefix {
              value
            }
          }
        }
        # A security control: these are the networks permitted to reach the
        # application. Rendered as policy.allowFrom, and the field where a
        # silent change is most damaging.
        allowed_source_prefixes {
          edges {
            node {
              id
              prefix {
                value
              }
            }
          }
        }
        # Cycle 036: what the collector probes. Only an application advertising
        # a TCP service is probed, so only one is ever admitted.
        advertised_services {
          edges {
            node {
              id
              port {
                value
              }
              ip_protocol {
                node {
                  id
                  name {
                    value
                  }
                }
              }
            }
          }
        }
        # The payload attachments added by cycle 013. Only metadata comes back
        # here -- the content lives in object storage and is fetched with
        # download_file(), which is why this transform is async.
        values_file {
          node {
            id
            file_name {
              value
            }
            checksum {
              value
            }
          }
        }
      }
    }
  }
  # Cycle 036: WHO PROBES THIS APPLICATION. Every service profile, with its
  # collector's namespace; the transform keeps the enabled ones asking for
  # service-reachability of applications, and renders their namespaces as
  # spec.monitoring.collectorNamespaces. The same derivation decides which
  # probes the Telemetry Collector Configuration renders, so a probe and the
  # gate it passes through cannot disagree. Ids so the artifact's query group
  # names the profiles, and an edit to one re-renders this.
  MonitoringProfile {
    edges {
      node {
        id
        name {
          value
        }
        enabled {
          value
        }
        service_kind {
          value
        }
        measurements {
          edges {
            node {
              id
              name {
                value
              }
            }
          }
        }
        collector {
          node {
            id
            namespace_name {
              value
            }
          }
        }
      }
    }
  }
}
