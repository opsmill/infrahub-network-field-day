# The Telemetry Collector Configuration artifact's query (cycle 034).
#
# One collector, its profiles, and every member of every group a profile names
# -- through one inline fragment per device kind, because the four kinds are
# siblings under DcimGenericDevice and a fragment that names the wrong one
# returns nothing rather than an error.
#
# THE ADDRESS DIFFERS BY KIND ON PURPOSE. A switch is observed at its
# `mgmt_ip`, the address eAPI already uses; the other three kinds at their
# `telemetry_address`, which the reconciler never reads. They are the same
# management network either way.
query TelemetryCollectorConfigQuery($name: String!) {
  MonitoringCollector(name__value: $name) {
    edges {
      node {
        id
        name { value }
        namespace_name { value }
        config_map_name { value }
        monitoring_profiles {
          edges {
            node {
              name { value }
              enabled { value }
              interval_seconds { value }
              device_role { value }
              service_kind { value }
              timeout_seconds { value }
              measurements { edges { node { name { value } } } }
              device_groups {
                edges {
                  node {
                    name { value }
                    members {
                      edges {
                        node {
                          __typename
                          ... on DcimFabricSwitch {
                            name { value }
                            role { value }
                            mgmt_ip { node { address { value } } }
                            rack { node { name { value } } }
                            pod { node { name { value } } }
                            # The stored structured config: the intended BGP
                            # neighbours are read from what the device renders.
                            avd_artifact { node { structured_config_file { node { id } } } }
                          }
                          ... on DcimDevice {
                            name { value }
                            role { value }
                            telemetry_address { node { address { value } } }
                            bgp_neighbors { edges { node { peer_address { value } remote_as { value } } } }
                          }
                          ... on SecurityFirewall {
                            name { value }
                            role { value }
                            telemetry_address { node { address { value } } }
                            snmp_community { value }
                          }
                          ... on ComputePhysicalServer {
                            name { value }
                            role { value }
                            telemetry_address { node { address { value } } }
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
        }
      }
    }
  }
  # Cabling, for the intended-link series. Unfiltered and small; the transform
  # keeps only links with a watched device on at least one end.
  NetworkLink {
    edges {
      node {
        connected_endpoints {
          edges {
            node {
              __typename
              # CONCRETE KINDS, not `... on DcimInterface`. The return-type
              # generator types a fragment on a generic as a literal
              # `__typename: "DcimInterface"`, which no node ever reports, so
              # every endpoint parses as the fieldless fallback and the link
              # series comes out empty -- with nothing raised.
              ... on InterfacePhysical {
                name { value }
                status { value }
                device { node { __typename name { value } } }
              }
              ... on SecurityFirewallInterface {
                name { value }
                status { value }
                device { node { __typename name { value } } }
              }
            }
          }
        }
      }
    }
  }
  # SERVICES (cycle 035), every one of them: a service profile selects by kind,
  # and the WAN kinds are in no group, so there is nothing narrower to ask for.
  # One fragment per concrete kind, for exactly what its measurements join on --
  # the transform never decides WHETHER a service is watched from these fields,
  # only HOW a measurement a profile asked for is rendered for it.
  ServiceGeneric {
    edges {
      node {
        __typename
        name { value }
        status { value }
        owner { node { __typename display_label } }
        ... on ServiceFabricApp {
          namespace_name { value }
          exposed { value }
          policy_default_deny { value }
          allowed_source_prefixes { count }
          vip_block { node { prefix { value } } }
          values_file { node { id } }
          advertised_services {
            edges { node { name { value } port { value } ip_protocol { node { name { value } } } } }
          }
        }
        ... on ServiceAppAccess {
          requester { value }
          application { node { name { value } } }
          source_zone { node { name { value } } }
          source_site { node { name { value } } }
          granted_rules {
            edges {
              node {
                name { value }
                destination_zone { node { name { value } } }
                policy { node { device_target { node { name { value } } } } }
              }
            }
          }
        }
        ... on ServiceL3vpn {
          circuits { edges { node { id } } }
        }
        ... on ServiceInternetAccess {
          peering {
            node {
              bgp_sessions { edges { node { peer_address { value } device { node { name { value } } } } } }
            }
          }
        }
        ... on ServiceTenantCloud {
          vrf { node { name { value } } }
        }
        ... on ServiceTenantOnboarding {
          evpn_tenant { node { vrfs { edges { node { name { value } } } } } }
        }
        ... on ServiceNetworkSegment {
          svi { node { svi_id { value } vrf { node { name { value } } } } }
          avd_tags {
            edges {
              node {
                racks {
                  edges {
                    node {
                      devices { edges { node { __typename ... on DcimFabricSwitch { name { value } } } } }
                    }
                  }
                }
              }
            }
          }
        }
        ... on ServiceServerPlacement {
          server { node { name { value } } }
        }
        ... on ServiceFabricPeering {
          peerings {
            edges {
              node {
                peer_device { node { __typename name { value } } }
                svi { node { vrf { node { name { value } } } } }
              }
            }
          }
        }
      }
    }
  }
  # The attachment sessions of every WAN site, keyed by circuit: an L3VPN names
  # circuits, and a site records both ends of the session that runs over one.
  WanSite {
    edges {
      node {
        circuit { node { id } }
        bgp_sessions { edges { node { peer_address { value } device { node { name { value } } } } } }
      }
    }
  }
}
