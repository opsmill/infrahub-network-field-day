query SrlConfigQuery($device: String!) {
  # The render target. `RoutingBGPNeighbor` is fetched from the DEVICE as well as
  # from each site, because three of the ten sessions belong to no site at all:
  # the iBGP pair between the PEs and the two fabric handoffs are provider
  # infrastructure rather than tenant attachments.
  #
  # `interfaces` is what frr_config never needed: under FRR a boot script owned
  # the addresses, and SR Linux owns its own. The fragments name the CONCRETE
  # kinds for the same reason as on IpamIPAddress below -- the generated model
  # discriminates on __typename, and `... on DcimInterface` would silently fall
  # back to a variant with no fields at all.
  target: DcimDevice(name__value: $device) {
    edges {
      node {
        id
        name { value }
        role { value }
        description { value }
        router_id { node { address { value } } }
        asn { node { asn { value } } }
        bgp_neighbors {
          edges {
            node {
              peer_address { value }
              remote_as { value }
              description { value }
            }
          }
        }
        interfaces {
          edges {
            node {
              __typename
              ... on InterfacePhysical {
                name { value }
                role { value }
                mtu { value }
                l2_mode { value }
                ip_addresses { edges { node { address { value } } } }
              }
              ... on InterfaceVirtual {
                name { value }
                role { value }
                mtu { value }
                l2_mode { value }
                ip_addresses { edges { node { address { value } } } }
              }
            }
          }
        }
      }
    }
  }

  # The provider's own devices, needed by every template: a CE names its PE, and
  # the PEs name each other.
  DcimDevice(role__values: ["isp_edge", "isp_core", "internet_edge", "branch_router"]) {
    edges {
      node {
        name { value }
        role { value }
        router_id { node { address { value } } }
        asn { node { asn { value } } }
        bgp_neighbors {
          edges {
            node { peer_address { value } remote_as { value } description { value } }
          }
        }
      }
    }
  }

  WanSite {
    edges {
      node {
        name { value }
        attachment_kind { value }
        site_asn { value }
        tenant { node { name { value } } }
        lan_prefix { node { prefix { value } } }
        bgp_sessions {
          edges {
            node {
              peer_address { value }
              remote_as { value }
              device { node { name { value } role { value } } }
            }
          }
        }
        static_routes {
          edges { node { prefix { value } next_hop { value } } }
        }
      }
    }
  }

  # The service layer. `dc_service_prefixes` is the shared DC range; the tenant
  # cloud subnet and the PE VRF come from their own kinds; and the PRESENCE of a
  # ServiceInternetAccess is what decides whether a tenant gets a default route.
  #
  # `status` is selected on all three so a decommissioned service can be
  # treated as ABSENT. Without it, marking a tenant's L3VPN decommissioned left
  # the provider edge still importing its prefixes -- the service said gone and
  # the router said up, with nothing reporting the disagreement.
  ServiceL3vpn {
    edges {
      node {
        name { value }
        status { value }
        tenant { node { name { value } } }
        vrf { node { name { value } } }
        dc_service_prefixes { edges { node { prefix { value } } } }
      }
    }
  }

  ServiceTenantCloud {
    edges {
      node {
        name { value }
        status { value }
        tenant { node { name { value } } }
        prefix { node { prefix { value } } }
      }
    }
  }

  ServiceInternetAccess {
    edges {
      node {
        name { value }
        status { value }
        l3vpn { node { tenant { node { name { value } } } } }
      }
    }
  }

  # The admin account the whole lab shares. The artifact is a FULL replace, so
  # the router's own login has to be in it; this is the same object -- and the
  # same sha512-crypt hash -- the fabric switches render through AVD. Only a hash
  # is ever stored or rendered; srl_config refuses any other password_type.
  NetworkLocalUser(name__value: "admin") {
    edges {
      node {
        name { value }
        password_type { value }
        password { value }
      }
    }
  }

  WanInternetPeering {
    edges {
      node {
        name { value }
        peer_asn { value }
        customer_aggregate { node { prefix { value } } }
        internet_prefixes { edges { node { prefix { value } } } }
      }
    }
  }

  # Address -> interface -> device, so a statically attached site's CE can be
  # resolved from its static route's next hop. `name` and `device` are NOT
  # selectable on InterfaceLayer3, which is what `interface` peers with, so the
  # inline fragment is mandatory.
  IpamIPAddress {
    edges {
      node {
        address { value }
        interface {
          node {
            __typename
            # The fragment must name the CONCRETE kinds the server returns.
            # `... on DcimInterface` is accepted by GraphQL, but the generated
            # Pydantic model discriminates on __typename -- which is
            # InterfacePhysical or InterfaceVirtual, never DcimInterface -- so
            # the typed result would silently fall back to a variant with no
            # `device` field.
            ... on InterfacePhysical {
              name { value }
              role { value }
              device { node { __typename name { value } } }
            }
            ... on InterfaceVirtual {
              name { value }
              role { value }
              device { node { __typename name { value } } }
            }
          }
        }
      }
    }
  }
}
