---
# Contract: the three sync declarations. Cluster-scoped; one per artifact name.
#
# `artefactName` values MUST equal the `artifact_name` fields in .infrahub.yml
# exactly -- spaces and capitals included. They are display names, and a mismatch
# fails silently: the query returns no artifacts and the sync reports success
# over an empty set.
#
# `targetBranch: main` is what makes the trigger a *merge*. A feature branch
# regenerates its own artifacts and they must not reach the cluster.
apiVersion: infrahub.operators.com/v1alpha1
kind: InfrahubSync
metadata:
  name: crossplane-fabric-peering
spec:
  source:
    infrahubAPIURL: "http://172.20.41.1:8000"
    targetBranch: "main"
    artefactName: "Crossplane FabricPeering"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "default"
    reconcileOnEvents: false

---
# A separate declaration from the peering one, for the reason already recorded in
# .infrahub.yml: applications and peerings are different target groups, and one
# declaration pointed at both would try to deliver a resource it cannot render.
apiVersion: infrahub.operators.com/v1alpha1
kind: InfrahubSync
metadata:
  name: crossplane-fabric-app
spec:
  source:
    infrahubAPIURL: "http://172.20.41.1:8000"
    targetBranch: "main"
    artefactName: "Crossplane FabricApp"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "default"
    reconcileOnEvents: false

---
# The telemetry collector's configuration (cycle 034): a ConfigMap rendered from
# the monitoring profiles, delivered into the namespace Telegraf runs in rather
# than into `default`, because a pod can only mount a ConfigMap from its own
# namespace. Applied before that namespace exists, it fails and retries on
# `requeueSyncAfter` until otternet-telemetry's FabricApp has created it.
#
# A merge that changes what is monitored moves this artifact; Telegraf's
# `--watch-config poll` picks the new file up once the kubelet has projected the
# updated ConfigMap, about a minute later.
apiVersion: infrahub.operators.com/v1alpha1
kind: InfrahubSync
metadata:
  name: telemetry-collector-config
spec:
  source:
    infrahubAPIURL: "http://172.20.41.1:8000"
    targetBranch: "main"
    artefactName: "Telemetry Collector Configuration"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "otternet-telemetry"
    reconcileOnEvents: false

---
# The lab resolver's Corefile and zone (specs/037-lab-dns-service): a ConfigMap
# rendered from the names Infrahub holds -- one per exposed, live application --
# delivered into the resolver's namespace, where CoreDNS mounts it as `lab-dns`.
# A merge that adds or withdraws an application moves this artifact, and the
# resolver's `file` plugin reloads the zone once the kubelet has projected the
# updated ConfigMap, about a minute later.
#
# Applied only once `otternet-dns` exists: the ConfigMap names that namespace, and
# the namespace is composed by the application's own FabricApp.
apiVersion: infrahub.operators.com/v1alpha1
kind: InfrahubSync
metadata:
  name: dns-zone-config
spec:
  source:
    infrahubAPIURL: "http://172.20.41.1:8000"
    targetBranch: "main"
    artefactName: "DNS Zone Configuration"
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "otternet-dns"
    reconcileOnEvents: false
