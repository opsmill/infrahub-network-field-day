---
# ============================================================================
# NFD41 — tenants, VRFs and VLANs.
#
# Six VRFs across four tenants, and the isolation between them is structural
# rather than policy: no VRF imports another's route targets anywhere in the
# fabric, so there is no east-west path to filter in the first place. Each VRF's
# only way out is a default route pointing at its own firewall zone, which is
# what makes the firewall unavoidable rather than decorative. Those default
# routes and handoffs are in 27_nfd41_vrf_services.yml.
#
#   TENANT_K8S       K8S_PROD       Kubernetes nodes, Cilium peers BGP in
#   TENANT_APP       APP_PROD       classic bare-metal application tier
#   TENANT_CLOUD     TENANT_ACME    acme's isolated cloud instances
#                    TENANT_GLOBEX  globex's isolated cloud instances
#   TENANT_EXTERNAL  WAN            ISP transit for WAN customers
#                    BRANCH         our own office, private circuit
#
# WAN and BRANCH are separate VRFs because a paying WAN customer and our own
# branch office are not the same trust level and should not be able to become
# each other's problem.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamL2Domain
  data:
    - name: NFD41-L2Domain
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamVLAN
  data:
    - name: K8S_NODES
      vlan_id: 110
      status: active
      role: server
      l2domain: NFD41-L2Domain
    - name: APP_HOSTS
      vlan_id: 210
      status: active
      role: server
      l2domain: NFD41-L2Domain
    - name: ACME_CLOUD
      vlan_id: 310
      status: active
      role: server
      l2domain: NFD41-L2Domain
    - name: GLOBEX_CLOUD
      vlan_id: 320
      status: active
      role: server
      l2domain: NFD41-L2Domain
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamVRF
  data:
    - name: K8S_PROD
      description: "Kubernetes production - Cilium peers BGP from the nodes"
      namespace: default
      vrf_id: 110
      vrf_vni: 110
      enable_mlag_ibgp_peering_vrfs: true
      redistribute_connected: true
      redistribute_static: true
    - name: APP_PROD
      description: "Classic bare-metal application tier"
      namespace: default
      vrf_id: 210
      vrf_vni: 210
      enable_mlag_ibgp_peering_vrfs: true
      redistribute_connected: true
      redistribute_static: true
    - name: TENANT_ACME
      description: "acme - isolated cloud instances"
      namespace: default
      vrf_id: 310
      vrf_vni: 310
      enable_mlag_ibgp_peering_vrfs: true
      redistribute_connected: true
      redistribute_static: true
    - name: TENANT_GLOBEX
      description: "globex - isolated cloud instances"
      namespace: default
      vrf_id: 320
      vrf_vni: 320
      enable_mlag_ibgp_peering_vrfs: true
      redistribute_connected: true
      redistribute_static: true
    # WAN and BRANCH exist on border-leaf1 only: there is nothing to stretch,
    # because no other leaf has a port in them.
    - name: WAN
      description: "ISP transit - WAN customers"
      namespace: default
      vrf_id: 50
      vrf_vni: 50
      redistribute_connected: true
      redistribute_static: true
    - name: BRANCH
      description: "Branch office - private circuit, no ISP in path"
      namespace: default
      vrf_id: 70
      vrf_vni: 70
      redistribute_connected: true
      redistribute_static: true
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: EvpnTenant
  data:
    - name: TENANT_K8S
      description: "Kubernetes tenant"
      mac_vrf_vni_base: 11000
      fabrics:
        - "NFD41_FABRIC"
      vrfs:
        - K8S_PROD
    - name: TENANT_APP
      description: "Classic application tenant"
      mac_vrf_vni_base: 12000
      fabrics:
        - "NFD41_FABRIC"
      vrfs:
        - APP_PROD
    - name: TENANT_CLOUD
      description: "Per-WAN-tenant isolated cloud instances in the datacentre"
      mac_vrf_vni_base: 13000
      fabrics:
        - "NFD41_FABRIC"
      vrfs:
        - TENANT_ACME
        - TENANT_GLOBEX
    - name: TENANT_EXTERNAL
      description: "Everything that reaches the datacentre from outside it"
      mac_vrf_vni_base: 15000
      fabrics:
        - "NFD41_FABRIC"
      vrfs:
        - WAN
        - BRANCH
