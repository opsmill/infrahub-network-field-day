---
# The VIP a branch user's access request will name.
#
# THE SEEDED GRANT ITSELF IS GONE. It existed to be the thing you flip: the kind
# had `approved`, the grant shipped with it false, and the whole demo was one
# field away. Removing that gate -- a branch already decides whether a request
# reaches a device -- left the grant with no job, and an ungated seed grant
# would materialise a rule, a service object and an address-book entry into the
# default data set permanently. The rendered Junos artifact is held byte-for-
# byte against the hand-written baseline on fw1, which has no such rule, so
# there would be nothing true to update those assertions to.
#
# A real request takes about thirty seconds through the portal, and that is the
# workflow worth demonstrating anyway.
#
# The lab is still staged for it. `access-portal` in
# objects/32_nfd41_security.yml is "The only DC service the branch may reach
# before requesting access", and the branch -> k8s-prod zone pair permits
# branch-users to reach it and nothing else. This address is what a request
# names next.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    # Inside nfd41-demo's own vip_block (10.112.240.0/28), so the grant names
    # an address the application could actually be advertising. Outside that
    # block the firewall would permit a session to somewhere the border leaf
    # never re-advertises -- permitted and unroutable, which is the failure the
    # schema comment on destination_vip assigns to a check.
    - address: 10.112.240.10/32
      description: "The nfd41-demo frontend VIP"
