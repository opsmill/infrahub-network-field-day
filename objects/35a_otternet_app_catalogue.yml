---
# The application catalogue (specs/035-application-catalogue).
#
# Loads BEFORE 36_otternet_app_services.yml, which names these entries from its
# applications. `35a_` sorts between `35_` and `36_` (underscore before `a`),
# and files load in filename order; tests/unit/test_object_load_order.py and
# tests/unit/test_application_catalogue_seed_data.py hold it.
#
# TWO KINDS OF ENTRY.
#
# `whoami` is the one a requester may pick: `requestable: true`. Everything the
# portal used to ask for -- chart, version, values, ports, block size, selector --
# is decided here instead, by the platform team.
#
# The three `lab-*` entries describe the lab's own infrastructure applications
# and are `requestable: false`, so they never appear in the portal picker. They
# exist so that those applications are catalogue entries too and point at them;
# each application carries its own pinned copy of the chart (and
# `definition_pinned: true`), so its rendered output does not move.
#
# `default_values` IS TEXT, never JSON: Infrahub 1.10.6 answers HTTP 500 for a
# JSON key containing a dot or a slash, and the values below are full of both
# (otternet.lab/advertise, app.kubernetes.io/name). `whoami`'s are inline, being
# short. The three `lab-*` entries leave `default_values` to
# scripts/seed_app_payloads.py, which sets it from the SAME payload file
# (payloads/*.yaml, as committed) the application's own attachment comes from,
# so git holds one source. The metrics attachment also has dashboards folded in at
# upload; the entry deliberately does not carry those 220 KB.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ServiceApplicationDefinition
  data:
    - name: whoami
      title: "Who am I"
      description: "A small web service that answers with the details of each request it receives"
      status: active
      requestable: true
      chart_repository: https://cowboysysop.github.io/charts/
      chart_name: whoami
      chart_version: "6.0.0"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      # `junos-http` is 80/tcp and already declared by the firewall, so a grant
      # references it rather than creating a second object for the same port.
      default_advertised_services:
        - junos-http
      # THE EXPOSURE BLOCK IS WHY THESE ARE NOT OPTIONAL. An application can hold
      # a VIP block, carry a firewall rule permitting it, and still answer
      # nothing, because a chart's Service is ClusterIP by default. The Service
      # has to be a LoadBalancer AND carry the label named in
      # `default_service_selector`, and externalTrafficPolicy has to be Local or
      # the pod sees a node address and the source-prefix policy cannot apply.
      default_values: |
        replicaCount: 1

        service:
          type: LoadBalancer
          externalTrafficPolicy: Local
          ports:
            http: 80

        commonLabels:
          otternet.lab/advertise: "true"

    - name: podinfo
      title: "Podinfo"
      description: "A small Go web service with a status page, health endpoints and a JSON API, a common Kubernetes demo workload"
      status: active
      requestable: true
      chart_repository: https://stefanprodan.github.io/podinfo
      chart_name: podinfo
      chart_version: "6.15.0"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-http
      # podinfo listens on 9898 and the firewall's `junos-http` is 80/tcp, so the
      # Service publishes 80 and targets the container port by name. The label
      # the selector matches goes on the Service through `additionalLabels`
      # (this chart has no commonLabels).
      default_values: |
        replicaCount: 1

        service:
          type: LoadBalancer
          externalTrafficPolicy: Local
          externalPort: 80
          additionalLabels:
            otternet.lab/advertise: "true"

    # A static web page, served by nginx, for an application that only needs to be a
    # website. The page is in the values, as a ConfigMap the chart mounts over nginx's
    # document root, so changing the page is a catalogue edit and needs no image build.
    # `bjw-s/app-template` is a generic chart: it runs any image from values. The image
    # is the unprivileged nginx, which listens on 8080, so the Service publishes 80
    # (`junos-http`) and targets 8080. This chart's Service takes labels under
    # `service.<name>.labels`, and `externalTrafficPolicy` is set here because the chart
    # is not in crossplane_fabric_app's known-chart map and an unknown chart must say
    # `Local` itself.
    - name: otternet-site
      title: "OTTERNET web page"
      description: "A static web page served by nginx, showing the network path to it, with two replicas"
      status: active
      requestable: true
      chart_repository: https://bjw-s-labs.github.io/helm-charts
      chart_name: app-template
      chart_version: "5.2.1"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-http
      default_values: |
        controllers:
          main:
            replicas: 2
            containers:
              main:
                image:
                  repository: docker.io/nginxinc/nginx-unprivileged
                  tag: 1.29-alpine

        service:
          main:
            controller: main
            type: LoadBalancer
            externalTrafficPolicy: Local
            labels:
              otternet.lab/advertise: "true"
            ports:
              http:
                port: 80
                targetPort: 8080

        configMaps:
          site:
            data:
              index.html: |
                <!doctype html>
                <html lang="en">
                <head>
                  <meta charset="utf-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <title>Otter Shop</title>
                  <style>
                    body { font-family: system-ui, sans-serif; margin: 0; color: #1f2d3a; background: #f4f8fa; }
                    header { background: #12475f; color: #fff; padding: 1.5rem 2rem; }
                    header h1 { margin: 0; font-size: 1.8rem; }
                    header p { margin: .3rem 0 0; opacity: .85; }
                    main { max-width: 56rem; margin: 2rem auto; padding: 0 1rem; }
                    h2 { font-size: 1.15rem; margin: 2rem 0 .6rem; }
                    .card { background: #fff; border: 1px solid #d5e1e8; border-radius: 6px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
                    .path { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
                    .hop { background: #e3f0f6; border: 1px solid #9cc3d5; border-radius: 4px; padding: .35rem .6rem;
                      font-family: ui-monospace, monospace; font-size: .85rem; }
                    .hop.fw { background: #fde9d9; border-color: #e0a77a; }
                    .arrow { color: #5a6b78; }
                    table { border-collapse: collapse; width: 100%; font-size: .92rem; }
                    th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #e3ebf0; }
                    th { color: #5a6b78; font-weight: 600; }
                    code { font-family: ui-monospace, monospace; background: #eef3f6; padding: .05rem .3rem; border-radius: 3px; }
                    ol { margin: .3rem 0 0 1.2rem; padding: 0; }
                    footer { text-align: center; font-size: .85rem; color: #5a6b78; padding: 1.5rem; }
                  </style>
                </head>
                <body>
                  <header>
                    <h1>Otter Shop</h1>
                    <p>An OTTERNET web service, and the network path that carried you to it</p>
                  </header>
                  <main>
                    <h2>The path from the branch office</h2>
                    <div class="card">
                      <div class="path">
                        <span class="hop">branch-desktop</span><span class="arrow">&rarr;</span>
                        <span class="hop">branch-rtr</span><span class="arrow">&rarr;</span>
                        <span class="hop">border-leaf1</span><span class="arrow">&rarr;</span>
                        <span class="hop fw">fw1 (zone branch to zone k8s-prod)</span><span class="arrow">&rarr;</span>
                        <span class="hop">border-leaf1</span><span class="arrow">&rarr;</span>
                        <span class="hop">spines</span><span class="arrow">&rarr;</span>
                        <span class="hop">k8s-leaf</span><span class="arrow">&rarr;</span>
                        <span class="hop">Kubernetes node</span><span class="arrow">&rarr;</span>
                        <span class="hop">this pod</span>
                      </div>
                    </div>

                    <h2>Three gates decide whether you reached this page</h2>
                    <div class="card">
                      <ol>
                        <li><strong>The route.</strong> The cluster advertises this application's virtual IP address to
                          the fabric over BGP, from the nodes that run its pods.</li>
                        <li><strong>The firewall.</strong> A rule on <code>fw1</code> permits your source network to
                          reach the virtual IP address on TCP port 80.</li>
                        <li><strong>The pod policy.</strong> A Cilium network policy admits only the source prefixes
                          the application was granted.</li>
                      </ol>
                    </div>

                    <h2>Networks in the lab</h2>
                    <div class="card">
                      <table>
                        <tr><th>Network</th><th>Prefix</th></tr>
                        <tr><td>Kubernetes pods</td><td><code>10.111.0.0/16</code></td></tr>
                        <tr><td>Kubernetes services</td><td><code>10.112.0.0/16</code></td></tr>
                        <tr><td>LoadBalancer virtual IP addresses</td><td><code>10.112.240.0/24</code></td></tr>
                        <tr><td>Names, resolved from the Infrahub zone</td><td><code>&lt;application&gt;.int.otternet.lab</code></td></tr>
                      </table>
                    </div>
                  </main>
                  <footer>Served by nginx in the OTTERNET lab cluster. Its address, route, firewall rule and DNS name
                    are all declared in Infrahub.</footer>
                </body>
                </html>

        persistence:
          site:
            type: configMap
            identifier: site
            globalMounts:
              - path: /usr/share/nginx/html
                readOnly: true

    - name: grafana
      title: "Grafana"
      description: "Dashboards and visualisation, on its own with no data source configured"
      status: active
      requestable: true
      chart_repository: https://grafana.github.io/helm-charts
      chart_name: grafana
      chart_version: "10.5.15"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-http
      default_values: |
        replicas: 1

        service:
          type: LoadBalancer
          externalTrafficPolicy: Local
          port: 80
          labels:
            otternet.lab/advertise: "true"

    - name: argo-cd
      title: "Argo CD"
      description: "Declarative GitOps continuous delivery for Kubernetes, with its web interface"
      status: active
      requestable: true
      chart_repository: https://argoproj.github.io/argo-helm
      chart_name: argo-cd
      chart_version: "10.9.6"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-http
      # The web interface is the argocd-server Service, so the exposure keys sit
      # under `server.service`. Dex and the notifications controller are switched
      # off: a demo needs the interface, not single sign-on or alerting.
      # Argo CD's `redis-secret-init` job runs before the install and calls the Kubernetes API to
      # create the Redis password Secret. The namespace denies all egress by default, so without
      # this the job times out on `10.112.0.1:443` and the release stays `failed`.
      default_policy_allow_egress_api_server: true
      default_values: |
        dex:
          enabled: false

        notifications:
          enabled: false

        server:
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
            labels:
              otternet.lab/advertise: "true"

    - name: lab-whoami
      title: "OTTERNET demo workload"
      description: "The lab's own whoami demonstration, three replicas across the fabric"
      status: active
      requestable: false
      chart_repository: https://cowboysysop.github.io/charts/
      chart_name: whoami
      chart_version: "6.0.0"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-http

    - name: lab-metrics
      title: "OTTERNET metrics"
      description: "Grafana and Prometheus: the lab's own observability"
      status: active
      requestable: false
      chart_repository: https://prometheus-community.github.io/helm-charts
      chart_name: kube-prometheus-stack
      chart_version: "90.0.0"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-http

    - name: lab-telemetry
      title: "OTTERNET telemetry"
      description: "Telegraf: device telemetry, collected as Infrahub's monitoring profiles say"
      status: active
      requestable: false
      chart_repository: https://helm.influxdata.com/
      chart_name: telegraf
      chart_version: "1.8.77"
      default_vip_block_size: 28

    # THE LAB'S RESOLVER (specs/037-lab-dns-service). Not requestable: nobody
    # asks for a DNS server, the lab has one. Its `default_values` come from
    # payloads/otternet-dns-values.yaml, the same file the application's own
    # attachment comes from, by scripts/seed_app_payloads.py.
    - name: lab-dns
      title: "OTTERNET resolver"
      description: "CoreDNS: the lab's resolver, configured entirely from the names Infrahub holds"
      status: active
      requestable: false
      chart_repository: https://coredns.github.io/helm
      chart_name: coredns
      chart_version: "1.48.2"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-dns-udp
        - junos-dns-tcp
