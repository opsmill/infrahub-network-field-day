                  </header>
                  <main>

                    <div class="grid">
                      <div class="card"><h3><a href="request.html">Request an application</a></h3><p>The steps from the portal to a working address.</p></div>
                      <div class="card"><h3><a href="services.html">Services</a></h3><p>What OTTERNET offers a tenant or a branch.</p></div>
                      <div class="card"><h3><a href="network.html">How the network is built</a></h3><p>The fabric, the firewall, the WAN and the cluster.</p></div>
                      <div class="card"><h3><a href="onboarding.html">Onboarding</a></h3><p>A checklist for a new engineer.</p></div>
                      <div class="card"><h3><a href="glossary.html">Glossary</a></h3><p>The lab's terms in one sentence each.</p></div>
                      <div class="card"><h3><a href="changelog.html">Changelog</a></h3><p>What changed in the lab, by date.</p></div>
                      <div class="card"><h3><a href="incidents.html">Incidents</a></h3><p>What went wrong, and what fixed it.</p></div>
                      <div class="card"><h3><a href="brand.html">Brand</a></h3><p>The name, the colours and how to use them.</p></div>
