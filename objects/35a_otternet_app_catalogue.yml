              network.html: |
                <!doctype html>
                <html lang="en">
                <head>
                  <meta charset="utf-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <title>OTTERNET wiki</title>
                  <link rel="stylesheet" href="otternet.css">
                </head>
                <body>
                  <header>
                    <h1>OTTERNET wiki</h1>
                    <p>The four parts of the lab</p>
                    <nav><a href="index.html">Home</a><a href="request.html">Request an application</a><a href="services.html">Services</a><a href="network.html" class="here">How the network is built</a><a href="onboarding.html">Onboarding</a><a href="glossary.html">Glossary</a><a href="changelog.html">Changelog</a><a href="incidents.html">Incidents</a><a href="brand.html">Brand</a></nav>
                  </header>
                  <main>

                    <div class="grid">
                      <div class="card"><h3>The data centre fabric</h3><p>Arista switches in a spine and leaf design. The two spines are <code>spine1</code> and <code>spine2</code>, and the leaves include <code>k8s-leaf1</code>, <code>k8s-leaf2</code>, <code>app-leaf1</code>, <code>app-leaf2</code> and <code>border-leaf1</code>. The fabric runs BGP with EVPN.</p></div>
                      <div class="card"><h3>The firewall</h3><p><code>fw1</code> is a Junos firewall. Every path between two networks crosses it, in a zone pair such as <code>branch</code> to <code>k8s-prod</code>.</p></div>
                      <div class="card"><h3>The WAN</h3><p>Two provider edge routers, <code>isp-pe1</code> and <code>isp-pe2</code>, run SR Linux in AS 65500. Each tenant gets one VRF on them.</p></div>
                      <div class="card"><h3>The Kubernetes cluster</h3><p>Cilium advertises each application's virtual IP address to the fabric over BGP. Applications run in this cluster.</p></div>
                    </div>
                    <h2>Where the intent lives</h2>
                    <div class="card"><p>Infrahub holds the intended state. Generators build the technical objects from a request, transforms render the configurations, and a reconciler compares each device with its rendered configuration and pushes any difference.</p></div>
                  </main>
                  <footer>OTTERNET lab. Served by nginx in the lab cluster.</footer>
                </body>
                </html>
              onboarding.html: |
                <!doctype html>
                <html lang="en">
                <head>
                  <meta charset="utf-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <title>OTTERNET wiki</title>
                  <link rel="stylesheet" href="otternet.css">
                </head>
                <body>
                  <header>
                    <h1>OTTERNET wiki</h1>
                    <p>A checklist for a new engineer</p>
                    <nav><a href="index.html">Home</a><a href="request.html">Request an application</a><a href="services.html">Services</a><a href="network.html">How the network is built</a><a href="onboarding.html" class="here">Onboarding</a><a href="glossary.html">Glossary</a><a href="changelog.html">Changelog</a><a href="incidents.html">Incidents</a><a href="brand.html">Brand</a></nav>
                  </header>
                  <main>
                <div class="note">The names, roles and contact details on this page are invented for the lab. No source describes OTTERNET as a company.</div>
                    <div class="card"><ol>
                      <li>Sign in to Infrahub as your own user, not as an administrator.</li>
                      <li>Open the lab's demo runbook and read the section on the three gates: route, firewall, pod policy.</li>
                      <li>Request <strong>OTTERNET wiki</strong> from the portal and watch the proposed change build.</li>
                      <li>Find the new application's name in the address plan page of the network site.</li>
                      <li>Resolve that name from the branch machine with <code>nslookup</code>.</li>
                      <li>Withdraw the application and confirm the name stops resolving.</li>
                    </ol></div>
                  </main>
                  <footer>OTTERNET lab. Served by nginx in the lab cluster.</footer>
                </body>
                </html>
              request.html: |
                <!doctype html>
                <html lang="en">
                <head>
                  <meta charset="utf-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <title>OTTERNET wiki</title>
                  <link rel="stylesheet" href="otternet.css">
                </head>
                <body>
                  <header>
                    <h1>OTTERNET wiki</h1>
                    <p>How a person at the branch gets an application</p>
                    <nav><a href="index.html">Home</a><a href="request.html" class="here">Request an application</a><a href="services.html">Services</a><a href="network.html">How the network is built</a><a href="onboarding.html">Onboarding</a><a href="glossary.html">Glossary</a><a href="changelog.html">Changelog</a><a href="incidents.html">Incidents</a><a href="brand.html">Brand</a></nav>
                  </header>
                  <main>

                    <h2>The steps</h2>
                    <div class="card"><ol>
                      <li>Open the <strong>Service Portal</strong> from the Firefox toolbar and sign in with Dex.</li>
                      <li>Choose <strong>Exposed application, with access</strong>.</li>
                      <li>Pick an application from the list, give it a name, and submit. The namespace is optional and defaults to the application name.</li>
                      <li>The portal opens a branch in Infrahub and a proposed change. Generators add the address block, the firewall rule and the DNS name on that branch.</li>
                      <li>Someone with merge rights reviews the proposed change and merges it.</li>
                      <li>After the merge the application is deployed. Its name, <code>&lt;name&gt;.int.otternet.lab</code>, resolves from the branch machine about a minute or two later.</li>
                    </ol></div>
                    <h2>If it does not answer</h2>
                    <div class="card"><ul>
                      <li>The proposed change has not merged yet. Check <strong>Proposed changes</strong> in the toolbar.</li>
                      <li>The name does not resolve yet. The record reaches the resolver 15 to 75 seconds after the merge, then up to 30 seconds more to resolve.</li>
                      <li>The page times out but the name resolves. No access grant exists for your network, so the firewall drops the request.</li>
                    </ul></div>
                  </main>
                  <footer>OTTERNET lab. Served by nginx in the lab cluster.</footer>
                </body>
                </html>
              services.html: |
                <!doctype html>
                <html lang="en">
                <head>
                  <meta charset="utf-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1">
                  <title>OTTERNET wiki</title>
                  <link rel="stylesheet" href="otternet.css">
                </head>
                <body>
                  <header>
                    <h1>OTTERNET wiki</h1>
                    <p>What OTTERNET offers</p>
                    <nav><a href="index.html">Home</a><a href="request.html">Request an application</a><a href="services.html" class="here">Services</a><a href="network.html">How the network is built</a><a href="onboarding.html">Onboarding</a><a href="glossary.html">Glossary</a><a href="changelog.html">Changelog</a><a href="incidents.html">Incidents</a><a href="brand.html">Brand</a></nav>
                  </header>
                  <main>

                    <div class="card"><table>
                      <tr><th>Service</th><th>What the customer gets</th><th>Who asks for it</th></tr>
                      <tr><td>Exposed application</td><td>A web application in the data centre, with an address block, a firewall rule and a DNS name</td><td>A branch user, in the portal</td></tr>
                      <tr><td>Tenant network</td><td>A subnet and a VLAN in the tenant's own VRF</td><td>A tenant administrator</td></tr>
                      <tr><td>L3VPN between sites</td><td>Sites of one tenant reach each other and no other tenant</td><td>The tenant, through the WAN team</td></tr>
                      <tr><td>Internet access</td><td>A default route and outbound reachability, bought per tenant</td><td>The tenant</td></tr>
                      <tr><td>Cloud connection</td><td>An isolated VRF of cloud instances, joined to the firewall by one handoff</td><td>The tenant</td></tr>
                    </table></div>
                  </main>
                  <footer>OTTERNET lab. Served by nginx in the lab cluster.</footer>
                </body>
                </html>
              otternet.css: |
                /* OTTERNET shared style. Source of truth for every page under sites/; scripts/build_sites.py copies it next to each site. */
                :root { --ink: #1f2d3a; --muted: #5a6b78; --bg: #f4f8fa; --card: #ffffff; --line: #d5e1e8; --brand: #12475f; --accent: #e3f0f6; --accent-line: #9cc3d5; --warn: #fde9d9; --warn-line: #e0a77a; }
                * { box-sizing: border-box; }
                body { font-family: system-ui, sans-serif; margin: 0; color: var(--ink); background: var(--bg); line-height: 1.5; }
                header { background: var(--brand); color: #fff; padding: 1.2rem 2rem 0; }
                header h1 { margin: 0; font-size: 1.6rem; }
                header p { margin: .2rem 0 .8rem; opacity: .85; }
                nav { display: flex; flex-wrap: wrap; gap: .2rem; margin: 0 -.5rem; }
                nav a { color: #cfe3ec; text-decoration: none; padding: .45rem .8rem; border-radius: 4px 4px 0 0; font-size: .92rem; }
                nav a:hover { color: #fff; }
                nav a.here { background: var(--bg); color: var(--brand); font-weight: 600; }
                main { max-width: 58rem; margin: 1.6rem auto; padding: 0 1rem; }
                h2 { font-size: 1.15rem; margin: 1.8rem 0 .6rem; }
                h3 { font-size: 1rem; margin: 1.2rem 0 .4rem; }
                .card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 1rem 1.2rem; margin-bottom: 1rem; }
                .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr)); gap: 1rem; }
                .grid .card { margin: 0; }
                .note { background: var(--warn); border: 1px solid var(--warn-line); border-radius: 6px; padding: .7rem 1rem; font-size: .9rem; margin-bottom: 1rem; }
                table { border-collapse: collapse; width: 100%; font-size: .92rem; }
                th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid #e3ebf0; vertical-align: top; }
                th { color: var(--muted); font-weight: 600; }
                code { font-family: ui-monospace, monospace; background: #eef3f6; padding: .05rem .3rem; border-radius: 3px; font-size: .88em; }
                ol, ul { margin: .3rem 0 .3rem 1.2rem; padding: 0; }
                a { color: #0b5f86; }
                .path { display: flex; flex-wrap: wrap; align-items: center; gap: .4rem; }
                .hop { background: var(--accent); border: 1px solid var(--accent-line); border-radius: 4px; padding: .35rem .6rem; font-family: ui-monospace, monospace; font-size: .85rem; }
                .hop.fw { background: var(--warn); border-color: var(--warn-line); }
                .arrow { color: var(--muted); }
                .tree, .tree ul { list-style: none; margin: 0; padding-left: 1.4rem; border-left: 2px solid var(--line); }
                .tree { border-left: 0; padding-left: 0; }
                .tree li { margin: .5rem 0; position: relative; }
                .person { display: inline-block; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: .4rem .8rem; }
                .person b { display: block; }
                .person span { color: var(--muted); font-size: .85rem; }
                .swatch { display: inline-block; width: 1.2rem; height: 1.2rem; border-radius: 3px; vertical-align: middle; border: 1px solid var(--line); margin-right: .4rem; }
                button { font: inherit; background: var(--brand); color: #fff; border: 0; border-radius: 4px; padding: .5rem 1rem; cursor: pointer; }
                button:disabled { opacity: .6; cursor: default; }
                footer { text-align: center; font-size: .85rem; color: var(--muted); padding: 1.5rem; }
        persistence:
          site:
            type: configMap
            identifier: site
            globalMounts:
            - path: /usr/share/nginx/html
              readOnly: true
    # yamllint enable rule:line-length
    # END generated by scripts/render_site_entries.py

    - name: grafana
      title: "Grafana"
      description: "Dashboards and visualisation, on its own with no data source configured"
      status: active
      requestable: true
      chart_repository: https://grafana.github.io/helm-charts
      chart_name: grafana
      chart_version: "10.5.15"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-http
      default_values: |
        replicas: 1

        service:
          type: LoadBalancer
          externalTrafficPolicy: Local
          port: 80
          labels:
            otternet.lab/advertise: "true"

    - name: argo-cd
      title: "Argo CD"
      description: "Declarative GitOps continuous delivery for Kubernetes, with its web interface"
      status: active
      requestable: true
      chart_repository: https://argoproj.github.io/argo-helm
      chart_name: argo-cd
      chart_version: "10.9.6"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-http
      # The web interface is the argocd-server Service, so the exposure keys sit
      # under `server.service`. Dex and the notifications controller are switched
      # off: a demo needs the interface, not single sign-on or alerting.
      # Argo CD's `redis-secret-init` job runs before the install and calls the Kubernetes API to
      # create the Redis password Secret. The namespace denies all egress by default, so without
      # this the job times out on `10.112.0.1:443` and the release stays `failed`.
      default_policy_allow_egress_api_server: true
      default_values: |
        dex:
          enabled: false

        notifications:
          enabled: false

        server:
          service:
            type: LoadBalancer
            externalTrafficPolicy: Local
            labels:
              otternet.lab/advertise: "true"

    - name: lab-whoami
      title: "OTTERNET demo workload"
      description: "The lab's own whoami demonstration, three replicas across the fabric"
      status: active
      requestable: false
      chart_repository: https://cowboysysop.github.io/charts/
      chart_name: whoami
      chart_version: "6.0.0"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-http

    - name: lab-metrics
      title: "OTTERNET metrics"
      description: "Grafana and Prometheus: the lab's own observability"
      status: active
      requestable: false
      chart_repository: https://prometheus-community.github.io/helm-charts
      chart_name: kube-prometheus-stack
      chart_version: "90.0.0"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-http

    - name: lab-telemetry
      title: "OTTERNET telemetry"
      description: "Telegraf: device telemetry, collected as Infrahub's monitoring profiles say"
      status: active
      requestable: false
      chart_repository: https://helm.influxdata.com/
      chart_name: telegraf
      chart_version: "1.8.77"
      default_vip_block_size: 28

    # THE LAB'S RESOLVER (specs/037-lab-dns-service). Not requestable: nobody
    # asks for a DNS server, the lab has one. Its `default_values` come from
    # payloads/otternet-dns-values.yaml, the same file the application's own
    # attachment comes from, by scripts/seed_app_payloads.py.
    - name: lab-dns
      title: "OTTERNET resolver"
      description: "CoreDNS: the lab's resolver, configured entirely from the names Infrahub holds"
      status: active
      requestable: false
      chart_repository: https://coredns.github.io/helm
      chart_name: coredns
      chart_version: "1.48.2"
      default_vip_block_size: 28
      default_service_selector:
        - "otternet.lab/advertise=true"
      default_advertised_services:
        - junos-dns-udp
        - junos-dns-tcp
