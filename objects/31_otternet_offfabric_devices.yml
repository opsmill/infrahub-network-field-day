---
# ============================================================================
# OTTERNET — the devices outside the Arista fabric.
#
# THE FIREWALL IS ITS OWN KIND. fw1 is a SecurityFirewall, not a DcimDevice
# carrying a `firewall` role: the adopted marketplace security schema makes
# SecurityFirewall inherit DcimGenericDevice and DcimPhysicalDevice, so the
# role was removed from the dropdown entirely. Its interfaces live in 32_*,
# not here: SecurityFirewallInterface.security_zone is mandatory, so the zones
# have to exist first.
#
# THE WAN ROUTERS ARE PLAIN DcimDevice OBJECTS with the non-EOS roles added in
# schemas/dcim_extensions.yml. None of those roles is in ROLE_TO_AVD_TYPE, and
# none of these devices joins the avd_devices group — so pyAVD never sees them
# and never tries to render EOS for an FRR router or a vSRX.
#
# No rack is set: DcimDevice requires only a name, and none of this equipment
# is in the datacentre. The customer-premises routers carry a location instead.
#
# Deliberately not loaded here: the demo hosts (cust-*-host, branch-host,
# branch-desktop, branch-guacd, internet-host). Nothing in the schema
# references them, and the branch desktop and Guacamole containers are lab
# plumbing for demonstrating access rather than modelled infrastructure.
#
# Sourced from ../lab/wan/tenants.yml and ../lab/configs/fw/vsrx/junos.conf.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityFirewall
  data:
    - name: fw1
      telemetry_address: ["172.20.41.31/24", default]
      description: "Perimeter vSRX; every tenant VRF's only route out points at one of its zones"
      role: edge_firewall
      rack_face: front
      device_type: ["Juniper", "Juniper vSRX"]
      platform: JunOS
      # 9214 (the fabric underlay) - 50 (VXLAN) - 20 (IP) - 20 (TCP). Not the
      # firewall's own 9192 - 14 - 20 - 20 = 9138: traffic onward into a tenant
      # VRF crosses the EVPN fabric as VXLAN, and at 9138 every full-size
      # segment was dropped there silently. Measured from the branch desktop:
      # MSS 9124 fetched Grafana's 41KB stylesheet in 9ms; MSS 9138 stalled at
      # 3869 bytes. Transcribed into ../lab/configs/fw/vsrx/junos.conf.
      tcp_mss: 9124
      # SNMP for the telemetry collector (cycle 034). A read-only v2c community
      # -- configuration rather than a credential, and the one value of its
      # kind recorded in an artifact, because the device must receive it -- and
      # the one prefix allowed to use it.
      snmp_community: otternet-ro
      snmp_clients: ["10.0.0.0/24", default]
      member_of_groups:
        - junos_firewalls

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimDevice
  data:
    # ---- the provider ----------------------------------------------------
    - name: isp-pe1
      telemetry_address: ["172.20.41.61/24", default]
      description: "Customer-facing provider edge; holds a VRF per tenant"
      role: isp_edge
      status: active
      rack_face: front
      device_type: ["FRRouting", "FRR Container Router"]
      platform: FRR
      member_of_groups:
        - frr_routers
    - name: isp-pe2
      telemetry_address: ["172.20.41.62/24", default]
      description: "Provider core; default VRF transit and the datacentre handoff"
      role: isp_core
      status: active
      rack_face: front
      device_type: ["FRRouting", "FRR Container Router"]
      platform: FRR
      member_of_groups:
        - frr_routers
    - name: internet-rtr
      telemetry_address: ["172.20.41.91/24", default]
      description: "AS 64500 border router"
      role: internet_edge
      status: active
      rack_face: front
      device_type: ["FRRouting", "FRR Container Router"]
      platform: FRR
      location:
        kind: LocationSite
        data:
          name: internet-edge

      member_of_groups:
        - frr_routers
    # ---- customer edge ---------------------------------------------------
    - name: cust-acme-ce
      telemetry_address: ["172.20.41.71/24", default]
      description: "acme hq CE; runs eBGP with the provider edge"
      role: customer_edge
      status: active
      rack_face: front
      device_type: ["FRRouting", "FRR Container Router"]
      platform: FRR
      location:
        kind: LocationSite
        data:
          name: acme-hq
      member_of_groups:
        - frr_routers
    - name: cust-acme-dr-ce
      description: "acme dr CE; statically routed, no routing protocol at all"
      role: customer_edge
      status: active
      rack_face: front
      device_type: ["Generic", "Linux Container"]
      platform: Linux
      location:
        kind: LocationSite
        data:
          name: acme-dr
    - name: cust-globex-ce
      telemetry_address: ["172.20.41.73/24", default]
      description: "globex hq CE; runs eBGP with the provider edge"
      role: customer_edge
      status: active
      rack_face: front
      device_type: ["FRRouting", "FRR Container Router"]
      platform: FRR
      location:
        kind: LocationSite
        data:
          name: globex-hq

      member_of_groups:
        - frr_routers
    # ---- the branch ------------------------------------------------------
    - name: branch-rtr
      telemetry_address: ["172.20.41.81/24", default]
      description: "Branch router with an integrated switched LAN; private circuit to the border leaf"
      role: branch_router
      status: active
      rack_face: front
      device_type: ["FRRouting", "FRR Container Router"]
      platform: FRR
      location:
        kind: LocationSite
        data:
          name: branch-office

      member_of_groups:
        - frr_routers
