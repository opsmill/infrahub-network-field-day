---
# ============================================================================
# OTTERNET -- the cables objects/28 does not record, so the topology view
# shows the perimeter and the WAN as well as the fabric.
#
# objects/28 records the spine-leaf and workload links. These are the rest of
# lab/otternet.clab.yml that Infrahub can express: the border leaf's six
# handoffs to the firewall, and the WAN (provider edge, customer edges, internet
# and branch routers). Both ends of every one are interfaces this directory
# already declares, which is what makes them safe to load here -- a link to an
# interface that does not exist yet fails the whole load.
#
# NOT HERE: the MLAG peer links between leaf pairs. Their ports are created by
# the rack generator, after this directory loads, so they are in
# objects_post_topology/ and loaded by `invoke avd --topology`.
# Also not here: fw1 ge-0/0/6 and tool-node1 (the tooling bridge, not a device
# in the model), and the hosts behind the customer, internet and branch routers
# (containers with no Infrahub object).
#
# A link is created bare and the INTERFACES point at it, because a link's
# `connected_endpoints` takes one interface kind per block and the firewall's
# ports are not the switches' kind.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkLink
  data:
    - name: otternet-leaf-otternet-pod1-3-1-Ethernet10--fw1-ge-0_0_0
      medium: copper
    - name: otternet-leaf-otternet-pod1-3-1-Ethernet11--fw1-ge-0_0_1
      medium: copper
    - name: otternet-leaf-otternet-pod1-3-1-Ethernet14--fw1-ge-0_0_2
      medium: copper
