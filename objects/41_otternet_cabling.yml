      medium: copper
    - name: otternet-leaf-otternet-pod1-3-1-Ethernet16--fw1-ge-0_0_4
      medium: copper
    - name: otternet-leaf-otternet-pod1-3-1-Ethernet17--fw1-ge-0_0_5
      medium: copper
    - name: otternet-isp-pe1-ethernet-1_1--isp-pe2-ethernet-1_1
      medium: copper
    - name: otternet-isp-pe2-ethernet-1_2--leaf-otternet-pod1-3-1-Ethernet12
      medium: copper
    - name: otternet-cust-acme-ce-ethernet-1_1--isp-pe1-ethernet-1_2
