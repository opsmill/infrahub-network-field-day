---
# The WAN service layer: what each tenant ordered from the ISP.
#
# Cycle 010 modelled the WAN's technical layer -- the circuits, the sites, the
# internet peering, the VRFs and the firewall zones -- and deferred the services
# on top. These are those services, transcribed from ../lab/wan/tenants.yml.
#
# The asymmetry is the point and is not a transcription slip: acme has
# `internet: true` in the lab file and globex has `internet: false`, so there is
# exactly ONE internet-access service. A tenant having a WAN does not mean it
# has a way out to the internet, and modelling both tenants identically would
# lose the only interesting thing about the pair.
#
# The PE-side VRFs below (CUST_*) are separate from the DC-side tenant VRFs
# (TENANT_*) that cycle 010 seeded. The lab's own note explains why: a tenant
# gets one VRF on the PE and one identity; two sites of the same tenant reach
# each other because they share that VRF, while two tenants cannot reach each
# other at all.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ServiceL3vpn
  data:
    # Two sites in one VRF, which is what makes them reach each other without
    # anything being leaked between tenants.
    - name: acme-l3vpn
      description: "Acme's L3VPN across HQ and DR"
      status: active
      owner: OTTERNET-ISP
      tenant: acme
      vrf: CUST_ACME
      circuits:
        - acme-hq
        - acme-dr
      # The SHARED DC service range, identical for every tenant: "what EVERY
      # tenant may reach in the datacentre, regardless of what they buy".
      # Cycle 019 seeded each tenant's own cloud subnet here by mistake; that
      # is a different concept and already lives on ServiceTenantCloud.prefix.
      dc_service_prefixes:
        - ["10.112.240.0/24", "default"]

    - name: globex-l3vpn
      description: "Globex's L3VPN from its single site"
      status: active
      owner: OTTERNET-ISP
      tenant: globex
      vrf: CUST_GLOBEX
      circuits:
        - globex-hq
      # The SHARED DC service range, identical for every tenant: "what EVERY
      # tenant may reach in the datacentre, regardless of what they buy".
      # Cycle 019 seeded each tenant's own cloud subnet here by mistake; that
      # is a different concept and already lives on ServiceTenantCloud.prefix.
      dc_service_prefixes:
        - ["10.112.240.0/24", "default"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ServiceInternetAccess
  data:
    # Only acme. globex has `internet: false` in the lab, and the absence of a
    # second object here is the model recording that.
    - name: acme-internet
      description: "Internet access for the acme L3VPN"
      status: active
      owner: OTTERNET-ISP
      l3vpn: acme-l3vpn
      peering: isp-to-internet
      default_route_imported: true
      prefixes_announced: true
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ServiceTenantCloud
  data:
    # The tenant's footprint inside the DC: its own VRF, its own firewall zone,
    # its own subnet and VLAN. Isolation here is the absence of a path between
    # two of these, which is why no relationship joins them.
    - name: acme-cloud
      description: "Acme's tenant cloud in the DC"
      status: active
      owner: OTTERNET-ISP
      tenant: acme
      vrf: TENANT_ACME
      # SecurityZone's HFID is a single element (name) in the marketplace
      # schema cycle 010 adopted, so the reference is a scalar.
      zone: acme-cloud
      prefix: ["10.220.10.0/24", "default"]
      vlan: ACME_CLOUD

    - name: globex-cloud
      description: "Globex's tenant cloud in the DC"
      status: active
      owner: OTTERNET-ISP
      tenant: globex
      vrf: TENANT_GLOBEX
      zone: globex-cloud
      prefix: ["10.220.20.0/24", "default"]
      vlan: GLOBEX_CLOUD
