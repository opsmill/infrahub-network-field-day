---
# Interface profiles supply the role and MTU the generators use to pick uplink,
# MLAG peer-link and workload ports. The role is load-bearing: the pod and rack
# generators cable spine-role ports to the spines and mlag_peer-role ports to
# the pair, and the hostvar generator only treats server-role ports as workload
# endpoints.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ProfileDcimInterface
  data:
    - profile_name: "profile-interface-server"
      role: "server"
      mtu: 1500
    - profile_name: "profile-interface-spine"
      role: "spine"
      mtu: 9214
    - profile_name: "profile-interface-leaf"
      role: "leaf"
      mtu: 9214
    - profile_name: "profile-interface-mlag-peer"
      role: "mlag_peer"
      mtu: 9214
