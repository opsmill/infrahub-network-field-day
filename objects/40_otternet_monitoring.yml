---
# ============================================================================
# OTTERNET -- what is monitored, as intent (cycle 034).
#
# Telegraf's whole configuration is the `Telemetry Collector Configuration`
# artifact rendered from what follows: every target, subscription and filter.
# Changing what the lab watches is an edit here, reviewed in a proposed change
# whose artifact diff shows exactly which inputs move -- never an edit to the
# collector.
#
# THE MEASUREMENT NAMES ARE THE CONTRACT with the renderer, which dispatches
# on (measurement, device kind). A name it does not know is a unit-test failure
# (test_monitoring_measurements_contract.py), not a silent no-op.
#
# The five profiles reach all four device kinds, so a fresh bootstrap collects
# from every family -- and scripts/verify_bootstrap.sh counts each one.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: MonitoringMeasurement
  data:
    - name: interface-counters
      label: Interface counters
      description: "Octets, errors and operational state per interface"
    - name: bgp-neighbor-state
      label: BGP neighbour state
      description: "Session state and prefixes per BGP neighbour"
    - name: evpn-routes
      label: EVPN routes
      description: "EVPN routes received per overlay neighbour"
    - name: system-resources
      label: System resources
      description: "CPU and memory of the device's control plane"
    - name: security-sessions
      label: Security sessions
      description: "Current flow sessions on the firewall"
    - name: node-resources
      label: Node resources
      description: "CPU, memory and network of a Kubernetes node, from node-exporter"
    # ---- Services (cycle 035) ----------------------------------------------
    #
    # Measured on SERVICES, by a profile that names a service_kind. The
    # renderer knows how each one applies to each service kind
    # (transforms/telemetry_services.py::SERVICE_DISPATCH); whether it applies
    # at all is the profiles' decision, below.
    - name: service-lifecycle
      label: Service lifecycle
      description: "Each request's stage -- requested, merged, deployed, decommissioning, removed -- from the service-lifecycle exporter"
    - name: service-delivery
      label: Service delivery
      description: "An application's pods ready in its namespace and its LoadBalancer address assigned"
    - name: service-reachability
      label: Service reachability
      description: "A TCP probe of an exposed application's VIP on each port it advertises, where its pod gate admits the collector"
    - name: service-access
      label: Service access
      description: "A grant's firewall rules, and whether the firewall holding them is confirmed in sync"
    - name: service-routing
      label: Service routing
      description: "The BGP sessions a service is realised by, joined to the sessions the devices report"
    - name: service-cabling
      label: Service cabling
      description: "A placed machine's cabled switch ports, joined to their operational state"
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: MonitoringCollector
  data:
    - name: otternet-telegraf
      description: "The lab's one telemetry collector, in otternet-telemetry"
      collector_type: telegraf
      cluster: otternet
      # Both must agree with payloads/otternet-telemetry-values.yaml, which
      # mounts this ConfigMap by name into the namespace Vidra delivers it to.
      namespace_name: otternet-telemetry
      config_map_name: telegraf-intent
      member_of_groups:
        - monitoring_collectors
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: MonitoringProfile
  data:
    - name: fabric-core
      description: "Every fabric switch: interfaces, BGP and the control plane"
      collector: otternet-telegraf
      interval_seconds: 30
      device_groups:
        - avd_devices
      measurements:
        - interface-counters
        - bgp-neighbor-state
        - system-resources
    # "The leaves" is a role within the fabric group: the spines carry no EVPN
    # services of their own, only the overlay sessions fabric-core watches.
    - name: fabric-leaf-evpn
      description: "EVPN routes on the leaves"
      collector: otternet-telegraf
      interval_seconds: 30
      device_role: leaf
      device_groups:
        - avd_devices
      measurements:
        - evpn-routes
    # Interfaces, BGP and the control plane, the same three the fabric is
    # watched for. Under FRR this was BGP only: frr_exporter reported routing
    # state and nothing else, its process_* series describing the exporter
    # itself. SR Linux streams all three over gNMI natively, through the same
    # OpenConfig paths the EOS switches answer -- so the series arrive under the
    # same names and every fabric panel covers the WAN with no second query.
    - name: wan-routing
      description: "The WAN's SR Linux routers: interfaces, BGP and the control plane"
      collector: otternet-telegraf
      interval_seconds: 30
      device_groups:
        - srl_routers
      measurements:
        - interface-counters
        - bgp-neighbor-state
        - system-resources
    - name: perimeter
      description: "The firewall: interfaces, sessions and the control plane"
      collector: otternet-telegraf
      interval_seconds: 60
      device_groups:
        - junos_firewalls
      measurements:
        - interface-counters
        - security-sessions
        - system-resources
    - name: cluster-nodes
      description: "The k3s nodes, from node-exporter on the host network"
      collector: otternet-telegraf
      interval_seconds: 30
      device_groups:
        - kubernetes_nodes
      measurements:
        - node-resources
    # ---- Services (cycle 035) ----------------------------------------------
    #
    # SELECTED BY KIND, NOT BY GROUP. A service profile names a service_kind
    # and no device group, and watches every LIVE service of that kind --
    # including one a portal request creates tomorrow, and including the WAN
    # kinds, which are in no group at all. Nothing here names a service: a new
    # one is monitored because it exists, and stops being monitored in the same
    # proposed change that withdraws it.
    #
    # Four profiles rather than one, so each can be switched off, re-timed or
    # narrowed to one kind on its own -- which is the demo: the artifact diff of
    # that edit is exactly the monitoring that moves.
    - name: services-lifecycle
      description: "Every service kind's requests through the pipeline: requested, merged, deployed, removed"
      collector: otternet-telegraf
      service_kind: ServiceGeneric
      interval_seconds: 30
      measurements:
        - service-lifecycle
    - name: services-apps
      description: "Every application: delivered and ready, addressed, and probed where its pod gate admits the collector"
      collector: otternet-telegraf
      service_kind: ServiceFabricApp
      interval_seconds: 30
      timeout_seconds: 5
      measurements:
        - service-delivery
        - service-reachability
    - name: services-access
      description: "Every access grant: its firewall rules, on a firewall confirmed in sync"
      collector: otternet-telegraf
      service_kind: ServiceAppAccess
      interval_seconds: 60
      measurements:
        - service-access
    - name: services-routing
      description: "Every routed service: the BGP sessions that realise it, and a placed machine's cabling"
      collector: otternet-telegraf
      service_kind: ServiceGeneric
      interval_seconds: 60
      measurements:
        - service-routing
        - service-cabling
