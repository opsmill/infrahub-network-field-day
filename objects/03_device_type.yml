---
# ============================================================================
# Platforms for the OTTERNET lab's two node kinds.
#
# The ContainerLab image tags are the ones lab/otternet.clab.yml actually deploys.
# A tag here that does not exist on the ContainerLab host produces a topology
# that fails to come up, so these track the lab rather than upstream latest.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimPlatform
  data:
    - name: EOS
      manufacturer: Arista
      description: Arista EOS
      ansible_network_os: arista.eos.eos
      containerlab_os: arista_ceos
      containerlab_image: ceos:4.36.0.1F
    # The workload endpoints (k3s nodes, bare-metal hosts, tenant cloud
    # instances) are Linux containers in the topology.
    - name: Linux
      description: Generic Linux host
      containerlab_os: linux
      containerlab_image: ghcr.io/srl-labs/network-multitool:v0.10.0
    # The WAN routers. A ContainerLab-native kind, unlike the FRR containers
    # they replaced, so ContainerLab applies the startup configuration itself.
    #
    # The driver fields name the drivers that exist for SR Linux; nothing in
    # this repository drives the routers through them -- the reconciler
    # reaches them with `docker exec sr_cli` -- so they are descriptive.
    - name: SRLinux
      manufacturer: Nokia
      description: Nokia SR Linux, run as a ContainerLab node
      nornir_platform: srlinux
      napalm_driver: srlinux
      netmiko_device_type: nokia_srl
      ansible_network_os: nokia.srlinux.srlinux
      containerlab_os: nokia_srlinux
      containerlab_image: ghcr.io/nokia/srlinux:26.7.2
    # The perimeter firewall. vrnetlab wraps the vSRX image, which is why the
    # ContainerLab kind is juniper_vsrx rather than a plain container.
    - name: JunOS
      manufacturer: Juniper
      description: Juniper JunOS (vSRX)
      nornir_platform: junos
      napalm_driver: junos
      netmiko_device_type: juniper_junos
      ansible_network_os: junipernetworks.junos.junos
      containerlab_os: juniper_vsrx
      containerlab_image: vrnetlab/juniper_vsrx:22.3R1.11
