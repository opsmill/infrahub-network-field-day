---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreAccountGroup
  data:
    - name: AVD
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreStandardGroup
  data:
    - name: halls
    - name: racks
    - name: fabrics
    - name: pods
    - name: avd_devices
    - name: servers
    - name: avd_artifacts
    - name: avd_structured_configs
    # Artifact target group for the Crossplane FabricPeering manifest.
    # Declared by specs/010-lab-service-layer-model/contracts/schema-kinds.md
    # section 6; created here because 011 is the cycle that renders it.
    - name: service_fabric_peerings
    # Artifact target group for the Crossplane FabricApp manifest. A group per
    # service kind, so an artifact definition cannot generate against a target
    # whose kind it cannot render.
    - name: service_fabric_apps
    # Artifact target group for the WAN's FRR configuration. Membership is
    # EXPLICIT, not derived from the device role: cust-acme-dr-ce is also a
    # `customer_edge`, but it runs no routing protocol and the lab renders no
    # FRR config for it, so a role-derived group would produce a seventh
    # artifact with nothing in it.
    - name: frr_routers
    # Artifact target for the perimeter firewall's Junos configuration. One
    # member, and a group rather than a direct target because an artifact
    # definition cannot point at an object.
    - name: junos_firewalls
    # Generator target for application access grants. A group rather than a
    # direct target because a generator definition cannot point at an object,
    # and a group per service kind so a generator cannot run against a kind it
    # cannot read.
    #
    # A CoreStandardGroup, like every other target here. The Infrahub docs
    # describe generators as targeting a CoreGeneratorGroup; this repository
    # does not, and generate-fabric-peering already targets a standard group
    # successfully. Consistency with the eight generators already registered
    # wins over the generic guidance.
    - name: service_app_accesses
