---
# ============================================================================
# OTTERNET — management-plane objects referenced by the fabric.
#
# `NetworkLocalUser.name` is the username AVD renders, and `NetworkNtpServer.name`
# is the server address -- neither is just a label.
#
# Both users' hash is a real crypt hash of "admin", matching the lab's
# ansible_password. Generated with `openssl passwd -6 admin`. Lab credentials --
# rotate for anything real.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkDnsServer
  data:
    - name: otternet-dns
      ip_address: 172.20.41.1/32
      vrf: MGMT
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkNtpServer
  data:
    # `name` is the address AVD renders, so it is the address, not a label.
    - name: 172.20.41.1
      server_vrf: MGMT
      iburst: true
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkLocalUser
  data:
    - name: admin
      privilege: 15
      role: network-admin
      password_type: sha512
      password: "$6$OtternetLab$9OUIc8rD9Tz1nLCqGCVqkB2Jc0hRbMwY0oFA4E4hmrcIUFo7/5n79zdOiNhJDnTnsmVg4t3MAZCcmlrYu6iln1"
    - name: avd
      privilege: 15
      role: network-admin
      password_type: sha512
      password: "$6$OtternetLab$9OUIc8rD9Tz1nLCqGCVqkB2Jc0hRbMwY0oFA4E4hmrcIUFo7/5n79zdOiNhJDnTnsmVg4t3MAZCcmlrYu6iln1"
