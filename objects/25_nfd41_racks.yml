---
# ============================================================================
# NFD41 — the three leaf racks.
#
# Rack names are load-bearing, not labels: the rack generator uses the rack name
# as the MLAG domain ID, and the hostvar generator uses it as the AVD node-group
# name. The deployed switches are configured with `mlag configuration domain-id
# K8S_LEAFS`, so the rack has to be called K8S_LEAFS.
#
# `device_name_template` pins the hostnames to the ones containerlab already
# gives these nodes. Without it the generator would name them
# `leaf-nfd41-pod1-1-1` and the rendered config would not match the running lab.
#
# The AVD tags are declared from the tag side, after the racks: `AvdTag.racks`
# is a mandatory relationship, so a tag cannot exist before the racks it scopes.
#
# BORDER_LEAFS is a single non-MLAG node and carries
# `always_include_vrfs_in_tenants`: it terminates K8S_PROD and APP_PROD for the
# firewall handoff but owns none of those tenants' access VLANs, so AVD tag
# matching alone would leave both VRFs off the device and the handoff unrouted.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationRack
  data:
    - name: "K8S_LEAFS"
      index: 1
      rack_type: compute
      pod: nfd41-pod1
      parent: "Hall-NFD41"
      mlag: true
      device_name_template: "k8s-leaf{index}"
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: nfd41-leaf-switch
      member_of_groups: ["racks"]
    # `cloud` as well as `app`: the app pod hosts both the classic bare-metal
    # tier and the WAN tenants' isolated cloud instances. They are different
    # tenants and different VRFs on the wire; they just share a leaf pair.
    # Without `cloud` the tenant cloud SVIs are silently not generated and the
    # tenant VRFs exist only on the border leaf -- which presents as a cloud
    # host with no gateway.
    - name: "APP_LEAFS"
      index: 2
      rack_type: compute
      pod: nfd41-pod1
      parent: "Hall-NFD41"
      mlag: true
      device_name_template: "app-leaf{index}"
      device_designs:
        data:
          - role: leaf
            device_quantity: 2
            device_template: nfd41-leaf-switch
      member_of_groups: ["racks"]
    - name: "BORDER_LEAFS"
      index: 3
      rack_type: compute
      pod: nfd41-pod1
      parent: "Hall-NFD41"
      mlag: false
      device_name_template: "border-leaf{index}"
      always_include_vrfs_in_tenants:
        - TENANT_K8S
        - TENANT_APP
      device_designs:
        data:
          - role: leaf
            device_quantity: 1
            device_template: nfd41-leaf-switch
      member_of_groups: ["racks"]
---
# AVD tags scope a tenant's SVIs and L2 VLANs onto the right leaf pairs. `cloud`
# sits on the app pair as well as `app`: that pair hosts both the classic
# bare-metal tier and the WAN tenants' isolated cloud instances -- different
# tenants and different VRFs on the wire, sharing a pair of leaves.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: AvdTag
  data:
    - name: k8s
      description: "Kubernetes leaf pair - K8S_PROD services land here"
      racks: ["K8S_LEAFS"]
    - name: app
      description: "Application leaf pair - APP_PROD services land here"
      racks: ["APP_LEAFS"]
    - name: cloud
      description: "Tenant cloud instances - per-tenant cloud VRFs on the app pair"
      racks: ["APP_LEAFS"]
    - name: border
      description: "Border leaf - firewall, WAN and branch handoffs"
      racks: ["BORDER_LEAFS"]
