---
# ============================================================================
# NFD41 — the perimeter firewall, as data.
#
# Every tenant VRF in this fabric has exactly one route out: a default pointing
# at its own zone here. That makes the firewall unavoidable rather than
# decorative, and it is why the zone-to-VRF pairing is modelled explicitly
# instead of living in a route-map comment.
#
# Infrahub owns the whole device, not only the grants issued against it. All
# six zones, thirteen address-book entries, four groups and all eleven zone
# pairs with their nineteen rules are here.
#
# EVERY RULE LOADS WITH managed_by_service: false. Everything on the box today
# is hand-written, including the anti-spoofing deny repeated at the head of the
# first six zone pairs. A reconciling generator must delete rules with no
# service behind them, so that flag is what keeps the baseline safe.
#
# Sourced field-for-field from ../lab/configs/fw/vsrx/junos.conf.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityZone
  data:
    - name: k8s-prod
      trust_level: 70
      vrf: K8S_PROD
    - name: app-prod
      trust_level: 70
      vrf: APP_PROD
    - name: acme-cloud
      trust_level: 60
      vrf: TENANT_ACME
    - name: globex-cloud
      trust_level: 60
      vrf: TENANT_GLOBEX
    # THE ONLY ZONE NOT FACING THE FABRIC. Every other handoff lands on
    # border-leaf1; ge-0/0/6 lands on a Linux bridge the host is also on, which
    # is what lets the tooling cluster come up before the fabric it configures.
    #
    # No `vrf`: there is no fabric VRF behind it. That is deliberate and it is
    # why `wan-service-consistency` has nothing to say about this zone -- its
    # rules are about tenant clouds, which this is not.
    #
    # trust_level 80: higher than a tenant cloud because it is infrastructure
    # the operators own, lower than nothing because branch users reach it.
    - name: tooling
      trust_level: 80
    # The only two zones the DC advertises toward, because these are the only
    # two BGP neighbors carrying an outbound route-map -- both on border-leaf1:
    #   VRF BRANCH:  neighbor 10.250.70.2 route-map RM-DC-TO-BRANCH out
    #   VRF WAN:     neighbor 10.250.50.2 route-map RM-DC-TO-EXTERNAL out
    # and each route-map matches exactly one prefix list.
    #
    # `leaf-nfd41-pod1-3-1` IS border-leaf1. Infrahub and ContainerLab name the
    # same box differently and there is no renaming layer, so the two are
    # matched by management address (172.20.41.25). NOT by role: no device in
    # this fabric carries the `border_leaf` role -- all five leaves are `leaf`.
    - name: branch
      trust_level: 40
      vrf: BRANCH
      dc_advertised_prefix_list: PL-DC-ADVERTISED-BRANCH
      advertising_device: leaf-nfd41-pod1-3-1
    - name: wan
      trust_level: 20
      vrf: WAN
      dc_advertised_prefix_list: PL-DC-ADVERTISED
      advertising_device: leaf-nfd41-pod1-3-1

---
# One physical interface per zone. A policy written against the wrong interface
# commits cleanly and never matches a packet, which is why the binding is data.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityFirewallInterface
  data:
    # Descriptions and MTU are the device's own, not a paraphrase of them.
    #
    # MTU 9192 rather than the fabric's 9214: Junos counts the 14-byte Ethernet
    # header, so matching the fabric would need 9228, which vSRX rejects --
    # "Value 9228 is not within range (256..9192)". 9192 is the platform
    # maximum, an IP MTU of 9178, and `security flow tcp-mss` is what makes the
    # 36-byte shortfall safe rather than a stall with data stuck in Send-Q.
    # The vSRX's management interface, and the one entry here whose values did
    # not come from junos.conf -- that file does not contain fxp0 at all. They
    # come from the init.conf vrnetlab generates INSIDE the container, which is
    # not version-controlled anywhere.
    #
    # It is modelled deliberately: `load replace` on the `interfaces` hierarchy
    # replaces everything the artifact names and deletes everything it does not,
    # so leaving fxp0 out meant every push deleted the firewall's management
    # interface and relied on vrnetlab restoring it as root before the
    # `commit confirmed` had to be confirmed.
    #
    # The consequence of modelling it is that the model is now AUTHORITATIVE for
    # that address. If these values ever drift from what vrnetlab assigns, a
    # push sets the wrong management address and nothing restores it -- recovery
    # is through the container console. No zone, no description and no MTU,
    # because the device has none.
    - name: fxp0
      device: fw1
      ip_addresses:
        kind: IpamIPAddress
        data:
          - address: 10.0.0.15/24
          - address: 2001:db8::2/64
    - name: ge-0/0/0
      description: "ZONE-K8S-PROD handoff - border-leaf1 Et10"
      mtu: 9192
      device: fw1
      security_zone: k8s-prod
      ip_addresses:
        kind: IpamIPAddress
        data:
          - address: 10.250.110.2/30
    - name: ge-0/0/1
      description: "ZONE-APP-PROD handoff - border-leaf1 Et11"
      mtu: 9192
      device: fw1
      security_zone: app-prod
      ip_addresses:
        kind: IpamIPAddress
        data:
          - address: 10.250.210.2/30
    - name: ge-0/0/2
      description: "ZONE-WAN handoff - ISP transit customers"
      mtu: 9192
      device: fw1
      security_zone: wan
      ip_addresses:
        kind: IpamIPAddress
        data:
          - address: 10.250.150.2/30
    - name: ge-0/0/3
      description: "ZONE-BRANCH handoff - private circuit"
      mtu: 9192
      device: fw1
      security_zone: branch
      ip_addresses:
        kind: IpamIPAddress
        data:
          - address: 10.250.170.2/30
    - name: ge-0/0/4
      description: "ZONE-ACME-CLOUD handoff - VRF TENANT_ACME"
      mtu: 9192
      device: fw1
      security_zone: acme-cloud
      ip_addresses:
        kind: IpamIPAddress
        data:
          - address: 10.250.10.2/30
    - name: ge-0/0/5
      description: "ZONE-GLOBEX-CLOUD handoff - VRF TENANT_GLOBEX"
      mtu: 9192
      device: fw1
      security_zone: globex-cloud
      ip_addresses:
        kind: IpamIPAddress
        data:
          - address: 10.250.20.2/30
    # The tooling handoff. A /24 rather than the /30s above, because this side
    # is a real LAN with a cluster on it rather than a point-to-point to a leaf.
    - name: ge-0/0/6
      description: "ZONE-TOOLING handoff - the tooling cluster bridge"
      mtu: 9192
      device: fw1
      security_zone: tooling
      ip_addresses:
        kind: IpamIPAddress
        data:
          - address: 10.90.0.254/24

---
# The address book, IPAM-backed. Each entry references the same IpamPrefix the
# leaves' route policy and the CNI's network policies match on, so the three
# enforcement points cannot drift apart.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityIPAMIPPrefix
  data:
    - name: k8s-nodes
      book_index: 10
      description: "Kubernetes node subnet"
      ip_prefix: ["10.110.0.0/24", "default"]
      address_groups:
        kind: SecurityAddressGroup
        data:
          - name: k8s-all
          - name: k8s-reachable
    - name: k8s-pods
      book_index: 20
      description: "Cilium pod CIDR"
      ip_prefix: ["10.111.0.0/16", "default"]
      address_groups:
        kind: SecurityAddressGroup
        data:
          - name: k8s-all
    - name: k8s-services
      book_index: 30
      description: "Kubernetes service CIDR"
      ip_prefix: ["10.112.0.0/16", "default"]
      address_groups:
        kind: SecurityAddressGroup
        data:
          - name: k8s-reachable
    - name: app-hosts
      book_index: 50
      description: "Bare-metal application tier"
      ip_prefix: ["10.210.0.0/24", "default"]
    - name: fabric-infra
      book_index: 60
      description: "Fabric infrastructure; never a legitimate session source"
      ip_prefix: ["10.41.0.0/16", "default"]
    - name: wan-customers
      book_index: 70
      description: "All WAN customer space"
      ip_prefix: ["10.60.0.0/16", "default"]
    - name: branch-users
      book_index: 80
      description: "Branch office LAN"
      ip_prefix: ["10.70.0.0/24", "default"]
    - name: acme-hq
      book_index: 90
      ip_prefix: ["10.60.10.0/24", "default"]
      address_groups:
        kind: SecurityAddressGroup
        data:
          - name: acme-sites
    - name: acme-dr
      book_index: 100
      ip_prefix: ["10.60.11.0/24", "default"]
      address_groups:
        kind: SecurityAddressGroup
        data:
          - name: acme-sites
    - name: acme-cloud
      book_index: 110
      ip_prefix: ["10.220.10.0/24", "default"]
    - name: globex-hq
      book_index: 120
      ip_prefix: ["10.60.20.0/24", "default"]
      address_groups:
        kind: SecurityAddressGroup
        data:
          - name: globex-sites
    - name: globex-cloud
      book_index: 130
      ip_prefix: ["10.220.20.0/24", "default"]

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: 10.112.240.33/32
      description: "The self-service access portal VIP"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityIPAMIPAddress
  data:
    # NOTHING ANSWERS ON THIS VIP ANY MORE. It belonged to the lab repository's
    # `nfd41-access` application, and `invoke cluster`'s handover now deletes
    # that along with `nfd41-observability`: the cluster carries only what a
    # service object declares. The address and the rule that names it stay
    # because they are on `fw1` -- the rendered Junos artifact is held
    # byte-for-byte against the device's own configuration, so removing them
    # here is a change to the firewall's baseline, not a tidy-up.
    - name: access-portal
      book_index: 40
      description: "The only DC service the branch may reach before requesting access"
      ip_address: ["10.112.240.33/32", "default"]

---
# The one literal address in the book. `any` is not an allocated network, so it
# is deliberately NOT an IPAM object -- but it is still an explicit object
# rather than an empty match, so no rule's scope is ambiguous.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityPrefix
  data:
    # The tooling cluster's LAN. 140 continues the hand-written run (10..130);
    # generated entries start at 1000 and never collide with it.
    - name: tooling-services
      book_index: 140
      description: "The tooling cluster: the request portal and the identity provider"
      prefix: 10.90.0.0/24
    - name: any
      description: "Matches everything; used where Junos says destination-address any"
      prefix: 0.0.0.0/0

---
# A tenant's sites are a group rather than one prefix, because a tenant is not
# a site: acme has two, attached two different ways, and both must reach acme's
# cloud. Adding a third site is one member here, not a new policy.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityAddressGroup
  data:
    - name: acme-sites
      description: "Every acme site; both must reach acme's cloud"
    - name: globex-sites
      description: "Every globex site"
    - name: k8s-all
      description: "Kubernetes nodes and pods"
    - name: k8s-reachable
      description: "What the branch may ping: nodes and services, not pods"

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityIPProtocol
  data:
    - name: tcp
      protocol: 6
    - name: icmp
      protocol: 1

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityService
  data:
    - name: junos-http
      description: "HTTP"
      port: 80
      ip_protocol: tcp
    - name: junos-https
      description: "HTTPS"
      port: 443
      ip_protocol: tcp
    - name: junos-ping
      description: "ICMP echo"
      port: 0
      ip_protocol: icmp
    # The tooling network's services. NOT `junos-` prefixed, because they are
    # not Junos built-ins -- which is precisely why the artifact renders an
    # `applications` stanza declaring them. A rule naming an undeclared
    # application makes the device refuse the entire commit.
    - name: tooling-portal
      description: "The Backstage request portal, on its NodePort"
      port: 32001
      ip_protocol: tcp
    - name: tooling-oidc
      description: "Dex, the tooling cluster's identity provider"
      port: 32556
      ip_protocol: tcp
    # Infrahub itself, on the host's address on the tooling bridge. It is in
    # this zone because 10.90.0.1 is on the tooling subnet, not because Infrahub
    # runs in the cluster -- it does not. A branch user needs it to complete the
    # SSO redirect, which ends on Infrahub's own UI.
    - name: infrahub-api
      description: "Infrahub, on the host's tooling-bridge address"
      port: 8000
      ip_protocol: tcp
    # Junos' built-in wildcard. Fourteen rules match `application any`, and the
    # address book carries an `any` SecurityPrefix for the same reason: a rule's
    # relationship needs an object to point at, even though Junos declares
    # neither in the configuration it emits.
    - name: any
      description: "Any application"
      port: 0
      ip_protocol: tcp

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityPolicy
  data:
    - name: nfd41-perimeter
      description: "Every zone pair on fw1; rules are ordered per pair by index"
      device_target: fw1


---
# The eleven zone pairs and their nineteen rules, in file order from junos.conf.
#
# ORDER IS LOAD-BEARING. Junos evaluates a zone pair's policies in order and
# only then falls through to the default, so the anti-spoofing deny sits at
# index 10 of every pair it guards and a later grant cannot get above it.
# Uniqueness is [index, source_zone, destination_zone, policy], which is
# exactly that first-match semantics.
#
# `any` is an explicit address object rather than an empty match, so no rule's
# scope is ambiguous. Address and group references name their concrete kind
# inline because SecurityGenericAddress has no human-friendly id of its own.
#
# The last five pairs are single explicit denies -- which is why `action` needs
# a real deny value rather than treating absence-of-permit as the only denial.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: SecurityPolicyRule
  data:
    # ---- app-prod -> k8s-prod ------------------------------------
    - name: deny-spoofed-infra
      index: 10
      action: deny
      log: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: app-prod
      destination_zone: k8s-prod
      source_address:
        - fabric-infra
      destination_address:
        - any
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: app-to-k8s-services
      index: 20
      action: permit
      log: true
      log_session_close: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: app-prod
      destination_zone: k8s-prod
      source_address:
        - app-hosts
      destination_address:
        - k8s-services
      destination_services:
        kind: SecurityService
        data:
          - name: junos-http
            port: 80
            ip_protocol: tcp
          - name: junos-https
            port: 443
            ip_protocol: tcp
    - name: app-to-k8s-icmp
      index: 30
      action: permit
      log: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: app-prod
      destination_zone: k8s-prod
      source_address:
        - app-hosts
      destination_address:
        - k8s-nodes
        - k8s-pods
        - k8s-services
      destination_services:
        kind: SecurityService
        data:
          - name: junos-ping
            port: 0
            ip_protocol: icmp
    # ---- k8s-prod -> app-prod ------------------------------------
    - name: deny-spoofed-infra
      index: 10
      action: deny
      log: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: k8s-prod
      destination_zone: app-prod
      source_address:
        - fabric-infra
      destination_address:
        - any
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: k8s-to-app
      index: 20
      action: permit
      log: true
      log_session_close: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: k8s-prod
      destination_zone: app-prod
      source_groups:
        - k8s-all
      destination_address:
        - app-hosts
    # ---- wan -> k8s-prod -----------------------------------------
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: deny-spoofed-infra
      index: 10
      action: deny
      log: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: wan
      destination_zone: k8s-prod
      source_address:
        - fabric-infra
      destination_address:
        - any
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: wan-to-k8s-services
      index: 20
      action: permit
      log: true
      log_session_close: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: wan
      destination_zone: k8s-prod
      source_address:
        - wan-customers
      destination_address:
        - k8s-services
      destination_services:
        kind: SecurityService
        data:
          - name: junos-http
            port: 80
            ip_protocol: tcp
          - name: junos-https
            port: 443
            ip_protocol: tcp
    # ---- branch -> k8s-prod --------------------------------------
    - name: deny-spoofed-infra
      index: 10
      action: deny
      log: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: branch
      destination_zone: k8s-prod
      source_address:
        - fabric-infra
      destination_address:
        - any
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: branch-to-access-portal
      index: 20
      action: permit
      log: true
      log_session_close: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: branch
      destination_zone: k8s-prod
      source_address:
        - branch-users
      destination_address:
        - access-portal
      destination_services:
        kind: SecurityService
        data:
          - name: junos-http
            port: 80
            ip_protocol: tcp
          - name: junos-https
            port: 443
            ip_protocol: tcp
    # ---- branch -> tooling ---------------------------------------
    # REACHING THE REQUEST PORTAL IS ITSELF A FIREWALL DECISION, which is the
    # point of putting the portal behind ge-0/0/6 rather than beside Infrahub on
    # the host. A branch user asks for application access through a portal they
    # had to be permitted to reach.
    #
    # Deny first, at index 10, exactly as every other pair does: a source
    # claiming to be fabric-infra is dropped before any permit is considered.
    - name: deny-spoofed-infra
      index: 10
      action: deny
      log: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: branch
      destination_zone: tooling
      source_address:
        - fabric-infra
      destination_address:
        - any
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: branch-to-tooling-portal
      index: 20
      action: permit
      log: true
      log_session_close: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: branch
      destination_zone: tooling
      source_address:
        - branch-users
      destination_address:
        - tooling-services
      destination_services:
        kind: SecurityService
        data:
          # THE PORTS THE PORTAL AND THE IDENTITY PROVIDER ACTUALLY SERVE, which
          # are NodePorts rather than 80 and 443. Permitting only the well-known
          # pair looked right and dropped every packet: the firewall was correct
          # and the policy was describing a service that does not exist there.
          #
          # Naming them explicitly is also the honest thing -- the branch may
          # reach the portal, the IdP and Infrahub, and nothing else in the
          # tooling network, which is what a NodePort range full of other
          # services would otherwise expose.
          - name: tooling-portal
            port: 32001
            ip_protocol: tcp
          - name: tooling-oidc
            port: 32556
            ip_protocol: tcp
          - name: infrahub-api
            port: 8000
            ip_protocol: tcp
    - name: branch-to-k8s-icmp
      index: 30
      action: permit
      log: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: branch
      destination_zone: k8s-prod
      source_address:
        - branch-users
      destination_groups:
        - k8s-reachable
      destination_services:
        kind: SecurityService
        data:
          - name: junos-ping
            port: 0
            ip_protocol: icmp
    # ---- wan -> acme-cloud ---------------------------------------
    - name: deny-spoofed-infra
      index: 10
      action: deny
      log: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: wan
      destination_zone: acme-cloud
      source_address:
        - fabric-infra
      destination_address:
        - any
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: acme-sites-to-acme-cloud
      index: 20
      action: permit
      log: true
      log_session_close: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: wan
      destination_zone: acme-cloud
      source_groups:
        - acme-sites
      destination_address:
        - acme-cloud
    # ---- wan -> globex-cloud -------------------------------------
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: deny-spoofed-infra
      index: 10
      action: deny
      log: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: wan
      destination_zone: globex-cloud
      source_address:
        - fabric-infra
      destination_address:
        - any
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: globex-sites-to-globex-cloud
      index: 20
      action: permit
      log: true
      log_session_close: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: wan
      destination_zone: globex-cloud
      source_groups:
        - globex-sites
      destination_address:
        - globex-cloud
    # ---- acme-cloud -> wan ---------------------------------------
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: acme-cloud-to-acme-sites
      index: 10
      action: permit
      log: true
      log_session_close: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: acme-cloud
      destination_zone: wan
      source_address:
        - acme-cloud
      destination_groups:
        - acme-sites
    # ---- globex-cloud -> wan -------------------------------------
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: globex-cloud-to-globex-sites
      index: 10
      action: permit
      log: true
      log_session_close: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: globex-cloud
      destination_zone: wan
      source_address:
        - globex-cloud
      destination_groups:
        - globex-sites
    # ---- wan -> app-prod -----------------------------------------
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: deny-wan-to-app
      index: 10
      action: deny
      log: true
      managed_by_service: false
      policy: nfd41-perimeter
      source_zone: wan
      destination_zone: app-prod
      source_address:
        - any
      destination_address:
        - any
    # ---- wan -> branch -------------------------------------------
      destination_services:
        kind: SecurityService
        data:
          - name: any
            port: 0
            ip_protocol: tcp
    - name: deny-wan-to-branch
      index: 10
      action: deny
