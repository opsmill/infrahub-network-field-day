---
# ============================================================================
# OTTERNET_FABRIC — the fabric deployed in lab/otternet.clab.yml, modelled in Infrahub.
#
# A single-pod, 3-stage L3LS EVPN/VXLAN fabric: two spines and three leaf racks
# (a Kubernetes MLAG pair, an application MLAG pair, and a single border leaf
# that terminates every tenant's firewall and WAN handoff).
#
# Two things are deliberate here:
#
# * `spanning_tree_mode` is NOT set at fabric level. The lab sets MSTP on the
#   leaf tier only, so the spines fall through to AVD's spine default of
#   `none` -- a routed spine has no Layer-2 to protect. Setting it fabric-wide
#   would put MSTP on the spines, which the deployed switches do not run.
#
# * The BGP peer-group passwords are the type-7 ciphertext AVD produced from the
#   lab's cleartext. Type 7 is keyed by the peer-group name, so these values are
#   only valid for AVD's default group names (IPv4-UNDERLAY-PEERS,
#   EVPN-OVERLAY-PEERS, MLAG-IPv4-UNDERLAY-PEER) -- which is what this fabric
#   uses. Lab credentials; rotate for anything real.
#
#   The cleartext they encode carries the lab's own name (`Otternet-Underlay`,
#   `Otternet-Overlay`, `Otternet-Mlag`), and ciphertext is opaque to a rename.
#   So renaming the lab means re-rendering the lab repository's AVD output --
#   `make avd-build` -- and copying the new values here; a search-and-replace
#   leaves these three strings encoding the previous name, and nothing fails
#   until the golden configs are compared.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkFabric
  data:
    - name: "OTTERNET_FABRIC"
      index: 41
      fabric_interface_sorting_method: "create_sorted_device_interface_map"
      virtual_router_mac: "00:1c:73:00:00:99"
      mgmt_gateway: "172.20.41.1"
      asn_pool: "OTTERNET-ASN-Pool"
      node_id_pool: "OTTERNET-NodeID-Pool"
      mgmt_pool: "OTTERNET-Mgmt-Pool"
      fabric_ip_pools:
        - "OTTERNET-Mgmt-Pool"
        - "OTTERNET-Uplink-Pool"
        - "OTTERNET-VTEP-Pool"
        - "OTTERNET-Loopback-Pool"
      underlay_routing_protocol: "ebgp"
      overlay_routing_protocol: "ebgp"
      p2p_uplinks_mtu: 9214
      uplink_pool: "OTTERNET-Uplink-Pool"
      vtep_pool: "OTTERNET-VTEP-Pool"
      loopback_pool: "OTTERNET-Loopback-Pool"
      bgp_evpn_overlay_password: "2NHils94onK6nE2MMNWijxxOsOCeCOFQ"
      bgp_underlay_password: "87RLGnboZoKej7hS1nQ1gmvCbOzSvXef"
      bgp_mlag_password: "ZI1VeYEQ+pkjpDR2GSUIrm2XVrYksW0x"
      dns_servers:
        - otternet-dns
      ntp_servers:
        - "172.20.41.1"
      ntp_set_first_server_as_preferred: true
      local_users:
        - admin
        - avd
      member_of_groups: ["fabrics"]
      # ---------------------------------------------------------------------
      # AVD inputs with no native model in this reference design. Everything
      # here is pass-through: the management plane, the node-type platform
      # defaults, and the three security layers rendered as raw AVD structures
      # (data-plane ACLs, and the prefix lists and route maps that bound what
      # each BGP peer may say). Generated values win over anything here, so a
      # key that later gains a schema field can simply be deleted from this
      # block without changing the rendered config.
      # ---------------------------------------------------------------------
      avd_custom_hostvars:
        # containerlab's ceOS boot template puts Management0 in VRF MGMT and
        # enables eAPI there, so this matches the running lab.
        mgmt_interface: Management0
        mgmt_interface_vrf: MGMT
        default_interface_mtu: 9214
        timezone: UTC
        # `first_id` makes the MLAG peer addressing derive from the lower node ID
        # of the pair, which is what the deployed switches are configured with.
        fabric_ip_addressing:
          mlag:
            algorithm: first_id
        bgp_graceful_restart:
          enabled: true
          restart_time: 300
        underlay_filter_peer_as: false
        underlay_filter_redistribute_connected: true
        dns_settings:
          domain: otternet.lab
        aaa_settings:
          authorization:
            exec:
              default: local
        # eAPI on HTTPS only, and only inside the management VRF.
        management_eapi:
          enabled: true
          enable_https: true
          enable_http: false
          default_services: false
          vrfs:
            - name: MGMT
              enabled: true
        ssh_settings:
          enabled: true
          idle_timeout: 15
          vrfs:
            - name: MGMT
              enabled: true
              ipv4_acl: ACL-MGMT-IN
        logging_settings:
          vrfs:
            - name: MGMT
              source_interface: Management0
        # cEOS has no real hardware SSO, so the reload delays are trimmed to
        # what a container actually honours.
        custom_platform_settings:
          - platforms: [cEOS-LAB]
            reload_delay:
              mlag: 300
              non_mlag: 330
        # Node-type defaults that are uniform across the fabric. The generator
        # deep-merges its own `defaults` (the leaf spanning-tree priority) into
        # these, and owns `nodes` and `node_groups` outright.
        spine:
          defaults:
            platform: cEOS-LAB
            bgp_defaults:
              - no bgp default ipv4-unicast
              - distance bgp 20 200 200
        l3leaf:
          defaults:
            platform: cEOS-LAB
            # The leaves share the spine loopback pool, offset past the spines so
            # the two tiers cannot collide: spine IDs 1-2 take 10.41.0.1-2 and
            # leaf IDs 1-5 take 10.41.0.11-15.
            loopback_ipv4_offset: 10
            mlag_dual_primary_detection: true
            spanning_tree_mode: mstp
            bgp_defaults:
              - no bgp default ipv4-unicast
              - distance bgp 20 200 200
        # -- data-plane ACLs, bound to interfaces by the VRF L3 interfaces ----
        ipv4_acls:
          # Only the node subnet, the pod CIDR and the service CIDR may leave
          # K8S_PROD toward the firewall. A pod or node forging any other source
          # address is dropped and logged at the tenant boundary.
          - name: ACL-K8S-ANTISPOOF
            entries:
              - {sequence: 10, action: permit, protocol: ip, source: 10.110.0.0/24, destination: any}
              - {sequence: 20, action: permit, protocol: ip, source: 10.111.0.0/16, destination: any}
              - {sequence: 30, action: permit, protocol: ip, source: 10.112.0.0/16, destination: any}
              - {sequence: 100, action: deny, protocol: ip, source: any, destination: any, log: true}
          # An ISP hands us packets from many customers; only the assigned
          # customer supernet is a legitimate source.
          - name: ACL-FROM-WAN
            entries:
              - {sequence: 10, action: permit, protocol: ip, source: 10.60.0.0/16, destination: any}
              - {sequence: 100, action: deny, protocol: ip, source: any, destination: any, log: true}
          - name: ACL-FROM-BRANCH
            entries:
              - {sequence: 10, action: permit, protocol: ip, source: 10.70.0.0/24, destination: any}
              - {sequence: 100, action: deny, protocol: ip, source: any, destination: any, log: true}
          # The firewall is trusted to police sessions, but it must never
          # originate fabric infrastructure prefixes.
          - name: ACL-FROM-FIREWALL
            entries:
              - {sequence: 10, action: deny, protocol: ip, source: 10.41.0.0/16, destination: any, log: true}
              - {sequence: 20, action: permit, protocol: ip, source: any, destination: any}
        # ACL-MGMT-IN has to be raw structured config rather than an `ipv4_acls`
        # entry: AVD only renders the ipv4_acls catalogue on devices that
        # reference an ACL from an *interface*. The reference from
        # ssh_settings.vrfs[].ipv4_acl is just a name string, so an ipv4_acls
        # entry would produce an SSH server pointing at an access list that was
        # never defined on any switch.
        custom_structured_configuration_ip_access_lists:
          - name: ACL-MGMT-IN
            entries:
              - {sequence: 10, action: permit, protocol: ip, source: 172.20.41.0/24, destination: any}
              - {sequence: 100, action: deny, protocol: ip, source: any, destination: any, log: true}
        # -- BGP policy: what each peer is allowed to say ---------------------
        custom_structured_configuration_prefix_lists:
          # Cilium may advertise only the pod and service CIDRs it was assigned.
          - name: PL-CILIUM-PERMITTED
            sequence_numbers:
              - {sequence: 10, action: permit 10.111.0.0/16 le 26}
              - {sequence: 20, action: permit 10.112.0.0/16 le 32}
          # The nodes need a default route and the node subnet, nothing more.
          - name: PL-FABRIC-TO-CILIUM
            sequence_numbers:
              - {sequence: 10, action: permit 0.0.0.0/0}
              - {sequence: 20, action: permit 10.110.0.0/24}
          # What the ISP may tell us: customer prefixes, and in particular not a
          # default route -- accepting one would send DC egress to the provider
          # and around the firewall.
          - name: PL-WAN-PERMITTED
            sequence_numbers:
              - {sequence: 10, action: permit 10.60.0.0/16 le 24}
          - name: PL-BRANCH-PERMITTED
            sequence_numbers:
              - {sequence: 10, action: permit 10.70.0.0/24}
          # What we are willing to tell the outside world: the service VIP range
          # and each tenant's cloud subnet. Not the pod CIDR, not the node
          # subnet, not the app tenant.
          - name: PL-DC-ADVERTISED
            sequence_numbers:
              - {sequence: 10, action: permit 10.112.240.0/24 le 32}
              - {sequence: 20, action: permit 10.220.10.0/24 le 32}
              - {sequence: 30, action: permit 10.220.20.0/24 le 32}
          # The branch gets one prefix more than a WAN customer: the k8s node
          # subnet, so its own staff can traceroute and ping a node rather than
          # only opening a TCP session to a VIP.
          - name: PL-DC-ADVERTISED-BRANCH
            sequence_numbers:
              - {sequence: 10, action: permit 10.112.240.0/24 le 32}
              - {sequence: 20, action: permit 10.110.0.0/24}
              # The tooling network, where the request portal lives. A route the
              # leaf knows but does not advertise is invisible to the branch,
              # and the symptom is a portal that resolves and never answers.
              - {sequence: 30, action: permit 10.90.0.0/24}
        custom_structured_configuration_route_maps:
          - name: RM-CILIUM-IN
            sequence_numbers:
              - sequence: 10
                type: permit
                description: Accept only sanctioned pod and service CIDRs
                match: ["ip address prefix-list PL-CILIUM-PERMITTED"]
                set: ["community 65101:110 additive"]
              - sequence: 99
                type: deny
                description: Explicit deny - anything else is a policy violation
          - name: RM-WAN-IN
            sequence_numbers:
              - sequence: 10
                type: permit
                description: Accept only assigned customer supernets
                match: ["ip address prefix-list PL-WAN-PERMITTED"]
                set: ["community 65103:50 additive"]
              - sequence: 99
                type: deny
                description: Explicit deny - the provider announced something it should not
          - name: RM-BRANCH-IN
            sequence_numbers:
              - sequence: 10
                type: permit
                description: Accept only the branch LAN
                match: ["ip address prefix-list PL-BRANCH-PERMITTED"]
                set: ["community 65103:70 additive"]
              - sequence: 99
                type: deny
                description: Explicit deny
          - name: RM-DC-TO-BRANCH
            sequence_numbers:
              - sequence: 10
                type: permit
                description: Advertise DC services and the node subnet to our own office
                match: ["ip address prefix-list PL-DC-ADVERTISED-BRANCH"]
              - sequence: 99
                type: deny
                description: Explicit deny - still no pod CIDR, still no app tenant
          - name: RM-DC-TO-EXTERNAL
            sequence_numbers:
              - sequence: 10
                type: permit
                description: Advertise the DC service VIP range only
                match: ["ip address prefix-list PL-DC-ADVERTISED"]
              - sequence: 99
                type: deny
                description: Explicit deny - do not leak DC internals to the outside
          - name: RM-FABRIC-TO-CILIUM
            sequence_numbers:
              - sequence: 10
                type: permit
                description: Default route and node subnet only
                match: ["ip address prefix-list PL-FABRIC-TO-CILIUM"]
              - sequence: 99
                type: deny
      children:
        kind: NetworkPod
        data:
          - name: "otternet-pod1"
            index: 1
            device_designs:
              data:
                - role: spine
                  device_quantity: 2
                  device_template: otternet-spine-switch
            mlag_peer_pool: "OTTERNET-MLAG-Peer-Pool"
            mlag_l3_pool: "OTTERNET-MLAG-L3-Pool"
            pod_ip_pools:
              - "OTTERNET-MLAG-Peer-Pool"
              - "OTTERNET-MLAG-L3-Pool"
            member_of_groups: ["pods"]
---
# MSTP with a low priority on the leaf tier only: the leaves are the only
# switches with Layer-2 to protect, and a leaf must win root against anything a
# workload plugs in. The spines are left alone (see the header).
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: NetworkSpanningTreePriority
  data:
    - fabric: "OTTERNET_FABRIC"
      role: leaf
      priority: 4096
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: LocationHall
  data:
    - name: "Hall-OTTERNET"
      index: 41
