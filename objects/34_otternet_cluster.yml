---
# ============================================================================
# OTTERNET — the Kubernetes cluster as a routing participant.
#
# NO KUBERNETES NODE OBJECTS. The cluster's members are the three
# ComputePhysicalServer objects that already exist in 28_otternet_endpoints.yml,
# enrolled through the marketplace's `worker_in_cluster` relationship. That is
# what adopting infrahub/cluster bought: "machine that belongs to a cluster"
# was already modelled, so there is no second kind for the same idea.
#
# Which members run a BGP speaker is the cluster's node_selector, not a flag
# on each machine — which is how the CNI itself decides.
#
# Every value here has a counterpart the fabric generators already emit onto
# the leaves. Change one side without the other and BGP either does not come
# up, or comes up and carries nothing:
#
#   local_asn 65401       -> neighbor ... remote-as 65401 on both k8s leaves
#   peer_address .2 / .3  -> the leaves' unique Vlan110 SVI addresses
#   peer_asn 65101        -> the k8s-leaf MLAG pair's shared BGP AS
#   pod_cidr_communities  -> the community RM-CILIUM-IN adds on accept
#
# Sourced from ../lab/crossplane/platform/10-peering.yaml and
# ../lab/k8s/helm/cilium-values.yaml.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ClusterKubernetes
  data:
    - name: otternet
      description: "k3s cluster whose CNI peers BGP with both k8s leaves"
      locations:
        - K8S_LEAFS
      distribution: k3s
      kubernetes_version: v1.31.3
      cni_kind: cilium
      cni_version: 1.18.6
      local_asn: 65401
      # The NAME of the in-cluster secret, never the password.
      bgp_auth_secret_name: otternet-bgp-auth
      pod_cidr_communities:
        - "65401:110"
      # Aggressive on purpose, so a leaf failure converges inside a demo's
      # attention span rather than the usual 90 seconds.
      bgp_timers:
        connectRetrySeconds: 5
        holdTimeSeconds: 9
        keepAliveSeconds: 3
      node_selector:
        - "otternet.lab/bgp=true"
      advertisement_selector:
        - "otternet.lab/advertise=fabric"
      pod_prefix: ["10.111.0.0/16", "default"]
      service_prefix: ["10.112.0.0/16", "default"]
      node_prefix: ["10.110.0.0/24", "default"]
      vip_pools:
        - ["10.112.240.0/24", "default"]
      vrf: K8S_PROD
      # The inline form is an upsert, so the servers' own mandatory fields are
      # restated. They already exist in 28_otternet_endpoints.yml; these values
      # match, so the upsert matches by HFID and adds only the membership.
      nodes:
        kind: ComputePhysicalServer
        data:
          - name: k8s-node1
            status: provisioning
            role: compute
            rack: K8S_LEAFS
          - name: k8s-node2
            status: provisioning
            role: compute
            rack: K8S_LEAFS
          - name: k8s-node3
            status: provisioning
            role: compute
            rack: K8S_LEAFS

---
# The leaves' Vlan110 SVI addresses as IPAM objects.
#
# EvpnSviNode.ip_address is an IPHost attribute, not a relationship, so the
# fabric data does not create these -- but the peering has to point at a real
# address object, because that is what stops someone recording the MLAG pair's
# shared VARP gateway instead of a single leaf's own address.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: 10.110.0.2/24
      description: "leaf-otternet-pod1-1-1 Vlan110 SVI; the first Cilium BGP peer"
    - address: 10.110.0.3/24
      description: "leaf-otternet-pod1-1-2 Vlan110 SVI; the second Cilium BGP peer"

---
# One session per leaf. The peer address is each leaf's OWN Vlan110 SVI
# address, never the MLAG pair's shared VARP gateway 10.110.0.1 — an anycast
# address is ambiguous across the pair and cannot identify a single peer.
# Ownership of these rows is split, and cycle 015 moved the line again:
#
#   name -> declared HERE and authoritative. It is a lab-facing label:
#     `k8s-leaf1` is the containerlab hostname of the switch the fabric model
#     calls `leaf-otternet-pod1-1-1`. The lab models the same two switches twice,
#     so the label is not derivable from the device, and a session the
#     generator creates from scratch is named after the device instead.
#
#   peer_asn, peer_address -> SEEDS only. `generate-fabric-peering` derives
#     both -- the ASN from the peer device's RoutingAsn (cycle 012) and the
#     address from its Vlan110 peering SVI (cycles 014 and 015) -- and
#     overwrites whatever is below, logging a warning when it disagrees.
#
# Why the seeds remain despite being derived: both fields are `optional: false`
# on ClusterFabricPeering, so an object file cannot declare a session without
# them. Removing them means removing the rows entirely, and the rows are what
# carry `name`. Doing that was tested: the generator then recreates the
# sessions named after their devices, which changes the peer names in the
# rendered Crossplane manifest. Keeping the rows keeps the manifest stable,
# which is the stronger guarantee.
#
# Deleting a session and letting the generator recreate it is therefore not
# reversible through `object load`: the file matches by (cluster, name) while
# uniqueness is by (cluster, peer_device), so a renamed session cannot be
# matched back. Rename it directly if that happens.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ClusterFabricPeering
  data:
    - name: k8s-leaf1
      description: "Cilium to the first k8s leaf"
      cluster: otternet
      peer_asn: 65101
      enabled: true
      peer_device: leaf-otternet-pod1-1-1
      peer_address: ["10.110.0.2/24", "default"]
      svi: [K8S_PROD, K8S_NODES]
    - name: k8s-leaf2
      description: "Cilium to the second k8s leaf"
      cluster: otternet
      peer_asn: 65101
      enabled: true
      peer_device: leaf-otternet-pod1-1-2
      peer_address: ["10.110.0.3/24", "default"]
      svi: [K8S_PROD, K8S_NODES]
