# ============================================================================
# NFD41 -- the perimeter firewall's static routes.
#
# Eight routes, transcribed from ../lab/configs/fw/vsrx/junos.conf lines
# 163-170. The device holds them; this file is not a design.
#
# WHY THIS FILE EXISTS AT ALL. Cycle 023 rendered 573 of junos.conf's 677
# lines and had to enumerate `routing-options { static { ... } }` among the
# 104 it left out, because a SecurityFirewall could not own a static route:
# RoutingStaticRoute.device peered DcimDevice, and fw1 is not one. Cycle 024
# widened that peer to DcimGenericDevice. This is the data that gap was for,
# and cycle 026 renders it.
#
# THREE THINGS THAT LOOK LIKE OMISSIONS AND ARE DECISIONS:
#
# * `vrf` is absent. The device's routing-options block sits outside any
#   `routing-instances` stanza, so these are master-instance routes -- which
#   is exactly what the schema default "default" means. Setting it explicitly
#   would be redundant, and the live schema carries a `[device, prefix]`
#   uniqueness constraint derived from the HFID as well as the declared
#   `[device, prefix, vrf]`, so this field staying consistent matters more
#   than the YAML suggests.
#
# * `gateway`, `interface`, `distance` and `tag` are unset. The device sets
#   none of them. Inventing a value is not a transcription -- cycle 026 would
#   render it as configuration the firewall does not have.
#
# * `device` is a plain scalar, not an inline `kind:`/`data:` block. The
#   reflex for a relationship peering a generic is the inline form, which is
#   what cycle 023 needed for the polymorphic address book. It is unnecessary
#   here: DcimGenericDevice defines `human_friendly_id: [name__value]`, so
#   the scalar resolves. Verified by loading, not by reading.
#
# `route_name` carries each route's own /* ... */ comment verbatim, "incl."
# included. A renderer reproducing the file must not have to undo a tidy-up.
#
# The filename is load-bearing: fw1 is created in 31_, and these reference it.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: RoutingStaticRoute
  data:
    - prefix: "10.110.0.0/24"
      next_hop: "10.250.110.1"
      route_name: "k8s nodes"
      device: "fw1"
    - prefix: "10.111.0.0/16"
      next_hop: "10.250.110.1"
      route_name: "k8s pod CIDR"
      device: "fw1"
    - prefix: "10.112.0.0/16"
      next_hop: "10.250.110.1"
      route_name: "k8s service CIDR incl. LoadBalancer VIPs"
      device: "fw1"
    - prefix: "10.210.0.0/24"
      next_hop: "10.250.210.1"
      route_name: "app tenant hosts"
      device: "fw1"
    - prefix: "10.60.0.0/16"
      next_hop: "10.250.150.1"
      route_name: "WAN customer supernet"
      device: "fw1"
    - prefix: "10.70.0.0/24"
      next_hop: "10.250.170.1"
      route_name: "branch office LAN"
      device: "fw1"
    - prefix: "10.220.10.0/24"
      next_hop: "10.250.10.1"
