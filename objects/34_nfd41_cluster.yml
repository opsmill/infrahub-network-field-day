---
# ============================================================================
# NFD41 — the Kubernetes cluster as a routing participant.
#
# NO KUBERNETES NODE OBJECTS. The cluster's members are the three
# ComputePhysicalServer objects that already exist in 28_nfd41_endpoints.yml,
# enrolled through the marketplace's `worker_in_cluster` relationship. That is
# what adopting infrahub/cluster bought: "machine that belongs to a cluster"
# was already modelled, so there is no second kind for the same idea.
#
# Which members run a BGP speaker is the cluster's node_selector, not a flag
# on each machine — which is how the CNI itself decides.
#
# Every value here has a counterpart the fabric generators already emit onto
# the leaves. Change one side without the other and BGP either does not come
# up, or comes up and carries nothing:
#
#   local_asn 65401       -> neighbor ... remote-as 65401 on both k8s leaves
#   peer_address .2 / .3  -> the leaves' unique Vlan110 SVI addresses
#   peer_asn 65101        -> the k8s-leaf MLAG pair's shared BGP AS
#   pod_cidr_communities  -> the community RM-CILIUM-IN adds on accept
#
# Sourced from ../lab/crossplane/platform/10-peering.yaml and
# ../lab/k8s/helm/cilium-values.yaml.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ClusterKubernetes
  data:
    - name: nfd41
      description: "k3s cluster whose CNI peers BGP with both k8s leaves"
      locations:
        - K8S_LEAFS
      distribution: k3s
      kubernetes_version: v1.31.3
      cni_kind: cilium
      cni_version: 1.18.6
      local_asn: 65401
      # The NAME of the in-cluster secret, never the password.
      bgp_auth_secret_name: nfd41-bgp-auth
      pod_cidr_communities:
        - "65401:110"
      # Aggressive on purpose, so a leaf failure converges inside a demo's
      # attention span rather than the usual 90 seconds.
      bgp_timers:
        connectRetrySeconds: 5
        holdTimeSeconds: 9
        keepAliveSeconds: 3
      node_selector:
        - "nfd41.lab/bgp=true"
      advertisement_selector:
        - "nfd41.lab/advertise=fabric"
      pod_prefix: ["10.111.0.0/16", "default"]
      service_prefix: ["10.112.0.0/16", "default"]
      node_prefix: ["10.110.0.0/24", "default"]
      vip_pools:
        - ["10.112.240.0/24", "default"]
      vrf: K8S_PROD
      # The inline form is an upsert, so the servers' own mandatory fields are
      # restated. They already exist in 28_nfd41_endpoints.yml; these values
      # match, so the upsert matches by HFID and adds only the membership.
      nodes:
        kind: ComputePhysicalServer
        data:
          - name: k8s-node1
            status: provisioning
            role: compute
            rack: K8S_LEAFS
          - name: k8s-node2
            status: provisioning
            role: compute
            rack: K8S_LEAFS
          - name: k8s-node3
            status: provisioning
            role: compute
            rack: K8S_LEAFS

---
# The leaves' Vlan110 SVI addresses as IPAM objects.
#
# EvpnSviNode.ip_address is an IPHost attribute, not a relationship, so the
# fabric data does not create these -- but the peering has to point at a real
# address object, because that is what stops someone recording the MLAG pair's
# shared VARP gateway instead of a single leaf's own address.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamIPAddress
  data:
    - address: 10.110.0.2/24
      description: "leaf-nfd41-pod1-1-1 Vlan110 SVI; the first Cilium BGP peer"
    - address: 10.110.0.3/24
      description: "leaf-nfd41-pod1-1-2 Vlan110 SVI; the second Cilium BGP peer"

---
# One session per leaf. The peer address is each leaf's OWN Vlan110 SVI
# address, never the MLAG pair's shared VARP gateway 10.110.0.1 — an anycast
# address is ambiguous across the pair and cannot identify a single peer.
# Ownership of these rows is split, deliberately, as of the service-layer
# generator (specs/012-service-layer-generator):
#
#   name, peer_address, description, svi -> declared HERE and authoritative.
#     `name` is a lab-facing label -- `k8s-leaf1` is the containerlab hostname
#     of the switch the fabric model calls `leaf-nfd41-pod1-1-1`.
#
#     peer_address was in this list for the same reason as the rest: nothing in
#     the fabric model connected a peering address to a device, so the generator
#     had no traversal to derive it from and was forbidden to invent one
#     (FR-027). That is no longer true -- see below.
#
#   peer_asn -> a SEED only. `generate-fabric-peering` overwrites it from the
#     peer device's own RoutingAsn, which is the number AVD renders onto the
#     switch. If the value below ever disagrees with the fabric, the generator
#     wins and the drift is corrected rather than shipped.
#
# These rows are therefore NOT removed. They are the only record of each
# session's address, and deleting them would leave a deleted session
# unrecreatable.
#
# THE PRECONDITION FOR REMOVING peer_address IS NOW MET
# (specs/014-k8s-leaf-peering-svi). 36_nfd41_peering_svis.yml gives each leaf a
# Vlan110 interface holding its own address, so
#
#     IpamIPAddress -> interface -> device
#
# now resolves and the address is derivable from the peer device exactly as the
# ASN already is. Nothing consumes that yet: `peer_address` below is still
# authoritative, and cycle 014 deliberately changed no generator so that the
# data change could be proved inert on its own.
#
# The follow-up is to make generate-fabric-peering set `peer_address` from the
# traversal -- the single address the peer device owns inside the cluster's
# node_prefix -- and only then drop the values here, the way `peer_asn` was
# demoted to a seed. Two things that follow-up must not get wrong:
#
#   * traverse `IpamIPAddress.interface`, NOT `InterfaceVirtual.ip_address`.
#     They are different relationships and only the former is bidirectional;
#     36_nfd41_peering_svis.yml explains this at length.
#   * 10.110.0.1 is the pair's shared VARP gateway and is deliberately not an
#     address object, so it cannot be selected. Do not "helpfully" seed it.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: ClusterFabricPeering
  data:
    - name: k8s-leaf1
      description: "Cilium to the first k8s leaf"
      cluster: nfd41
      peer_asn: 65101
      enabled: true
      peer_device: leaf-nfd41-pod1-1-1
      peer_address: ["10.110.0.2/24", "default"]
      svi: [K8S_PROD, K8S_NODES]
    - name: k8s-leaf2
      description: "Cilium to the second k8s leaf"
      cluster: nfd41
      peer_asn: 65101
      enabled: true
      peer_device: leaf-nfd41-pod1-1-2
      peer_address: ["10.110.0.3/24", "default"]
      svi: [K8S_PROD, K8S_NODES]
