---
# ============================================================================
# OTTERNET — every network outside the Arista fabric.
#
# These exist as IpamPrefix objects rather than as text on the things that use
# them, because the lab matches on the same ranges from several places at once:
# the leaves' route policy, the firewall address book, and the CNI's own
# policies. One object each is what makes agreement between them a graph fact.
#
# Sourced from ../lab/wan/tenants.yml, ../lab/configs/fw/vsrx/junos.conf and
# ../lab/crossplane/platform/10-peering.yaml.
#
# Loaded before 30_* because organizations, devices, zones and the cluster all
# reference these.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    # ---- Kubernetes ------------------------------------------------------
    - prefix: 10.110.0.0/24
      role: tenant_host
      status: active
      description: "Kubernetes node subnet, VLAN K8S_NODES"
    - prefix: 10.111.0.0/16
      role: pod
      status: active
      description: "Cilium pod CIDR"
    - prefix: 10.112.0.0/16
      role: service
      status: active
      description: "Kubernetes service CIDR"
    - prefix: 10.112.240.0/24
      role: vip_pool
      status: active
      description: "LoadBalancer VIP pool; the only DC range re-advertised to the branch"
    # The demo application's own /28 out of the pool above. Per-app rather than
    # one cluster-wide block so a claim cannot hand itself an address out of
    # another app's range -- the reason the XRD takes a vipBlock per FabricApp.
    - prefix: 10.112.240.0/28
      role: vip_pool
      status: active
      description: "VIP block for the otternet-demo application"

    # ---- the classic application tier ------------------------------------
    - prefix: 10.210.0.0/24
      role: tenant_host
      status: active
      description: "Bare-metal application hosts, VLAN APP_HOSTS"

    # ---- isolated tenant clouds ------------------------------------------
    - prefix: 10.220.10.0/24
      role: tenant_cloud
      status: active
      description: "acme isolated cloud subnet, VRF TENANT_ACME"
    - prefix: 10.220.20.0/24
      role: tenant_cloud
      status: active
      description: "globex isolated cloud subnet, VRF TENANT_GLOBEX"

    # ---- WAN customer space ----------------------------------------------
    - prefix: 10.60.0.0/16
      role: wan_customer
      status: active
      description: "The aggregate the provider announces on its tenants' behalf"
    - prefix: 10.60.10.0/24
      role: wan_customer
      status: active
      description: "acme hq LAN"
    - prefix: 10.60.11.0/24
      role: wan_customer
      status: active
      description: "acme dr LAN"
    - prefix: 10.60.20.0/24
      role: wan_customer
      status: active
      description: "globex hq LAN"

    # ---- branch office ---------------------------------------------------
    - prefix: 10.70.0.0/24
      role: branch_lan
      status: active
      description: "Branch office switched LAN"

    # ---- the internet, such as it is -------------------------------------
    - prefix: 198.51.100.0/24
      role: internet
      status: active
      description: "Internet LAN behind AS 64500"

    # ---- firewall zone handoffs, one /30 per zone ------------------------
    - prefix: 10.250.110.0/30
      role: off_fabric_point_to_point
      status: active
      description: "Border leaf to firewall, zone k8s-prod"
    - prefix: 10.250.210.0/30
      role: off_fabric_point_to_point
      status: active
      description: "Border leaf to firewall, zone app-prod"
    - prefix: 10.250.150.0/30
      role: off_fabric_point_to_point
      status: active
      description: "Border leaf to firewall, zone wan"
    - prefix: 10.250.170.0/30
      role: off_fabric_point_to_point
      status: active
      description: "Border leaf to firewall, zone branch"
    - prefix: 10.250.10.0/30
      role: off_fabric_point_to_point
      status: active
      description: "Border leaf to firewall, zone acme-cloud"
    - prefix: 10.250.20.0/30
      role: off_fabric_point_to_point
      status: active
      description: "Border leaf to firewall, zone globex-cloud"

    # ---- provider and branch circuits ------------------------------------
    - prefix: 10.50.0.0/24
      role: loopback
      status: active
      description: "Provider loopbacks"
    - prefix: 10.50.255.0/30
      role: off_fabric_point_to_point
      status: active
      description: "isp-pe1 to isp-pe2 core link"
    - prefix: 10.52.0.0/30
      role: off_fabric_point_to_point
      status: active
      description: "isp-pe2 to internet-rtr peering link"
    - prefix: 10.250.50.0/30
      role: off_fabric_point_to_point
      status: active
      description: "isp-pe2 to border leaf handoff, VRF WAN"
    - prefix: 10.250.70.0/30
      role: off_fabric_point_to_point
      status: active
      description: "Branch private circuit to the border leaf; no provider in the path"
    - prefix: 10.51.10.0/30
      role: off_fabric_point_to_point
      status: active
      description: "acme hq attachment circuit"
    - prefix: 10.51.11.0/30
      role: off_fabric_point_to_point
      status: active
      description: "acme dr attachment circuit"
    - prefix: 10.51.20.0/30
      role: off_fabric_point_to_point
      status: active
      description: "globex hq attachment circuit"
    - prefix: 10.70.255.0/24
      role: loopback
      status: active
      description: "Branch router loopback"
---
# ============================================================================
# The pool that carves per-application VIP blocks out of 10.112.240.0/24.
#
# DECLARED HERE, NOT IN 21_otternet_pools.yml WITH THE OTHERS, and the reason is
# load order. `CoreIPPrefixPool.resources` must name prefixes that ALREADY
# exist, and this supernet is declared above in this same file -- eight files
# after 21. Putting the pool with the other pools failed a fresh `invoke load`
# with "Unable to find the node 10.112.240.0/24 / BuiltinIPPrefix in the
# database", which names the prefix and not the file that had to move.
#
# It was invisible on a running instance, because the supernet was already
# there. Only a rebuild from nothing puts the files back in order.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: OTTERNET-VIP-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      # /28 gives 16 blocks out of the /24, which is more applications than this
      # lab will ever run and still leaves each one a usable set of VIPs.
      default_prefix_length: 28
      ip_namespace: default
      resources:
        - 10.112.240.0/24
