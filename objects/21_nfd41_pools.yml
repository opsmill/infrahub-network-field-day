---
# ============================================================================
# NFD41 — addressing and numbering pools.
#
# Every range here is the range the deployed lab already uses (see
# lab/avd/group_vars/NFD41_L3LEAFS.yml and NFD41_SPINES.yml). The point-to-point
# and MLAG pools are handed to AVD as *pools*, so AVD derives each /31 from the
# node ID exactly as it does in the lab; the loopback and management addresses
# are pinned per device in 26_nfd41_devices.yml, because those are facts of a
# running lab rather than something to re-allocate.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: IpamPrefix
  data:
    # The fabric's whole addressing block. Everything the fabric numbers itself
    # from is inside it, which gives the generators' deterministic fallback a
    # scoped supernet to carve from if a role-specific pool is ever missing.
    # The out-of-band management range sits deliberately outside: it is not
    # fabric addressing and is reachable when the fabric is not.
    - prefix: 10.41.0.0/16
      role: fabric_supernet
    - prefix: 172.20.41.0/24
      role: management
    - prefix: 10.41.0.0/24
      role: loopback
    - prefix: 10.41.1.0/24
      role: loopback-vtep
    - prefix: 10.41.255.0/24
      role: fabric_point_to_point
    - prefix: 10.41.254.0/24
      role: mlag
    - prefix: 10.41.253.0/24
      role: mlag_peering
    # The supernet segment subnets are carved from. A CoreIPPrefixPool's
    # `resources` must name prefixes that already exist, so the pool below
    # cannot stand on its own -- the load fails with "Unable to find the node
    # 10.230.0.0/16 / BuiltinIPPrefix in the database", which says nothing about
    # pools.
    - prefix: 10.230.0.0/16
      role: tenant_host
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPPrefixPool
  data:
    - name: NFD41-Uplink-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - 10.41.255.0/24
    - name: NFD41-VTEP-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - 10.41.1.0/24
    # Tenant segment subnets. 10.230.0.0/16 is free: the lab's own space runs
    # 10.41 (fabric), 10.50-10.52 and 10.60 (WAN), 10.70 (branch), 10.110-10.112
    # (Kubernetes), 10.210-10.220 (existing segments) and 10.250 (handoffs).
    # Carved at /24 by default, which is what every hand-written segment uses.
    - name: NFD41-Segment-Subnet-Pool
      default_member_type: prefix
      default_prefix_length: 24
      ip_namespace: default
      resources:
        - 10.230.0.0/16
    - name: NFD41-Loopback-Pool
      default_member_type: prefix
      default_prefix_type: IpamPrefix
      default_prefix_length: 32
      ip_namespace: default
      resources:
        - 10.41.0.0/24
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreIPAddressPool
  data:
    - name: NFD41-Mgmt-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 24
      ip_namespace: default
      resources:
        - 172.20.41.0/24
    - name: NFD41-MLAG-Peer-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - 10.41.254.0/24
    - name: NFD41-MLAG-L3-Pool
      default_address_type: IpamIPAddress
      default_prefix_length: 31
      ip_namespace: default
      resources:
        - 10.41.253.0/24
---
# The fabric's AS block is 65100-65109. The four numbers in use (65100 for the
# spines, 65101-65103 for the three leaf racks) are created directly in
# 26_nfd41_devices.yml, because the deployed lab's route targets and BGP
# communities already reference them -- re-allocating would silently renumber a
# live fabric. This pool therefore covers only the *unused* remainder of the
# block, so a new leaf pair draws the next free number without colliding with an
# AS that is already on a switch. `RoutingAsn.asn` is unique instance-wide, so
# the ranges of every fabric in `objects/` have to stay disjoint.
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNumberPool
  data:
    - name: NFD41-ASN-Pool
      node: RoutingAsn
      node_attribute: asn
      start_range: 65104
      end_range: 65109
    - name: NFD41-NodeID-Pool
      # `node_id` moved to DcimFabricSwitch with the other fabric-only fields in
      # cycle 027, and a number pool names the kind it allocates into.
      node: DcimFabricSwitch
      node_attribute: node_id
      start_range: 1
      end_range: 100
    # Segment VLAN ids. Deliberately clear of everything the lab already uses --
    # 110, 210, 310 and 320 -- and short of 4094, which EOS reserves and the
    # schema excludes. A requester who names no id gets the next free one here.
    - name: NFD41-Segment-VLAN-Pool
      node: IpamVLAN
      node_attribute: vlan_id
      start_range: 500
      end_range: 999
