---
# ============================================================================
# NFD41 — the provider edge: circuits, sites and the internet handoff.
#
# CIRCUITS ARE THE MARKETPLACE KIND. Each DcimCircuit owns two
# DcimCircuitEndpoint objects carrying a `side`, which is a better model than
# four flat interface relationships on one object — and it is already
# published, so it is adopted rather than reinvented.
#
# THE BRANCH HAS NO CIRCUIT, deliberately. Its link is a private fibre into
# border-leaf1 that never touches the ISP, so it is not a purchased circuit
# and has no provider to name. `WanSite.circuit` is optional for exactly this
# case; the physical link belongs in the fabric's own NetworkLink data.
#
# A tenant's two sites appear here as two sites of ONE OrganizationTenant.
# They reach each other by sharing a VPN, not because anything is leaked, so
# there is no relationship between them.
#
# Sourced from ../lab/wan/tenants.yml.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCircuit
  data:
    - circuit_id: acme-hq
      description: "acme headquarters attachment; eBGP with the provider edge"
      circuit_type: mpls
      status: active
      provider: NFD41-ISP
      tenant: acme
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            name: isp-pe1-eth2
            status: active
            description: "Provider side, isp-pe1 eth2, 10.51.10.1/30"
            location:
              kind: LocationSite
              data:
                name: provider-edge
          - side: z
            name: cust-acme-ce-eth1
            status: active
            description: "Customer side, cust-acme-ce eth1, 10.51.10.2/30"
            location:
              kind: LocationSite
              data:
                name: acme-hq

    - circuit_id: acme-dr
      description: "acme DR attachment; statically routed, no routing protocol at all"
      circuit_type: mpls
      status: active
      provider: NFD41-ISP
      tenant: acme
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            name: isp-pe1-eth4
            status: active
            description: "Provider side, isp-pe1 eth4, 10.51.11.1/30"
            location:
              kind: LocationSite
              data:
                name: provider-edge
          - side: z
            name: cust-acme-dr-ce-eth1
            status: active
            description: "Customer side, cust-acme-dr-ce eth1, 10.51.11.2/30"
            location:
              kind: LocationSite
              data:
                name: acme-dr

    - circuit_id: globex-hq
      description: "globex headquarters attachment; eBGP with the provider edge"
      circuit_type: mpls
      status: active
      provider: NFD41-ISP
      tenant: globex
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            name: isp-pe1-eth3
            status: active
            description: "Provider side, isp-pe1 eth3, 10.51.20.1/30"
            location:
              kind: LocationSite
              data:
                name: provider-edge
          - side: z
            name: cust-globex-ce-eth1
            status: active
            description: "Customer side, cust-globex-ce eth1, 10.51.20.2/30"
            location:
              kind: LocationSite
              data:
                name: globex-hq

    - circuit_id: isp-to-internet
      description: "Provider transit to AS 64500"
      circuit_type: internet_access
      status: active
      provider: NFD41-ISP
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            name: isp-pe2-eth3
            status: active
            description: "Provider side, isp-pe2 eth3, 10.52.0.1/30"
            location:
              kind: LocationSite
              data:
                name: provider-edge
          - side: z
            name: internet-rtr-eth1
            status: active
            description: "Internet side, internet-rtr eth1, 10.52.0.2/30"
            location:
              kind: LocationSite
              data:
                name: internet-edge

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: WanSite
  data:
    # The fleshed-out tenant: two sites, attached two different ways.
    - name: hq
      description: "The classic managed CE"
      tenant: acme
      attachment_kind: bgp
      site_asn: 65010
      lan_prefix: ["10.60.10.0/24", "default"]
      location: acme-hq
      circuit: acme-hq
    - name: dr
      description: "A different KIND of edge for the same tenant: no BGP session at all"
      tenant: acme
      attachment_kind: static
      lan_prefix: ["10.60.11.0/24", "default"]
      location: acme-dr
      circuit: acme-dr

    # The control. Configured identically apart from what it bought.
    - name: hq
      description: "globex headquarters"
      tenant: globex
      attachment_kind: bgp
      site_asn: 65020
      lan_prefix: ["10.60.20.0/24", "default"]
      location: globex-hq
      circuit: globex-hq

    # No circuit: a private fibre into the border leaf, with no provider in the
    # path. A different trust level, which is why its tenant is classified
    # `internal`.
    - name: office
      description: "Branch office on a private circuit; never touches the ISP"
      tenant: branch
      attachment_kind: bgp
      site_asn: 65030
      lan_prefix: ["10.70.0.0/24", "default"]
      location: branch-office

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: WanInternetPeering
  data:
    - name: isp-to-internet
      description: "Plain transit to one upstream AS; not an IXP"
      peer_asn: 64500
      provider: NFD41-ISP
      internet_provider: NFD41-Internet
      circuit: isp-to-internet
      customer_aggregate: ["10.60.0.0/16", "default"]
      internet_prefixes:
        - ["198.51.100.0/24", "default"]
