---
# ============================================================================
# NFD41 — the provider edge: circuits, sites and the internet handoff.
#
# CIRCUITS ARE THE MARKETPLACE KIND. Each DcimCircuit owns two
# DcimCircuitEndpoint objects carrying a `side`, which is a better model than
# four flat interface relationships on one object — and it is already
# published, so it is adopted rather than reinvented.
#
# THE BRANCH HAS NO CIRCUIT, deliberately. Its link is a private fibre into
# border-leaf1 that never touches the ISP, so it is not a purchased circuit
# and has no provider to name. `WanSite.circuit` is optional for exactly this
# case; the physical link belongs in the fabric's own NetworkLink data.
#
# A tenant's two sites appear here as two sites of ONE OrganizationTenant.
# They reach each other by sharing a VPN, not because anything is leaked, so
# there is no relationship between them.
#
# Sourced from ../lab/wan/tenants.yml.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: DcimCircuit
  data:
    - circuit_id: acme-hq
      description: "acme headquarters attachment; eBGP with the provider edge"
      circuit_type: mpls
      status: active
      provider: NFD41-ISP
      tenant: acme
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            name: isp-pe1-eth2
            status: active
            description: "Provider side"
            location:
              kind: LocationSite
              data:
                name: provider-edge
            interface: ["isp-pe1", "eth2"]
          - side: z
            name: cust-acme-ce-eth1
            status: active
            description: "Customer side"
            location:
              kind: LocationSite
              data:
                name: acme-hq

            interface: ["cust-acme-ce", "eth1"]
    - circuit_id: acme-dr
      description: "acme DR attachment; statically routed, no routing protocol at all"
      circuit_type: mpls
      status: active
      provider: NFD41-ISP
      tenant: acme
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            name: isp-pe1-eth4
            status: active
            description: "Provider side"
            location:
              kind: LocationSite
              data:
                name: provider-edge
            interface: ["isp-pe1", "eth4"]
          - side: z
            name: cust-acme-dr-ce-eth1
            status: active
            description: "Customer side"
            location:
              kind: LocationSite
              data:
                name: acme-dr

            interface: ["cust-acme-dr-ce", "eth1"]
    - circuit_id: globex-hq
      description: "globex headquarters attachment; eBGP with the provider edge"
      circuit_type: mpls
      status: active
      provider: NFD41-ISP
      tenant: globex
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            name: isp-pe1-eth3
            status: active
            description: "Provider side"
            location:
              kind: LocationSite
              data:
                name: provider-edge
            interface: ["isp-pe1", "eth3"]
          - side: z
            name: cust-globex-ce-eth1
            status: active
            description: "Customer side"
            location:
              kind: LocationSite
              data:
                name: globex-hq

            interface: ["cust-globex-ce", "eth1"]
    - circuit_id: isp-to-internet
      description: "Provider transit to AS 64500"
      circuit_type: internet_access
      status: active
      provider: NFD41-ISP
      endpoints:
        kind: DcimCircuitEndpoint
        data:
          - side: a
            name: isp-pe2-eth3
            status: active
            description: "Provider side"
            location:
              kind: LocationSite
              data:
                name: provider-edge
            interface: ["isp-pe2", "eth3"]
          - side: z
            name: internet-rtr-eth1
            status: active
            description: "Internet side"
            location:
              kind: LocationSite
              data:
                name: internet-edge

            interface: ["internet-rtr", "eth1"]
---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: WanSite
  data:
    # The fleshed-out tenant: two sites, attached two different ways.
    - name: hq
      description: "The classic managed CE"
      tenant: acme
      attachment_kind: bgp
      site_asn: 65010
      lan_prefix: ["10.60.10.0/24", "default"]
      location: acme-hq
      circuit: acme-hq
      # Both ends. A session between two devices is two RoutingBGPNeighbor
      # objects, one per device; cycle 020 widened this to many for that reason.
      bgp_sessions:
        - ["isp-pe1", "10.51.10.2"]
        - ["cust-acme-ce", "10.51.10.1"]
    - name: dr
      description: "A different KIND of edge for the same tenant: no BGP session at all"
      tenant: acme
      attachment_kind: static
      lan_prefix: ["10.60.11.0/24", "default"]
      location: acme-dr
      circuit: acme-dr
      # Deliberately NO bgp_sessions. This site runs no protocol at all, which
      # is the whole reason the relationship is optional. Its reachability is
      # the static route instead.
      static_routes:
        - ["CUST_ACME", "10.60.11.0/24", "10.51.11.2/32"]

    # The control. Configured identically apart from what it bought.
    - name: hq
      description: "globex headquarters"
      tenant: globex
      attachment_kind: bgp
      site_asn: 65020
      lan_prefix: ["10.60.20.0/24", "default"]
      location: globex-hq
      circuit: globex-hq
      bgp_sessions:
        - ["isp-pe1", "10.51.20.2"]
        - ["cust-globex-ce", "10.51.20.1"]

    # No circuit: a private fibre into the border leaf, with no provider in the
    # path. A different trust level, which is why its tenant is classified
    # `internal`.
    - name: office
      description: "Branch office on a private circuit; never touches the ISP"
      tenant: branch
      attachment_kind: bgp
      site_asn: 65030
      lan_prefix: ["10.70.0.0/24", "default"]
      location: branch-office
      # Peers straight with border-leaf1 over a private fibre -- no ISP in the
      # path, so only the branch side of the session is modelled here.
      bgp_sessions:
        - ["branch-rtr", "10.250.70.1"]

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: WanInternetPeering
  data:
    - name: isp-to-internet
      description: "Plain transit to one upstream AS; not an IXP"
      peer_asn: 64500
      provider: NFD41-ISP
      internet_provider: NFD41-Internet
      circuit: isp-to-internet
      customer_aggregate: ["10.60.0.0/16", "default"]
      # Both ends again: `neighbor 10.52.0.2 remote-as 64500` on isp-pe2 and
      # `neighbor 10.52.0.1 remote-as 65500` on internet-rtr. One wire, two
      # device-scoped objects.
      bgp_sessions:
        - ["isp-pe2", "10.52.0.2"]
        - ["internet-rtr", "10.52.0.1"]
      internet_prefixes:
        - ["198.51.100.0/24", "default"]
