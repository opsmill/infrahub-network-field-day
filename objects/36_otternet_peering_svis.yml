---
# ============================================================================
# OTTERNET — the k8s leaves' Vlan110 peering SVIs.
#
# WHY THIS FILE EXISTS
#
# The two Cilium BGP sessions in 34_otternet_cluster.yml each need a peer address,
# and until now that address was only ever hand-typed. The IpamIPAddress
# objects existed, but they hung off nothing: `interface` was null, so there
# was no path from an address back to the switch that answers on it. The
# service-layer generator (specs/012) could therefore derive `peer_asn` from
# the peer device's own RoutingAsn, but had nothing to derive `peer_address`
# from, and was explicitly forbidden to guess (FR-027).
#
# These two interfaces are that missing path:
#
#   IpamIPAddress 10.110.0.2/24 -> interface -> Vlan110 -> device
#                                                          -> leaf-otternet-pod1-1-1
#
# The fabric already knew the pairing -- EvpnSviNode in 27_otternet_vrf_services.yml
# records device + ip_address for exactly these two leaves. But there it is an
# IPHost *attribute*, and an attribute that happens to spell the same text as
# another object is not a traversal. Making it a relationship would be the
# better long-term model; it is also a schema change that would move AVD output
# through three call sites, so it is a separate cycle's problem.
#
# `ip_addresses`, NOT `ip_address` — THIS IS LOAD-BEARING
#
# InterfaceVirtual has two relationships to IpamIPAddress and they are not
# interchangeable:
#
#   ip_addresses  (many, interfacelayer3__ipamipaddress)  <- USE THIS ONE
#       The only one with a reverse side. IpamIPAddress.interface IS this
#       relationship seen from the address, which is the direction anything
#       deriving a peer address has to travel.
#
#   ip_address    (one,  interface__ip_address)           <- NOT this one
#       Added by dcim_extensions.yml. IpamIPAddress has no counterpart to it
#       at all, so setting it leaves `interface` null: the interface would
#       look correct in the UI while the derivation stayed impossible. It is
#       also read by addressing.py on the fabric P2P path, which allocates its
#       own addresses -- not somewhere to write pinned lab data by hand.
#
# The edge must also be WRITTEN from this side. IpamIPAddress.interface peers
# the generic InterfaceLayer3, which has no human_friendly_id, so the loader
# cannot resolve a reference expressed from the address end.
#
# LOAD ORDER
#
# Numbered 36 because it references the IpamIPAddress objects declared in
# 34_otternet_cluster.yml by HFID, and the loader resolves references against
# objects that already exist. Anything earlier than 35 would fail.
#
# DEVICE NAMES
#
# leaf-otternet-pod1-1-1/-2, never k8s-leaf1/k8s-leaf2. The lab models the same
# two physical switches twice -- the k8s-leaf* objects are their containerlab
# hostnames -- and ClusterFabricPeering.peer_device points at the leaf-otternet-*
# names. An address attached to the duplicates would be unreachable from the
# session that needs it. That duplication is pre-existing and not fixed here.
#
# NOT THE VARP GATEWAY
#
# 10.110.0.1 is the MLAG pair's shared virtual-router address and lives on
# EvpnSvi.ip_virtual_router_addresses as intent. It is deliberately not an
# attached address anywhere: it is present on both leaves, so it can never
# identify one BGP neighbour. Attaching it here would make the derivation
# ambiguous rather than wrong, which is the harder failure to notice.
# ============================================================================
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: InterfaceVirtual
  data:
    - name: Vlan110
      device: leaf-otternet-pod1-1-1
      description: "K8S_NODES SVI; Cilium BGP peer for session k8s-leaf1"
      role: peering
      status: active
      dot1q_id: 110
      # List of lists: IpamIPAddress has a two-element human_friendly_id,
      # [address__value, ip_namespace__name__value].
      ip_addresses:
        - ["10.110.0.2/24", "default"]
    - name: Vlan110
      device: leaf-otternet-pod1-1-2
      description: "K8S_NODES SVI; Cilium BGP peer for session k8s-leaf2"
      role: peering
      status: active
      dot1q_id: 110
      ip_addresses:
        - ["10.110.0.3/24", "default"]
