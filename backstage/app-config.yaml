app:
  title: OTTERNET Service Portal
  baseUrl: http://localhost:3001

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Replaced by the Otter-net themes in src/modules/theme, which reuse these
    # ids so the Settings page still offers just Light, Dark and Auto.
    - theme:app/light: false
    - theme:app/dark: false

    # Default landing page configuration.
    # The catalog is mounted at /catalog by default but is overridden here to
    # serve as the root page. To switch to the Home page, comment out the
    # catalog path override and uncomment the home path override.
    - page:catalog:
        config:
          path: /
    # - page:home:
    #     config:
    #       path: /

    # A joke about React developers is not Otter-net's voice.
    - home-page-widget:home/random-joke: false

    # Visit tracking fills the Most Visited and Recently Visited widgets, which
    # otherwise sit on the home page explaining that they are switched off.
    - api:home/visits: true
    - app-root-element:home/visit-listener: true
    - home-page-widget:home/toolkit:
        config:
          tools:
            - url: http://localhost:8000
              label: Infrahub
              icon: kind:component
            - url: http://localhost:8000/proposed-changes
              label: Proposed changes
              icon: kind:api
            - url: /racks
              label: Racks
              icon: kind:resource
            - url: /create
              label: Request a service
              icon: docs
    - home-page-widget:home/world-clock:
        config:
          clockConfigs:
            # Otter-net's points of presence.
            - label: BRU
              timeZone: Europe/Brussels
            - label: PAR
              timeZone: Europe/Paris
            - label: NYC
              timeZone: America/New_York
            - label: DAL
              timeZone: America/Chicago
    - page:home:
        config:
          defaultConfig:
            - component: HomePageSearchBar
              column: 0
              row: 0
              width: 12
              height: 2
              deletable: false
            - component: GettingStarted
              column: 0
              row: 1
              width: 4
              height: 11
            - component: HomePageStarredEntities
              column: 4
              row: 2
              width: 4
              height: 4
            - component: HomePageRandomJoke
              column: 8
              row: 2
              width: 4
              height: 4
            - component: HomePageToolkit
              column: 4
              row: 6
              width: 4
              height: 3
            - component: HomePageWorldClock
              column: 8
              row: 6
              width: 4
              height: 3
            - component: HomePageMostVisited
              column: 4
              row: 9
              width: 4
              height: 4
            - component: HomePageRecentlyVisited
              column: 8
              row: 9
              width: 4
              height: 4

organization:
  name: Otter-net

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3001
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

proxy:
  endpoints:
    # Lets the visual panels query Infrahub from the browser: the token stays in
    # the backend, and the browser talks to same-origin Backstage.
    '/infrahub':
      target: ${INFRAHUB_ADDRESS}
      allowedMethods: [POST]
      headers:
        X-INFRAHUB-KEY: ${INFRAHUB_API_TOKEN}

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # OIDC against the lab's own Dex, which is also what Infrahub authenticates
  # against. The upstream example ships `guest: {}`; a guest portal cannot
  # record who asked for a service, which is the whole point of putting requests
  # behind a catalogue.
  #
  # `environment: development` selects which block under `providers` is used.
  environment: development
  # REQUIRED FOR OIDC, and its absence is not a configuration warning: the
  # openid-client passport strategy keeps state and nonce in an express session,
  # so without this every sign-in attempt fails with
  # `Authentication failed, authentication requires session support` -- a 500
  # from /api/auth/oidc/start that names neither this setting nor the provider.
  # Setting it is what makes the auth router install express-session at all.
  session:
    secret: ${BACKSTAGE_SESSION_SECRET}
  providers:
    oidc:
      development:
        metadataUrl: ${BACKSTAGE_OIDC_METADATA_URL}
        clientId: ${BACKSTAGE_OIDC_CLIENT_ID}
        clientSecret: ${BACKSTAGE_OIDC_CLIENT_SECRET}
        prompt: auto
        # THE RESOLVER IS NOT OPTIONAL, and omitting it is the usual way an
        # otherwise-correct OIDC setup fails: sign-in succeeds at the IdP and
        # then Backstage rejects it because it cannot map the identity onto a
        # catalog User entity.
        #
        # `emailLocalPartMatchingUserEntityName` matches the part before the @
        # against a User entity's name, so `alice@otternet.lab` resolves to the
        # `alice` User in catalog-users.yaml. Dex's static users have no groups,
        # so there is nothing to map beyond identity.
        signIn:
          resolvers:
            - resolver: emailLocalPartMatchingUserEntityName
            # Falls back to minting an identity that belongs to no catalog
            # entity, so a new Dex user can sign in before anyone adds them to
            # catalog-users.yaml. Without it, adding a user to Dex is only half
            # the job and the failure appears at their first login.
            - resolver: emailMatchingUserEntityProfileEmail
              dangerouslyAllowSignInWithoutUserInCatalog: true
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

infrahub:
  instance: dev
  address: ${INFRAHUB_ADDRESS}
  token: ${INFRAHUB_API_TOKEN}

  # Which Infrahub kinds become which catalog entities. Nothing here lists
  # fields: each kind's own Infrahub schema decides what its entity says, so
  # adding an attribute in Infrahub needs no change here.
  catalog:
    # WRITE AS THE SIGNED-IN USER. Infrahub records the account that made a
    # write, which for a portal is its service account; every mutation takes a
    # `context: { account: { id } }` naming someone else instead.
    #
    # ATTRIBUTION, NOT AUTHORIZATION. Permissions are loaded before the resolver
    # runs, so the write executes with the SERVICE account's rights wearing the
    # user's name, and the graph cannot tell "the portal acting as alice" from
    # "alice". This portal is therefore the authorization boundary and has to
    # stay one. The caller needs OVERRIDE_CONTEXT with ALLOW_ALL; SUPER_ADMIN
    # bypasses it, which is why the lab's admin token works untouched.
    #
    # The account is matched by NAME -- the local part of the email, the same
    # rule the sign-in resolver uses -- so nothing has to share a UUID. It only
    # exists once that person has signed in to Infrahub at least once.
    actAsUser: true
    # Filled from the SIGNED-IN USER, never asked for. A request records who
    # asked, and typing that is both busywork and unenforceable -- anyone could
    # type anyone. Kept off every form and set from the Backstage identity.
    userFields: [requester]
    system: infrahub-services
    kinds:
      - kind: LocationSite
        entity: Resource
        type: infrahub-site
      - kind: LocationRack
        entity: Resource
        type: infrahub-rack
      - kind: DcimGenericDevice
        entity: Resource
        type: infrahub-device
      # THIS LAB'S SERVICE KINDS. Each names the group its generator targets,
      # because a generator runs against a group -- a service created outside
      # one is never expanded, and there is nothing to wait for. Each kind's
      # form is still generated from its own Infrahub schema, so adding an
      # attribute there needs no change here.
      #
      # `formExclude` hides what a generator ALLOCATES. Nobody should be asked
      # to type a VLAN id or a subnet the system is about to choose, and a
      # value typed into one of these is either ignored or, worse, honoured.
      - kind: ServiceNetworkSegment
        entity: Component
        groups: [service_network_segments]
        # subnet, vlan and svi are written by the generator; vlan_id is the
        # "leave empty to allocate" field that makes this a request rather than
        # a work order.
        formExclude: [subnet, vlan, svi]
      - kind: ServiceFabricApp
        entity: Component
        groups: [service_fabric_apps]
        # The VIP block is allocated from the cluster's pool when the app is
        # exposed; vip_block_managed records that the generator owns it and is
        # never set by hand.
        formExclude: [vip_block, vip_block_managed]
      - kind: ServiceAppAccess
        entity: Component
        groups: [service_app_accesses]
        # `granted_rules` is the generator's output, not a request input.
        # `checksum` is excluded globally, for every kind, in provider.ts.
        #
        # This list used to name `approved`, `approved_at` and `approved_by`
        # as well. Those fields no longer exist -- the grant is gated by its
        # branch and nothing else -- and `offForm` only ever SUBTRACTS names, so
        # naming absent fields subtracted nothing and quietly implied a gate the
        # schema had dropped.
        formExclude: [granted_rules]
      - kind: ServiceTenantOnboarding
        entity: Component
        groups: [service_tenant_onboardings]
        formExclude: [evpn_tenant, mac_vrf_vni_base]
      - kind: ServiceServerPlacement
        entity: Component
        groups: [service_server_placements]
        formExclude: [server]
      # The WAN kinds SELECT existing technical objects rather than allocating,
      # so no generator sits beneath them and there is no group to name.
      - kind: ServiceL3vpn
        entity: Component
      - kind: ServiceTenantCloud
        entity: Component
      # NAMED EXPLICITLY, ONLY FOR ITS GROUP. The provider discovers it anyway,
      # under the service generic -- but a discovered kind has no `groups`, and
      # `generate-fabric-peering` targets `service_fabric_peerings`. A peering
      # requested through the portal therefore joined nothing, its generator
      # never saw it, and the request opened a proposed change that materialised
      # no sessions. Created and silently never built is the failure mode
      # AGENTS.md warns about for exactly this reason.
      - kind: ServiceFabricPeering
        entity: Component
        groups: [service_fabric_peerings]
      - kind: ServiceInternetAccess
        entity: Component
    # The point of the generic form: a service kind added to Infrahub under
    # ServiceGeneric turns up on the next read, with its own form, with no
    # change to this file.
    discover:
      - generic: ServiceGeneric
        entity: Component
        # No `groups` here on purpose: it would apply to every discovered kind,
        # and the dedicated internet generator's query would then run against
        # service kinds it cannot expand. A kind whose generated form needs a
        # group declares it on its own `kinds` entry above.

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    # Template included: the Infrahub provider emits a generated Template per
    # service kind that has no hand-written one.
    - allow: [Component, System, API, Resource, Location, Template]
  locations:
    # The curated two-for-one: an exposed application and the access to it, in
    # one request. Hand-written because nothing in the generated path can emit a
    # two-kind template. Registered in app-config.docker.yaml too -- that file
    # REPLACES this list, and it is the one the lab runs with.
    - type: file
      target: ../../catalog/exposed-app-with-access.yaml
      rules:
        - allow: [Template]

    # The second act: withdrawing a grant. Its own item rather than a mode of the
    # request form, because the two have nothing in common but the kind.
    - type: file
      target: ../../catalog/revoke-access.yaml
      rules:
        - allow: [Template]

    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../examples/entities.yaml

    # Local example template
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'My Company Backstage' # defaults to "backstage"
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal' # optional
