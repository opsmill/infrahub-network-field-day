# Catalog users, matched to Dex identities by the sign-in resolver.
#
# `emailLocalPartMatchingUserEntityName` matches the part before the @ against
# a User's `metadata.name`, so `alice@otternet.lab` resolves to `alice` here. A Dex
# user with no entry still signs in -- the second resolver allows it -- but gets
# an identity belonging to no group, so ownership and filtering do not work for
# them. Adding a person is two places: here and tooling/10-dex.yaml.
---
apiVersion: backstage.io/v1alpha1
kind: Group
metadata:
  name: network-team
  description: The team that owns the OTTERNET fabric
spec:
  type: team
  children: []
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: alice
  description: Approves access requests
spec:
  profile:
    displayName: Alice Approver
    email: alice@otternet.lab
  memberOf: [network-team]
---
apiVersion: backstage.io/v1alpha1
kind: User
metadata:
  name: bob
  description: Requests services
spec:
  profile:
    displayName: Bob Requester
    email: bob@otternet.lab
  memberOf: [network-team]
