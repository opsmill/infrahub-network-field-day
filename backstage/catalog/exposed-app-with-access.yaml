---
# Exposed application + access grant, as one request on one branch.
#
# WHY THIS IS HAND-WRITTEN AND THE OTHERS ARE GENERATED. `provider.ts` emits one
# template per service kind from the Infrahub schema, and nothing in that path
# can emit a two-kind template. The two generated templates remain the way to
# change an existing application and the way to grant access to one that already
# exists; this is the two-for-one, and it is curated rather than derived.
#
# THE APPLICATION IS PICKED, NOT DESCRIBED (specs/035-application-catalogue). A
# requester chooses an entry from the application catalogue -- "Who am I" -- and
# supplies only what is theirs. Chart repository, chart name, chart version, the
# values, the address-block size and the service selector are the platform
# team's decision and live on the entry in Infrahub; this form no longer asks.
# The entry is READ at request time and its chart fields are sent in the create
# (the schema keeps them mandatory), then `generate-fabric-app` pins the rest on
# the branch -- the values file, and the advertised services -- so a later change
# to the catalogue never upgrades an application already requested. There is no
# way to override the chart or its values from here, by design.
#
# THE ORDER OF THE STEPS IS THE WHOLE DESIGN. `generate-app-access` reads the
# application's `vip_block`, `vrf` and `advertised_services`, and
# `generate-fabric-app` is what allocates the block. Both generators fire on
# `created` through independent rules in triggers.yml and nothing sequences them,
# so a grant created beside its application races the allocation. Losing that
# race is not a retry: `validate_model` raises, `_set_status` stamps the grant
# `error`, and nothing ever runs it again. `infrahub:generators:await` is the
# sequencing primitive -- it triggers the application's generators and blocks
# until they are quiet -- so the grant is created against an application that
# already has its block.
#
# EVERY INPUT THE GRANT'S GENERATOR READS IS IN ITS CREATE MUTATION, never in a
# follow-up update step. The generator fires on creation, so a source set
# afterwards arrives after the run that needed it.
apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: exposed-app-with-access-request
  title: Exposed application, with access
  # Under the hood: a branch, the application, the access grant that lets a
  # site reach it, the fabric regenerated, then one proposed change carrying all
  # of it. The user-facing text says what they get, not how.
  description: >-
    Deploy an application and let one of your sites reach it, in a single
    request that goes to review as one proposed change.
  tags:
    - infrahub
    - service-request
    - curated
spec:
  type: exposed-app-request
  # Matches `infrahub.catalog.owner`, whose default is this.
  owner: user:default/guest

  parameters:
    - title: The application
      required:
        - app_name
        - description
        - namespace_name
        - cluster
        - vrf
        - owner
        - catalogue_entry
      properties:
        app_name:
          title: Application name
          type: string
          # It is the service's name in Infrahub, the stem of the branch name, and
          # the stem of the grant's name -- hence the pattern.
          description: A short name for the application, using lower-case letters, digits and dashes.
          pattern: '^[a-z0-9][a-z0-9-]*$'
          ui:autofocus: true
        description:
          title: What it is
          type: string
          # Shown first on the catalogue entity, so it is written for a stranger.
          description: One sentence describing the application for someone who has never seen it.
        namespace_name:
          title: Kubernetes namespace
          type: string
          # Called namespace_name because `namespace` is a schema-level key in
          # Infrahub.
          description: The Kubernetes namespace the application is installed into.
        cluster:
          title: Cluster
          type: string
          default: otternet
          # ENUMERATED RATHER THAN TYPED. These five fields are hfids, resolved by
          # Infrahub at mutation time, and a wrong one fails AFTER BranchCreate has
          # succeeded -- a red run, no hint of the right value, and an orphan branch
          # to clean up. The sets are small and stable, so the form can carry them.
          # They are not EntityPickers because these kinds are not ingested into the
          # Backstage catalogue; if they ever are, swap these for ui:field pickers.
          #
          # The VIP pool is resolved THROUGH the cluster: only its own `vip_pools`
          # supernets are permitted by the leaves' inbound route policy, so a
          # block from anywhere else is advertised and refused.
          enum:
            - otternet
          description: The Kubernetes cluster to run the application on.
        vrf:
          title: VRF
          type: string
          default: K8S_PROD
          # Only VRFs that exactly one SecurityZone hands off to. CUST_ACME and
          # CUST_GLOBEX are deliberately absent: no zone names them, so the grant's
          # destination zone could not be derived and the generator would refuse.
          enum:
            - K8S_PROD
            - APP_PROD
            - TENANT_ACME
            - TENANT_GLOBEX
            - WAN
            - BRANCH
          #
          # The VRF also decides the grant's destination zone, which is derived by
          # matching it against `SecurityZone.vrf`. Exactly one zone must match, or
          # the grant's generator refuses the request as ambiguous.
          description: The network the application is reachable in.
        owner:
          title: Owning organisation
          type: string
          default: acme
          enum:
            - acme
            - globex
            - branch
            - Arista
            - Juniper
            - Nokia
            - Generic
            - OTTERNET-ISP
            - OTTERNET-Internet
          # Used for both objects, the application and the grant.
          description: The organisation you are ordering this for.
        catalogue_entry:
          title: Application
          type: string
          # A PICKER OVER THE CATALOGUE. The Infrahub provider ingests each entry
          # as a Resource of type `application-definition` (the slug drops the
          # `Service` prefix) and tags it `requestable` only when the entry is
          # requestable AND active -- ONE tag, because a catalogue filter ORs the
          # values of a key, so two tags would offer every active entry plus every
          # requestable one. The lab's own infrastructure applications are not
          # requestable and never appear here.
          #
          # ITS VALUE IS AN ENTITY REF (`resource:default/whoami`), not the
          # entry's name; the `fetch_definition` step resolves it to the Infrahub
          # id. The filter is the convenience. `read_definition` re-reads the entry
          # from Infrahub with the same two conditions and is the control: a stale
          # or hand-edited form naming an entry that is not offered stops there.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Resource
              spec.type: application-definition
              metadata.tags: requestable
            defaultKind: Resource
            allowArbitraryValues: false
          description: The application to deploy. Its chart, version and settings are chosen by the platform team.

    - title: Who may reach it
      required:
        - source_site
        - request_reference
      properties:
        source_site:
          title: Source site
          type: string
          default: branch-office
          # The four sites that carry BOTH a security_zone and a
          # security_source_address. internet-edge and provider-edge are valid site
          # names that the generator then refuses, which is precisely the trap a
          # free-text field cannot signal.
          enum:
            - branch-office
            - acme-hq
            - acme-dr
            - globex-hq
          #
          # The site's own `security_zone` and `security_source_address` supply
          # the rule's source, which is why naming a site is enough. A site
          # carrying neither cannot be used -- internet-edge and provider-edge are
          # infrastructure with nobody sitting at them.
          description: The site whose users need to reach the application.
        justification:
          title: Why
          type: string
          # Recorded on the grant for the reviewer.
          description: Why your users need this, in a sentence or two for the reviewer.
          ui:widget: textarea
          ui:options:
            rows: 4
        request_reference:
          title: Request reference
          type: string
          # It makes the branch name unique, so a run that fails half way can be
          # corrected and resubmitted -- `BranchCreate` is not idempotent and a
          # fixed name would make every retry die on the branch step.
          description: A short label for this request, such as a ticket number, using lower-case letters, digits and dashes.
          pattern: '^[a-z0-9][a-z0-9-]*$'

  steps:
    # ------------------------------------------------------- the catalogue entry
    - id: fetch_definition
      name: Look up the application
      action: catalog:fetch
      input:
        entityRef: ${{ parameters.catalogue_entry }}

    # ------------------------------------------------------------------ branch
    - id: branch
      name: Create the branch
      action: infrahub:graphql:execute
      input:
        # No `branch` input: the branch does not exist yet, so this runs on main.
        query: |
          mutation ($name: String!) {
            BranchCreate(data: { name: $name, sync_with_git: false }) {
              ok
            }
          }
        variables:
          name: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}

    # ---------------------------------------------------- the entry, read again
    # THE CONTROL BEHIND THE PICKER. The picker filters in the browser; this reads
    # the entry from Infrahub with the same two conditions, requestable AND active.
    #
    # A scaffolder step can only fail on a GraphQL error, never on a value, so the
    # refusal is made the way `assert_vip` makes its own: when no entry matches,
    # `edges[0]` is empty, every expression below resolves to nothing, the
    # REQUIRED variables of `create_app` are not provided, and Infrahub rejects
    # the mutation. The run stops there, before an application exists.
    #
    # The entry's chart fields, block size and selector are read here and sent in
    # the create. The advertised services are NOT: the scaffolder cannot template
    # a list out of a relationship read, so `generate-fabric-app` fills them from
    # the entry on the branch, when the request left them empty.
    - id: read_definition
      name: Read the application's catalogue entry
      action: infrahub:graphql:execute
      input:
        branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
        query: |
          query ($id: ID!) {
            ServiceApplicationDefinition(ids: [$id], requestable__value: true, status__value: "active") {
              edges {
                node {
                  id
                  chart_repository {
                    value
                  }
                  chart_name {
                    value
                  }
                  chart_version {
                    value
                  }
                  default_vip_block_size {
                    value
                  }
                  default_service_selector {
                    value
                  }
                }
              }
            }
          }
        variables:
          id: ${{ steps.fetch_definition.output.entity.metadata.annotations["infrahub.opsmill.com/id"] }}

    # ------------------------------------------------------------- application
    - id: create_app
      name: Create the application
      action: infrahub:graphql:execute
      input:
        branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
        # `exposed` is pinned true rather than asked. An application that is not
        # exposed never gets a VIP block, and a grant to an application with no
        # block is exactly the failure this template exists to prevent. Somebody
        # who wants a cluster-internal application wants the generated
        # single-kind template, not this one.
        #
        # `status` is deliberately absent so the schema's own default
        # (`provisioning`) applies -- sending any literal hardcodes another
        # schema's vocabulary into this one.
        query: |
          mutation (
            $infrahub_context_account: String!
            $name: String!
            $description: String!
            $namespace_name: String!
            $chart_repository: String!
            $chart_name: String!
            $chart_version: String!
            $vip_block_size: BigInt!
            $exposed: Boolean!
            $service_selector: GenericScalar!
            $definition: String!
            $cluster: String!
            $vrf: String!
            $owner: String!
          ) {
            ServiceFabricAppCreate(
              context: { account: { id: $infrahub_context_account } }
              data: {
                name: { value: $name }
                description: { value: $description }
                namespace_name: { value: $namespace_name }
                chart_repository: { value: $chart_repository }
                chart_name: { value: $chart_name }
                chart_version: { value: $chart_version }
                vip_block_size: { value: $vip_block_size }
                exposed: { value: $exposed }
                service_selector: { value: $service_selector }
                definition: { id: $definition }
                cluster: { hfid: [$cluster] }
                vrf: { hfid: [$vrf] }
                owner: { hfid: [$owner] }
                member_of_groups: [{ hfid: ["service_fabric_apps"] }]
              }
            ) {
              ok
              object {
                id
              }
            }
          }
        variables:
          infrahub_context_account: ${{ user.entity.metadata.name }}
          name: ${{ parameters.app_name }}
          description: ${{ parameters.description }}
          namespace_name: ${{ parameters.namespace_name }}
          # From the entry, never from the form. Mandatory in the schema, so they
          # are sent here; `generate-fabric-app` pins them again from the same
          # entry, and `definition_pinned` is what stops it doing so twice.
          chart_repository: ${{ steps.read_definition.output.data.ServiceApplicationDefinition.edges[0].node.chart_repository.value }}
          chart_name: ${{ steps.read_definition.output.data.ServiceApplicationDefinition.edges[0].node.chart_name.value }}
          chart_version: ${{ steps.read_definition.output.data.ServiceApplicationDefinition.edges[0].node.chart_version.value }}
          vip_block_size: ${{ steps.read_definition.output.data.ServiceApplicationDefinition.edges[0].node.default_vip_block_size.value }}
          exposed: true
          service_selector: ${{ steps.read_definition.output.data.ServiceApplicationDefinition.edges[0].node.default_service_selector.value }}
          definition: ${{ steps.read_definition.output.data.ServiceApplicationDefinition.edges[0].node.id }}
          cluster: ${{ parameters.cluster }}
          vrf: ${{ parameters.vrf }}
          owner: ${{ parameters.owner }}

    # ------------------------------------------------------------- the barrier
    - id: await_app
      name: Wait for the VIP block to be allocated
      action: infrahub:generators:await
      input:
        branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
        node: ${{ steps.create_app.output.data.ServiceFabricAppCreate.object.id }}

    - id: read_app
      name: Read the allocated block
      action: infrahub:graphql:execute
      input:
        # The branch matters on a read too: without it this queries main, where
        # the application does not exist, and the assertion below would fail for
        # the wrong reason.
        branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
        query: |
          query ($id: ID!) {
            ServiceFabricApp(ids: [$id]) {
              edges {
                node {
                  vip_block {
                    node {
                      id
                      prefix {
                        value
                      }
                    }
                  }
                }
              }
            }
          }
        variables:
          id: ${{ steps.create_app.output.data.ServiceFabricAppCreate.object.id }}

    - id: assert_vip
      name: Prove the block exists before granting access to it
      action: infrahub:graphql:execute
      # THIS STEP EXISTS BECAUSE THE WAIT CAN SUCCEED HAVING WAITED FOR NOTHING.
      # `infrahub:generators:await` stamps its quiet period the first time it
      # sees no active task, and an empty task list is empty at t=0 -- so a run
      # whose generator has not yet enqueued returns {waited: true, tasks: 0}.
      #
      # A scaffolder step can only fail on a GraphQL error, never on a value, so
      # the assertion is made with a REQUIRED variable: when `vip_block` is null
      # the expression below resolves to nothing, `$vip` is not provided, and
      # Infrahub rejects the query. The run stops here, before a grant is
      # created against an application that has no block for it to permit.
      input:
        branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
        query: |
          query ($vip: ID!) {
            IpamPrefix(ids: [$vip]) {
              count
            }
          }
        variables:
          vip: ${{ steps.read_app.output.data.ServiceFabricApp.edges[0].node.vip_block.node.id }}

    # ------------------------------------------------------------------- grant
    - id: create_grant
      name: Create the access grant
      action: infrahub:graphql:execute
      # EVERY INPUT THE GENERATOR READS IS HERE. `generate-app-access` fires on
      # `created`, so a source or a justification set by a later update step
      # arrives after the run that needed it -- the grant would be stamped
      # `error` and never retried.
      #
      # `application` binds by the id the create returned rather than by name:
      # exact, and it cannot be confused by a name that resolves to something
      # else on this branch.
      input:
        branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
        query: |
          mutation (
            $infrahub_context_account: String!
            $name: String!
            $requester: String!
            $justification: String!
            $application: String!
            $source_site: String!
            $owner: String!
          ) {
            ServiceAppAccessCreate(
              context: { account: { id: $infrahub_context_account } }
              data: {
                name: { value: $name }
                requester: { value: $requester }
                justification: { value: $justification }
                application: { id: $application }
                source_site: { hfid: [$source_site] }
                owner: { hfid: [$owner] }
                member_of_groups: [{ hfid: ["service_app_accesses"] }]
              }
            ) {
              ok
              object {
                id
              }
            }
          }
        variables:
          infrahub_context_account: ${{ user.entity.metadata.name }}
          name: ${{ parameters.app_name + "-access" }}
          # Who asked, from the Backstage session rather than typed: anyone
          # could type anyone.
          requester: ${{ user.entity.spec.profile.email if user.entity.spec.profile.email else user.ref }}
          justification: ${{ parameters.justification if parameters.justification else "Requested with the application." }}
          application: ${{ steps.create_app.output.data.ServiceFabricAppCreate.object.id }}
          source_site: ${{ parameters.source_site }}
          owner: ${{ parameters.owner }}

    - id: await_grant
      name: Wait for the firewall objects
      action: infrahub:generators:await
      input:
        branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
        node: ${{ steps.create_grant.output.data.ServiceAppAccessCreate.object.id }}

    # --------------------------------------------------------------- the fabric
    # THE GRANT CHANGES THE FABRIC, AND NOTHING ELSE REGENERATES IT.
    # `generate-app-access` writes a `permit <vip>/32` into the border leaf's
    # `avd_custom_hostvars`, so the branch carries fabric intent. But
    # the event rule `trigger-avd-hostvar-generator-update-custom-hostvars` also
    # runs `generate-avd-device-hostvar` on a branch, but asynchronously, so
    # without these steps the proposed change can open showing a changed JSON
    # blob and no configuration -- a reviewer approving a consequence they
    # cannot see.
    #
    # `infrahub:generators:await` cannot do this: it resolves definitions from
    # the node's OWN groups, and a service object is not in `avd_devices`.
    # Pointing it at the fabric instead would be worse than useless -- the
    # `fabrics` group is also targeted by `generate-pod` and `generate-rack`,
    # which are destructive against a fabric that already has cabling.
    - id: lookup_avd
      name: Find the AVD generators
      action: infrahub:graphql:execute
      # Definition ids are generated per instance, so nothing may be hardcoded.
      input:
        branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
        query: |
          query {
            hostvar: CoreGeneratorDefinition(name__value: "generate-avd-device-hostvar") {
              edges {
                node {
                  id
                }
              }
            }
            structured: CoreGeneratorDefinition(name__value: "generate-avd-device-structured-config") {
              edges {
                node {
                  id
                }
              }
            }
          }

    - id: run_avd_hostvars
      name: Regenerate the host vars for every switch
      action: infrahub:graphql:execute
      # `nodes` OMITTED runs the definition across its whole target group --
      # all seven switches -- rather than one node. `wait_until_completion`
      # blocks until those runs finish: measured at 15s for this fabric, well
      # inside the client's 60s ceiling.
      #
      # `$id: String!` is required on purpose: if the lookup found nothing the
      # variable is absent, Infrahub refuses the query and the run stops here
      # rather than opening a proposed change over a fabric nobody regenerated.
      input:
        branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
        query: |
          mutation ($id: String!) {
            CoreGeneratorDefinitionRun(data: { id: $id }, wait_until_completion: true) {
              ok
            }
          }
        variables:
          id: ${{ steps.lookup_avd.output.data.hostvar.edges[0].node.id }}

    - id: run_avd_structured_config
      name: Regenerate the structured configs
      action: infrahub:graphql:execute
      # Explicit and blocking, although the hostvar pass also cascades into this
      # one: the hostvar generator flips `avd_hostvars_ready`, triggers.yml
      # fires this generator, and THAT run is not covered by the wait above --
      # measured still running when the hostvar call returned. Running it
      # explicitly afterwards is what makes "finished" true rather than likely.
      #
      # It targets `fabrics` rather than `avd_devices`, and it reads the STORED
      # hostvar files, which is why it must run after the pass above and not
      # beside it.
      input:
        branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
        query: |
          mutation ($id: String!) {
            CoreGeneratorDefinitionRun(data: { id: $id }, wait_until_completion: true) {
              ok
            }
          }
        variables:
          id: ${{ steps.lookup_avd.output.data.structured.edges[0].node.id }}

    # --------------------------------------------------------- proposed change
    - id: proposed_change
      name: Open the proposed change
      action: infrahub:graphql:execute
      # No `branch`: a proposed change is an object on main that names the
      # branch, so this runs on main like the generated templates' own.
      input:
        query: |
          mutation ($name: String!, $source_branch: String!, $description: String!) {
            CoreProposedChangeCreate(
              data: {
                name: { value: $name }
                description: { value: $description }
                source_branch: { value: $source_branch }
                destination_branch: { value: "main" }
              }
            ) {
              ok
              object {
                id
              }
            }
          }
        variables:
          name: ${{ "Deploy " + parameters.app_name + " and open access from " + parameters.source_site }}
          source_branch: ${{ "implement_" + parameters.app_name + "_" + parameters.request_reference }}
          description: >-
            ${{ "Requested through the service portal by " +
            (user.entity.spec.profile.displayName if user.entity.spec.profile.displayName else user.ref) +
            " (" + (user.entity.spec.profile.email if user.entity.spec.profile.email else user.ref) +
            "). The application and the access to it are on one branch, so the rule, the address-book entry and the re-rendered firewall configuration are all in this change." }}

    - id: catalog
      name: Refresh the catalogue
      action: infrahub:catalog:refresh

  # The proposed change lives on main. The application and the grant exist only
  # on the request's branch until it merges, so their links carry `?branch=` --
  # without it they open main and the requester's new objects are "not found".
  output:
    links:
      - title: Review the proposed change
        url: ${{ steps.create_app.output.address }}/proposed-changes/${{ steps.proposed_change.output.data.CoreProposedChangeCreate.object.id }}
      - title: The application in Infrahub
        url: ${{ steps.create_app.output.address }}/objects/ServiceFabricApp/${{ steps.create_app.output.data.ServiceFabricAppCreate.object.id }}?branch=${{ ("implement_" + parameters.app_name + "_" + parameters.request_reference) | urlencode }}
      - title: The access grant in Infrahub
        url: ${{ steps.create_app.output.address }}/objects/ServiceAppAccess/${{ steps.create_grant.output.data.ServiceAppAccessCreate.object.id }}?branch=${{ ("implement_" + parameters.app_name + "_" + parameters.request_reference) | urlencode }}
