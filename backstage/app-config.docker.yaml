---
# Layered on top of app-config.yaml for the docker-compose service, which keeps
# the Infrahub wiring, the extensions and the catalog rules.
app:
  # The container's 7007 is published on the host as 3001, and the backend serves
  # the frontend bundle, so both URLs are the same origin.
  #
  # CONFIGURABLE, because this address is not just cosmetic: it is the origin
  # the browser is on, and it must match a redirect URI registered on the
  # `backstage` client in tooling/10-dex.yaml. A lab reached over Tailscale and
  # one reached on localhost are different origins, and OIDC notices.
  baseUrl: ${BACKSTAGE_BASE_URL}

  # THE LINKS ON THE PORTAL'S FIRST SCREEN, corrected for the only audience that
  # reaches it. The dev config points them at localhost, which for a branch user
  # is their own machine, so "review the change you just requested" fails with
  # connection refused. Semaphore is dropped rather than re-pointed: the firewall
  # permits the branch 32001, 32556 and 8000 and nothing else, so its port 3000
  # can never work from there.
  #
  # The whole `tools` list is restated because Backstage config merge REPLACES
  # arrays rather than merging them. It lives INSIDE this `app` block and not in
  # one of its own: a second top-level `app:` key parses fine in Python, which is
  # why yamllint passed, and Backstage's YAML library refuses duplicate keys
  # outright -- the backend crash-looped with a parse error naming no key.
  extensions:
    - home-page-widget:home/toolkit:
        config:
          tools:
            - url: ${INFRAHUB_EXTERNAL_ADDRESS}
              label: Infrahub
              icon: kind:component
            - url: ${INFRAHUB_EXTERNAL_ADDRESS}/proposed-changes
              label: Proposed changes
              icon: kind:api
            - url: /racks
              label: Racks
              icon: kind:resource
            - url: /create
              label: Request a service
              icon: docs

backend:
  baseUrl: ${BACKSTAGE_BASE_URL}
  listen: ':7007'
  # TLS, with a self-signed certificate supplied by scripts/deploy_tooling.sh.
  #
  # IT IS HERE BECAUSE OF `crypto.randomUUID`, not because of eavesdroppers. The
  # frontend calls it after sign-in, `globalThis.crypto` is only populated in a
  # SECURE CONTEXT, and an origin served over plain HTTP at a bare IP is not one
  # -- so sign-in completed and the app then died with
  # `globalThis.crypto.randomUUID is not a function`, which reads like a missing
  # polyfill rather than a transport problem. `localhost` is a secure context by
  # exception, which is why this never appeared while testing from the host.
  #
  # `https: true` would have Backstage generate its own, and that was tried
  # first. It writes the certificate inside the container, so a pod restart
  # produces a NEW one -- and the branch user has to accept a fresh browser
  # exception every time. The deploy script's certificate lives in a Secret and
  # outlives the pod.
  https:
    certificate:
      cert: ${BACKSTAGE_TLS_CERT}
      key: ${BACKSTAGE_TLS_KEY}
  cors:
    origin: ${BACKSTAGE_BASE_URL}
  # ponytail: in-memory, because everything worth keeping lives in Infrahub.
  database:
    client: better-sqlite3
    connection: ':memory:'

proxy:
  endpoints:
    # Lets the visual panels query Infrahub from the browser: the token stays in
    # the backend, and the browser talks to same-origin Backstage.
    '/infrahub':
      target: ${INFRAHUB_ADDRESS}
      allowedMethods: [POST]
      headers:
        X-INFRAHUB-KEY: ${INFRAHUB_API_TOKEN}

infrahub:
  instance: demo
  # Where the BROWSER is sent when the portal links out to Infrahub, which is a
  # different address from the one the backend uses: the backend reaches it
  # over the tooling bridge, and a branch user reaches it through the firewall.
  # Both happen to be `10.90.0.1:8000`; `localhost` was right only while the
  # portal ran on the same host as Infrahub.
  externalAddress: ${INFRAHUB_EXTERNAL_ADDRESS}

catalog:
  # Replaces the dev locations: paths there are relative to packages/backend,
  # the backend runs from /app here, and the scaffolded sample entities are
  # noise next to the Infrahub data.
  locations:
    - type: file
      target: ./examples/org.yaml
      rules:
        - allow: [User, Group]

    # The curated two-for-one. Relative to /app here, and the directory only
    # exists in the image because the Dockerfile COPYs it -- a new directory is
    # silently absent otherwise, which reads as "the template does not appear in
    # the portal" with nothing logged.
    - type: file
      target: ./catalog/exposed-app-with-access.yaml
      rules:
        - allow: [Template]

    # The second act: withdrawing a grant. Its own item rather than a mode of the
    # request form, because the two have nothing in common but the kind.
    - type: file
      target: ./catalog/revoke-access.yaml
      rules:
        - allow: [Template]

# The upstream example enables guest sign-in here with
# `dangerouslyAllowOutsideDevelopment`, because the image runs NODE_ENV=production
# and the guest provider refuses outside development. There is no guest provider
# in this portal at all -- a guest cannot be recorded as having asked for
# anything -- and the OIDC provider carries no such guard, so the block that
# stood here is simply gone. The real configuration is in app-config.yaml.
