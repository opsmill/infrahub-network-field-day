---
# The Infrahub exporter's configuration (cycle 034).
#
# NO `infrahub:` BLOCK HERE, and that is how the token stays out of git. The
# exporter's settings model requires `infrahub.token`, and the only other way it
# reads that block is as one JSON environment variable,
# INFRAHUB_SIDECAR_INFRAHUB, which docker-compose.override.yml builds from
# INFRAHUB_EXPORTER_TOKEN in `.env`. A YAML `infrahub:` block would take
# precedence over the environment and silently discard it.

poll_interval_seconds: 60
# The container's port. The host publishes it on 8002, because 8001 is
# infrahub-mcp.
listen_address: "0.0.0.0"
listen_port: 8001
log_level: INFO

exporters:
  prometheus:
    enabled: true
  otlp:
    enabled: false

# OFF. Device discovery is rendered into the collector's configuration from the
# monitoring profiles instead, where a change is reviewed in a proposed change;
# Telegraf cannot consume http_sd anyway.
service_discovery:
  enabled: false

# One gauge per kind, `infrahub_<kind>_info`, one series per node, value 1, with
# these fields as labels. Counts come from PromQL (`count by (status) (...)`).
# Relationships render as the peer's HFID.
metrics:
  kind:
    # No `status` here: the generic has none. Group membership is what tells
    # the families apart -- avd_devices, srl_routers, junos_firewalls,
    # kubernetes_nodes -- and it renders as a comma-joined label.
    - kind: DcimGenericDevice
      include: [name, member_of_groups]
    - kind: ServiceGeneric
      include: [name, status, owner]
    - kind: OrganizationTenant
      include: [name]
    - kind: CoreProposedChange
      include: [name, state]
    - kind: DeploymentState
      include: [name, status, suspend]
