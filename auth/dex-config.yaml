# yaml-language-server: $schema=https://raw.githubusercontent.com/dexidp/dex/master/config.yaml.json
---
# ============================================================================
# Dex — the lab's on-prem OpenID Connect provider.
#
# Infrahub is the RELYING PARTY, not this. It drives the flow itself
# (`/api/oidc/provider1/authorize` -> here -> `/api/oidc/provider1/token`) and
# mints its OWN access token for an account it maps the identity onto. Nothing
# downstream ever sees a Dex token.
#
# THE ISSUER ADDRESS IS THE WHOLE TRICK, and getting it wrong is the classic
# way OIDC-in-Docker fails. The issuer has to resolve to the same Dex from
# THREE places, because the discovery document the Infrahub container fetches
# contains the URLs the BROWSER is then redirected to:
#
#   1. the Infrahub container, which fetches discovery server-side
#   2. a browser on the host itself
#   3. a browser on someone else's machine, reaching this VM over Tailscale
#
# `localhost` fails (1) -- inside a container it is the container. The
# `172.20.41.1` bridge fails (3) -- it is a local interface of this VM and means
# nothing to a remote browser. The Tailscale name satisfies all three and was
# measured doing so from each, which is why it is the issuer despite being the
# longest of the options.
#
# CREDENTIALS HERE ARE DELIBERATELY FAKE AND DELIBERATELY COMMITTED. This is a
# demo lab with two users whose password is `password`. Nothing real
# authenticates against it, and a lab that cannot be rebuilt from its own
# repository is not reproducible. Do not copy this file into anything that
# matters.
# ============================================================================

issuer: http://agentic-agittings-agittings-dev-vm-02.tailc018d.ts.net:5556/dex

storage:
  # sqlite on a named volume rather than `memory`, so a restart does not
  # invalidate every session and force each demo to log in again mid-run.
  type: sqlite3
  config:
    file: /var/dex/dex.db

web:
  http: 0.0.0.0:5556

oauth2:
  # No consent screen. There is one client and it is the lab's own Infrahub;
  # a consent prompt would only add a click to every demo.
  skipApprovalScreen: true

staticClients:
  - id: infrahub
    name: Infrahub
    secret: infrahub-dex-secret
    # THE PATH IS THE UI ROUTE, NOT THE API ROUTE, and the OpenAPI spec misleads
    # here: it documents `GET /api/oidc/{provider}/token`, which is the endpoint
    # the frontend calls *after* the browser comes back. What Infrahub actually
    # sends as `redirect_uri` is `/auth/oidc/{provider}/callback`.
    #
    # Dex is precise about this when it is wrong -- `Unregistered redirect_uri
    # ("http://172.20.41.1:8000/auth/oidc/provider1/callback")` names the exact
    # string it expected to find here -- so if this ever drifts, read the Dex
    # log rather than guessing from the API documentation.
    #
    # BOTH addresses are registered on purpose. Infrahub builds the redirect
    # from the address the browser arrived on, so a demo driven from
    # `localhost:8000` and one driven from `172.20.41.1:8000` produce different
    # redirect URIs, and only the one that was used is registered otherwise.
    # EVERY address Infrahub might be reached on is registered, because Infrahub
    # builds `redirect_uri` from the address the BROWSER arrived on. A demo
    # driven from localhost and one driven over Tailscale produce different
    # redirect URIs, and only a registered one is accepted.
    redirectURIs:
      - http://localhost:8000/auth/oidc/provider1/callback
      - http://172.20.41.1:8000/auth/oidc/provider1/callback
      - http://agentic-agittings-agittings-dev-vm-02:8000/auth/oidc/provider1/callback
      - http://agentic-agittings-agittings-dev-vm-02.tailc018d.ts.net:8000/auth/oidc/provider1/callback
      - http://100.98.193.51:8000/auth/oidc/provider1/callback

  # The Backstage service portal.
  #
  # Backstage is a SEPARATE relying party from Infrahub, not a client of it.
  # Both trust this Dex, so one person signs in to each with the same identity,
  # but each mints its own session. Backstage still talks to Infrahub with a
  # service token -- Infrahub's own flow ends in Infrahub's UI, which keeps the
  # token, so there is no per-user Infrahub credential to forward. See
  # auth/README.md.
  #
  # The callback path is Backstage's own: `/api/auth/oidc/handler/frame`.
  - id: backstage
    name: NFD41 Service Portal
    secret: backstage-dex-secret
    # The portal moved into the tooling cluster, so these are the addresses a
    # browser actually arrives on. The host-side entries remain for a portal run
    # from docker-compose during development.
    redirectURIs:
      - http://10.90.0.11:32001/api/auth/oidc/handler/frame
      - http://localhost:3001/api/auth/oidc/handler/frame
      - http://agentic-agittings-agittings-dev-vm-02:3001/api/auth/oidc/handler/frame

enablePasswordDB: true

staticPasswords:
  - email: "alice@nfd41.lab"
    # bcrypt of `password`
    hash: "$2b$10$y.wx0G.lDog.dUNSZdlHXOIwCL8v5lwuaOU1uAfNHg0efN.UDCGS."
    username: "alice"
    userID: "08a8684b-db88-4b73-90a9-3cd1661f5466"
  - email: "bob@nfd41.lab"
    # bcrypt of `password`
    hash: "$2b$10$jyHxbw9vn10DCGRQzSuv9.25TTR45vbGwKyGlFOepWPDuLt6MHwim"
    username: "bob"
    userID: "1cb4a5b1-1e3f-4e4c-9b0f-1a2b3c4d5e6f"
