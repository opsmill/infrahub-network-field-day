---
# Helm values for nfd41-demo, the whoami workload on the fabric.
#
# Replaces nfd41-demo-manifests.yaml, which described the same workload as six
# raw API objects. Cycle 033 made a chart the only way to express an
# application, and `cowboysysop/whoami` 6.0.0 ships appVersion 1.11.0 --
# `traefik/whoami:v1.11.0`, the image those manifests already ran.
#
# WHAT CHANGED BESIDES THE FORMAT: the old payload was two tiers, a frontend on
# a LoadBalancer and a backend on a ClusterIP, plus two L7 CiliumNetworkPolicies
# demonstrating an HTTP-method rule between them. One FabricApp renders exactly
# one Helm Release, so the backend tier and those two policies are gone. That
# was a decision rather than an oversight -- see specs/033-fabricapp-helm-chart
# research R5 -- and it costs the "ClusterIP backend is unreachable from the app
# tenant" demonstration along with the L7 example.

# Three replicas so pod-to-pod traffic actually crosses the fabric rather than
# staying local to one node, which is the whole point of putting it here.
replicaCount: 3

service:
  # The XRD's expose.serviceSelector decides which Services get a VIP and get
  # advertised; a Service is never exposed to the fabric merely by being of this
  # type. Both halves are needed -- this, and the label below.
  type: LoadBalancer
  ports:
    # 80, and this number is load bearing in two places at once. It is the port
    # the VIP answers on, and it is `junos-http`, the SecurityService this
    # application names in `advertised_services` and therefore the port every
    # generated firewall rule permits. The old manifests mapped port 80 to
    # targetPort 8080; the chart serves 80 directly.
    http: 80

# THE LABEL THAT GETS IT ADVERTISED. It must match the application's
# `service_selector` (nfd41.lab/advertise=true) or the Service is created, gets
# no VIP, and the application is simply unreachable off-cluster with nothing
# reporting a fault.
#
# `commonLabels` feeds the chart's `whoami.labels` helper, which lands on each
# object's metadata.labels. The Service's spec.selector uses the narrower
# `whoami.selectorLabels` helper instead, so this does not touch the immutable
# selector and an upgrade does not fail.
commonLabels:
  nfd41.lab/advertise: "true"

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 64Mi
