# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

nodes:
  # A customer or branch premises. Needed because DcimCircuitEndpoint.location is
  # mandatory and peers LocationHosting, and a circuit terminating at a customer
  # site has nowhere else to point.
  #
  # infrahub/location_site was evaluated first and is not adoptable here: its
  # LocationSite inherits IpamPrefixScope and IpamVLANGroupScope, which this
  # repository's diverged base IPAM does not provide. Adopting it therefore means
  # re-adopting base IPAM, which is a change to existing working schema and out of
  # scope. Kept deliberately minimal so a later swap to the published kind is
  # small.
  - name: Site
    namespace: Location
    description: "A customer or branch premises outside the datacentre"
    label: Site
    icon: mdi:office-building-marker
    include_in_menu: true
    inherit_from:
      - LocationGeneric
      - LocationHosting
    parent: null
    children: null
    relationships:
      # WHERE A PERSON AT THIS SITE APPEARS FROM, on the firewall.
      #
      # A service request records who asked, and a requester knows where they
      # sit far better than they know which security zone that is. These two
      # turn "someone at branch-office wants access" into the zone and the
      # address-book entry a rule is actually written from, so
      # `ServiceAppAccess` can ask for a SITE and derive the rest -- the same
      # way it derives ports and the destination from the application.
      #
      # Optional, and most sites carry neither: `internet-edge` and
      # `provider-edge` are infrastructure with nobody sitting at them, and a
      # site with no mapping simply cannot be used to derive a source.
      - name: security_zone
        peer: SecurityZone
        label: Security Zone
        kind: Attribute
        cardinality: one
        optional: true
        on_delete: no-action
        identifier: location__site_security_zone
        order_weight: 1500
      - name: security_source_address
        peer: SecurityGenericAddress
        label: Security Source Address
        kind: Attribute
        cardinality: one
        optional: true
        # An address-book ENTRY, never a synthesised CIDR, so a derived rule
        # references the same vocabulary the hand-written rules beside it use.
        on_delete: no-action
        identifier: location__site_security_source_address
        order_weight: 1510

  - name: Hall
    namespace: Location
    branch: agnostic
    inherit_from:
      - LocationGeneric
    human_friendly_id:
      - name__value
    children: LocationRack
    parent: ""
    include_in_menu: false
    attributes:
      - name: index
        kind: Number
        branch: agnostic

  - name: Rack
    namespace: Location
    branch: agnostic
    inherit_from:
      - LocationGeneric
      - LocationHosting
      - GeneratorTarget
    parent: LocationHall
    children: ""
    human_friendly_id:
      - name__value
    uniqueness_constraints: [["pod", "index__value"]]
    include_in_menu: false
    attributes:
      - name: index
        kind: Number
        branch: agnostic
      - name: rack_type
        kind: Dropdown
        branch: aware
        choices:
          - name: compute
            label: Compute
          - name: storage
            label: Storage
        default_value: compute
      - name: mlag
        kind: Boolean
        branch: aware
        label: MLAG
        default_value: true
        optional: false
      - name: generation_complete
        kind: Boolean
        optional: true
        default_value: false
      - name: device_name_template
        label: Device Name Template
        kind: Text
        branch: aware
        optional: true
        # `{pod}`, `{rack}`, `{rack_index}` and `{index}` are available -- for
        # example `k8s-leaf{index}`. Leave unset to keep the default
        # `leaf-{pod}-{rack_index}-{index}`. Set this when the fabric's hostnames
        # are already fixed by a deployed lab or a naming standard.
        #
        # Applies to the rack's leaf tier only; any `l2leaf` devices in the same
        # rack keep their default names, so the two tiers cannot collide.
        description: "Format template for the hostnames the rack generator creates"
    relationships:
      - name: pod
        peer: NetworkPod
        branch: aware
        kind: Attribute
        cardinality: one
        optional: false
        identifier: "rack__pod"
      - name: devices
        peer: DcimPhysicalDevice
        branch: aware
        kind: Generic
        cardinality: many
        identifier: "rack__device"
      - name: avd_tags
        label: AVD Tags
        peer: AvdTag
        branch: aware
        kind: Attribute
        cardinality: many
        optional: true
        identifier: "rack__avd_tags"
      - name: always_include_vrfs_in_tenants
        label: Always Include VRFs In Tenants
        peer: EvpnTenant
        branch: aware
        kind: Attribute
        cardinality: many
        optional: true
        identifier: "rack__always_include_vrfs_in_tenants"
        # This is what a border leaf needs: it terminates a tenant's VRF for a
        # firewall or WAN handoff but owns none of that tenant's access VLANs, so
        # tag matching alone would leave the VRF off the device -- and the
        # handoff interface with no VRF to sit in.
        description: "Tenants whose VRFs are created on this rack regardless of AVD tags"
