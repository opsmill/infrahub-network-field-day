# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

extensions:
  nodes:
    - kind: IpamPrefix
      attributes:
        - name: status
          kind: Dropdown
          optional: true
          choices:
            - name: active
              label: Active
            - name: deprecated
              label: Deprecated
            - name: reserved
              label: Reserved
        # Authoritative role list for IpamPrefix. This intentionally lives only
        # here (not on the base Ipam.Prefix node) so there is a single source of
        # truth; it is the union of the generic and fabric-specific roles used
        # across the seed data and the generators.
        - name: role
          kind: Dropdown
          optional: false
          choices:
            - name: supernet
              label: Supernet
            - name: pod_super_spine_spine
              label: Pod Super Spine Spine
            - name: pod_leaf_spine
              label: Pod Leaf Spine
            - name: loopback
              label: Loopback
            - name: loopback-vtep
              label: Loopback VTEP
            - name: fabric_point_to_point
              label: Fabric Point-to-Point
            - name: dci
              label: DCI
            - name: fabric_supernet
              label: Fabric Supernet
            - name: mlag
              label: MLAG
            - name: mlag_peering
              label: MLAG Peering
            - name: technical
              label: Technical
            - name: management
              label: Management
            - name: backfill
              label: Backfill (from structured config)
            # Lab roles outside the fabric. Every network the Kubernetes,
            # Security and Wan layers reference is an IpamPrefix rather than a
            # restated CIDR, because the lab has three independent enforcement
            # points -- the leaves' RM-CILIUM-IN route policy, the vSRX zone
            # policies and the Cilium network policies -- matching on the same
            # networks. Making them one object is what turns "these should
            # agree" into a graph fact.
            - name: pod
              label: Pod CIDR
            - name: service
              label: Service CIDR
            - name: vip_pool
              label: LoadBalancer VIP Pool
            - name: wan_customer
              label: WAN Customer LAN
            - name: branch_lan
              label: Branch LAN
            - name: tenant_cloud
              label: Tenant Cloud Subnet
            - name: tenant_host
              label: Tenant Host Subnet
            - name: off_fabric_point_to_point
              label: Off-Fabric Point-to-Point
            - name: internet
              label: Internet
