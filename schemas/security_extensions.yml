# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

# ============================================================================
# Three additions to the marketplace security schema (infrahub/security).
#
# Everything else this repository needs from a firewall model is already there
# and is used unmodified: zones, the polymorphic address book
# (SecurityGenericAddress with IPAM-backed, literal, range and FQDN variants),
# service and service-group objects, zone-pair policy rules with an evaluation
# index, SecurityFirewall as a device kind, and SecurityFirewallInterface as
# the zone-bound interface kind.
#
# Because SecurityFirewall inherits DcimGenericDevice and DcimPhysicalDevice,
# the perimeter firewall is its own device kind and needs no `firewall` value
# in the DcimDevice role dropdown -- which is why that role is absent from
# dcim_extensions.yml.
#
# NOTE ON THE ADDRESS BOOK. The marketplace offers both literal address kinds
# (SecurityPrefix, SecurityIPAddress, which carry IPNetwork/IPHost attributes)
# and IPAM-backed ones (SecurityIPAMIPPrefix, SecurityIPAMIPAddress, which
# reference IpamPrefix/IpamIPAddress). This project uses the IPAM-backed
# variants for anything a route policy or a network policy also matches on, so
# the several enforcement points reference one object rather than one object
# and two copies of its CIDR.
#
# The three fields below are genuinely absent upstream. Each is added here
# rather than by editing the adopted file, so a later `marketplace get` diffs
# cleanly against schemas/security/security.yml.
# ============================================================================

extensions:
  nodes:
    - kind: SecurityZone
      attributes:
        - name: trust_level
          kind: Number
          label: Trust Level
          optional: true
          description: "0 is untrusted, 100 is fully trusted; orders zones by trust"
          order_weight: 1200
          parameters:
            min_value: 0
            max_value: 100
        # The fabric side of a zone, half one. A ServiceAppAccess grant names
        # all three domains of this lab -- the application (Kubernetes), the
        # source zone (Junos) and the destination VIP (the fabric) -- and only
        # the first two act. The grant cannot make its VIP routable because
        # nothing connects a zone to the policy governing advertisement toward
        # it.
        #
        # A NAME, NOT A RELATIONSHIP, and that is forced rather than lazy.
        # There are zero RoutingPrefixList objects in this graph: every prefix
        # list lives inside NetworkFabric.avd_custom_hostvars as
        # `custom_structured_configuration_prefix_lists`, which is AVD's
        # documented channel for inputs this model does not model. A
        # relationship needs a peer to point at and there is none.
        #
        # The `dc_` prefix carries the direction, because both directions exist
        # here as separate objects and the short name reads as the wrong one:
        #   PL-DC-ADVERTISED-BRANCH   what we tell the branch     <- this
        #   PL-BRANCH-PERMITTED       what we accept from it
        - name: dc_advertised_prefix_list
          kind: Text
          label: DC Advertised Prefix List
          optional: true
          # Kept under 128 characters, which the schema enforces on any
          # description; the reasoning above carries what will not fit.
          description: >-
            What the DC advertises TOWARD this zone. A soft reference into AVD
            hostvars; nothing enforces that it resolves.
          order_weight: 1300
      relationships:
        - name: vrf
          peer: IpamVRF
          label: Fabric VRF
          kind: Attribute
          cardinality: one
          optional: true
          # The fabric side of this zone's handoff. Every tenant VRF in this
          # fabric has exactly one route out -- a default pointing at its own
          # zone -- so the pairing between a VRF and a zone is the thing that
          # makes the firewall unavoidable rather than decorative. Without this
          # relationship that pairing lives only in a route-map comment.
          description: "The fabric VRF on the other side of this zone's handoff"
          identifier: security_zone__vrf
          order_weight: 930
        # The fabric side of a zone, half two: which switch APPLIES the prefix
        # list above to a BGP neighbor.
        #
        # "Applies", not "renders". custom_structured_configuration_prefix_lists
        # sits at FABRIC scope, so all seven switches render
        # PL-DC-ADVERTISED-BRANCH and exactly one references it on a neighbor.
        # The seven-device answer is derivable and useless; the one-device
        # answer is where a device-scope override actually takes effect.
        #
        # MODELLED RATHER THAN DERIVED, because both derivations fail here:
        #   * by role -- no device in this fabric carries `border_leaf`; all
        #     five leaves are plain `leaf`, and the lab's border-leaf1 is
        #     identified only by its management address.
        #   * through the zone's VRF -- IpamVRF relates to IpamPrefix and
        #     IpamIPAddress and to nothing under Dcim.
        #
        # PEER IS DcimFabricSwitch AND THAT IS LOAD BEARING. `DcimDevice` is
        # this repository's WAN routers: it would validate, load, and
        # resolve to nothing. `DcimGenericDevice` would resolve but admits the
        # firewall and the compute nodes, neither of which carries
        # avd_custom_hostvars.
        #
        # No on_delete. Its only value, `cascade`, deletes the PEER -- so on
        # this relationship it would mean deleting a switch deletes a security
        # zone. `infrahubctl schema check` accepts the line without complaint.
        - name: advertising_device
          peer: DcimFabricSwitch
          label: Advertising Device
          kind: Attribute
          cardinality: one
          optional: true
          description: "The fabric switch that applies this zone's advertisement policy"
          identifier: security_zone__advertising_device
          order_weight: 940

    # The address book's ORDER, which Junos writes deliberately and Infrahub
    # does not otherwise store.
    #
    # `junos.conf` lists the infrastructure addresses first and the per-tenant
    # ones after, and that order is not derivable: it is neither alphabetical
    # nor by network address nor by prefix length. Without this the rendered
    # book is semantically identical and textually different -- Junos does not
    # care, because address-book entries are name-keyed definitions, but a
    # reviewer diffing the artifact against the device does.
    #
    # Added on the generic rather than on each of the six concrete address
    # kinds, so one attribute covers the whole polymorphic book.
    #
    # Contrast SecurityPolicyRule.index, which upstream already provides:
    # policy order inside a zone pair is first-match and therefore semantic,
    # so the marketplace models it. This one is presentational, which is
    # probably why it does not.
    # The other end of SecurityZone.advertising_device, declared so "what does
    # this leaf advertise, and to whom" is answerable from the switch rather
    # than only from the zone.
    #
    # The identifier MUST match the zone side exactly. Two different
    # identifiers do not fail: they create two independent one-way
    # relationships that each look correct in the UI and never connect.
    #
    # This is a Dcim kind being extended from the security file, which is the
    # opposite direction from everything else here. It stays here rather than
    # in dcim_extensions.yml so both halves of one relationship are declared
    # side by side -- splitting them is how identifiers drift.
    - kind: DcimFabricSwitch
      relationships:
        - name: advertised_zones
          peer: SecurityZone
          label: Advertised Zones
          kind: Generic
          cardinality: many
          optional: true
          description: "Zones whose advertisement policy this switch applies"
          identifier: security_zone__advertising_device
          order_weight: 3200

    - kind: SecurityGenericAddress
      attributes:
        - name: book_index
          kind: Number
          label: Address-Book Index
          optional: true
          description: "Position in the rendered address book; Junos' order is authoring order"

    - kind: SecurityFirewall
      attributes:
        # The TCP-MSS clamp, and the one number that keeps a full-size packet
        # forwardable across this firewall.
        #
        # The interfaces stanza runs MTU 9192 -- the vSRX maximum, and 36 bytes
        # short of the fabric's 9214. Two hosts that both believe the path is
        # 9214 would negotiate an MSS of 9174, build a 9214-byte packet, and
        # the firewall would silently fail to forward it. The clamp makes the
        # shortfall safe rather than a stall with data stuck in Send-Q -- and
        # it must be sized for the tightest hop BEHIND the firewall, not for
        # the firewall: traffic into a tenant VRF crosses the EVPN fabric as
        # VXLAN, so the lab's value is 9214 - 50 - 20 - 20 = 9124. The first
        # value, 9192 - 14 - 20 - 20 = 9138, let every full-size segment die
        # inside the fabric unreported (cycle 034, measured).
        #
        # OPTIONAL WITH NO DEFAULT, deliberately. A firewall without a clamp
        # must render no `flow` stanza at all; a default would emit `mss 0` or
        # an empty block on every future firewall that does not need one.
        - name: tcp_mss
          kind: Number
          label: TCP MSS Clamp
          optional: true
          description: "Clamps TCP MSS in security flow; unset renders no flow stanza"
        # Cycle 034: SNMP, the one telemetry path this firewall can be given
        # through the model. gNMI/JTI is configured under `system services
        # extension-service`; `system` has been rendered since cycle 035, as
        # fixed template content, so modelling JTI is now possible and has not
        # been done.
        #
        # ONE OF TWO CREDENTIALS IN THE ARTIFACT, and recorded as such -- the
        # other is the lab's pair of login hashes, which are template content
        # rather than data (see AGENTS.md). A v2c
        # community has to reach the device in its configuration, so it is in
        # the rendered Junos artifact whatever the model does; SNMPv3 would put
        # its keys there too. It is read-only and restricted to `snmp_clients`.
        #
        # OPTIONAL WITH NO DEFAULT, like tcp_mss: unset renders no `snmp`
        # stanza at all, which is what keeps the artifact byte-identical to the
        # device file until the stanza is added to both.
        - name: snmp_community
          kind: Text
          label: SNMP Community
          optional: true
          description: "Read-only SNMPv2c community; unset renders no snmp stanza"
          order_weight: 1700
      relationships:
        # Same name and reason as DcimDevice.telemetry_address: an address a
        # collector in a pod can reach, and never one a configuration is pushed
        # to. The reconciler still arrives by container name.
        - name: telemetry_address
          label: Telemetry Address
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          description: "The address telemetry collectors reach this firewall at; never used to push configuration"
          identifier: "security_firewall__telemetry_address"
          order_weight: 1670
        - name: snmp_clients
          label: SNMP Clients
          peer: IpamPrefix
          kind: Attribute
          cardinality: one
          optional: true
          description: "The source prefix permitted to poll this firewall over SNMP, inside mgmt_junos"
          identifier: "security_firewall__snmp_clients"
          order_weight: 1710

    - kind: SecurityPolicyRule
      attributes:
        # WHICH log events, not merely whether to log.
        #
        # Upstream models `log` as a Boolean, and the device distinguishes two
        # behaviours: every rule here logs `session-init`, and the long-lived
        # permits also log `session-close`. The two ICMP permits do not --
        # closing a ping session is noise.
        #
        # It could be inferred ("permit, unless the application is junos-ping")
        # and that would reproduce the file today, but it encodes an unstated
        # policy in the renderer. Which events a firewall logs is behaviour,
        # not formatting, so it is data.
        - name: log_session_close
          kind: Boolean
          label: Log Session Close
          optional: false
          default_value: false
          description: "Whether the rule logs session-close as well as session-init"
        - name: managed_by_service
          kind: Boolean
          label: Managed by a Service
          optional: false
          default_value: false
          # The unmanaged-object guard, and the reason a reconciling generator
          # is safe to run against a hand-maintained firewall. A generator must
          # delete rules that no longer have a service behind them, but the
          # baseline -- the anti-spoofing deny repeated at the head of every
          # zone pair, the ICMP allowances -- has no service and must survive.
          # A generator reconciles only where this is true.
          #
          # Existing rules load as false, which is correct: everything on the
          # box today is hand-written.
          description: "True when a service generator owns this rule; hand-written rules stay false"
          order_weight: 2000

# ---------------------------------------------------------------------------
# Supplying the missing human-friendly id for SecurityPolicyRule.
#
# The adopted schema declares no `human_friendly_id` on this kind, which means
# `infrahubctl object load` has no key to upsert-match against: it always
# CREATEs, and a second run collides with the uniqueness constraint
# 'index-source_zone-destination_zone-policy'. That makes any object file
# containing rules non-re-runnable, which the project's idempotence rules do
# not allow.
#
# The natural key is the uniqueness constraint itself, and every element of it
# is reachable: SecurityZone.name and SecurityPolicy.name are both unique
# upstream.
# ---------------------------------------------------------------------------
#
# The same re-declaration supplies two presentational fields upstream leaves
# unset, which Infrahub merges onto the adopted node exactly as it merges the
# human_friendly_id above (the live schema keeps upstream's label, icon, menu
# placement and order_by alongside it):
#
#   display_label  Without one, every rule in a list, a relationship picker and
#                  a proposed-change diff reads `SecurityPolicyRule(ID: <uuid>)`.
#   description    Upstream's is "Policy rule", the label repeated.
#
# SecurityFirewall has no description upstream either, and is deliberately NOT
# given one this way. Re-declaring it needs a copy of upstream's
# `inherit_from` (omitted, the server refuses the node with "Node-level
# 'inherit_from' constraint violation"), and `infrahubctl protocols` reads the
# YAML without merging, so the re-declaration replaces the node: the generated
# SecurityFirewall protocol loses `role` and `policy`. An empty kind header is
# the cheaper defect. (SecurityPolicyRule's protocol is already empty for the
# same reason; nothing reads it through the protocols.)
# ---------------------------------------------------------------------------
nodes:
  - name: PolicyRule
    namespace: Security
    description: "One permit or deny between a source and destination zone, matched first-match by index"
    display_label: "{{ name__value }}"
    human_friendly_id:
      - policy__name__value
      - source_zone__name__value
      - destination_zone__name__value
      - index__value
