# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

# ============================================================================
# The two service kinds whose intent is delivered to the cluster as Crossplane
# manifests.
#
# Both inherit CoreArtifactTarget as well as GeneratorTarget, so a later cycle
# can register a transform and an artifact definition against them without
# touching this schema again. The delivery path follows
# opsmill/infrahub-dogfooding: a Python transform renders the object into a
# manifest stored as an Infrahub artifact, and an in-cluster operator pulls and
# reconciles it.
#
# SERVICE LAYER. These reference technical kinds (ClusterKubernetes and
# ClusterFabricPeering, both built on the marketplace's infrahub/cluster, plus
# IpamPrefix and IpamVRF); nothing in the technical layer references them.
# ============================================================================

nodes:
  - name: FabricPeering
    namespace: Service
    description: "A cluster's BGP contract with the EVPN fabric"
    label: Fabric Peering Service
    icon: mdi:handshake
    include_in_menu: true
    inherit_from:
      - ServiceGeneric
      - GeneratorTarget
      - CoreArtifactTarget
    # human_friendly_id, display_label, order_by and the name uniqueness
    # constraint are inherited from ServiceGeneric.
    attributes:
      # Selectors are Lists of "key=value" strings rather than JSON maps:
      # Infrahub 1.10.6 returns a 500 when a JSON attribute's object key
      # contains a dot or a slash, which every Kubernetes label selector does.
      - name: communities
        kind: List
        label: Communities
        optional: true
        description: "Communities tagged onto advertisements carried by this peering"
        order_weight: 1300
      - name: advertisement_selector
        kind: List
        label: Advertisement Selector
        optional: true
        # Must agree with the cluster's own selector. When they disagree the
        # advertisement is created and simply never attaches to a BGP session,
        # which looks like a routing problem rather than a label mismatch.
        description: "Label tying per-application advertisements to these sessions"
        order_weight: 1400
    relationships:
      - name: cluster
        peer: ClusterKubernetes
        label: Cluster
        kind: Attribute
        cardinality: one
        optional: false
        on_delete: no-action
        identifier: service__cluster_peering
        order_weight: 910
      - name: peerings
        peer: ClusterFabricPeering
        label: Realized Peerings
        kind: Generic
        cardinality: many
        optional: true
        on_delete: no-action
        description: "The BGP sessions that realize this service"
        identifier: service__fabric_peerings
        order_weight: 920

  - name: FabricApp
    namespace: Service
    description: "An application that is a participant in the fabric"
    label: Fabric Application
    icon: mdi:apps
    include_in_menu: true
    inherit_from:
      - ServiceGeneric
      - GeneratorTarget
      - CoreArtifactTarget
    # One object rather than five, because the parts are not separable. A
    # service with no pool never gets a VIP; a VIP with no advertisement is
    # unreachable off-cluster; an advertisement with no network policy exposes
    # the app to the whole tenant. Each of those is a working cluster and a
    # broken application, and each failure looks like a different problem.
    attributes:
      - name: namespace_name
        kind: Text
        label: Namespace
        optional: false
        # Not `namespace`: that is a schema-level key and an attribute of that
        # name would shadow it.
        description: "Kubernetes namespace to create and deploy into"
        order_weight: 1300
      - name: chart_repository
        kind: Text
        label: Chart Repository
        optional: true
        order_weight: 1400
      - name: chart_name
        kind: Text
        label: Chart Name
        optional: true
        order_weight: 1410
      - name: chart_version
        kind: Text
        label: Chart Version
        optional: true
        order_weight: 1420
      - name: chart_values
        kind: JSON
        label: Chart Values
        optional: true
        order_weight: 1430
      - name: manifests
        kind: JSON
        label: Raw Manifests
        optional: true
        # The escape hatch for anything a chart cannot express, and for
        # workloads that simply have no chart. "No chart" does not mean "not
        # managed". Shape is user-defined, hence JSON.
        description: "Raw API objects to create in the namespace"
        order_weight: 1440
      - name: exposed
        kind: Boolean
        label: Exposed to Fabric
        optional: false
        default_value: false
        # False means cluster-internal: no pool, no advertisement, no route off
        # the cluster. The lab's ClusterIP-only backend is this case, and its
        # unreachability from the app tenant is an asserted negative.
        description: "Whether this application gets a VIP advertised into the fabric"
        order_weight: 1500
      - name: service_selector
        kind: List
        label: Service Selector
        optional: true
        # A Service is never exposed to the fabric merely by being of type
        # LoadBalancer; it has to be selected.
        description: "Which Services in the namespace get a VIP and get advertised"
        order_weight: 1510
      - name: communities
        kind: List
        label: Communities
        optional: true
        order_weight: 1520
      - name: policy_default_deny
        kind: Boolean
        label: Policy - Default Deny
        optional: false
        default_value: true
        order_weight: 1600
      - name: policy_allow_dns
        kind: Boolean
        label: Policy - Allow DNS
        optional: false
        default_value: true
        order_weight: 1610
      - name: policy_allow_intra_namespace
        kind: Boolean
        label: Policy - Allow Intra-Namespace
        optional: false
        default_value: true
        # Default-deny denies egress as well as ingress, so without this a
        # chart's own components cannot reach one another and the application
        # fails in a way that reads as a broken chart.
        description: "Let pods in this namespace talk to each other"
        order_weight: 1620
      - name: policy_allow_egress_api_server
        kind: Boolean
        label: Policy - Allow Egress to API Server
        optional: false
        default_value: false
        description: "Needed by any chart carrying an operator, controller or webhook"
        order_weight: 1630
      - name: policy_allow_egress_internet
        kind: Boolean
        label: Policy - Allow Egress to Internet
        optional: false
        default_value: false
        order_weight: 1640
      - name: policy_allow_ports
        kind: JSON
        label: Policy - Allowed Ports
        optional: true
        description: "Ports the permitted sources may reach, as port/protocol pairs"
        order_weight: 1650
      - name: workload_selector
        kind: List
        label: Workload Selector
        optional: true
        description: "Endpoints the source rules apply to; empty means every pod"
        order_weight: 1660
      # -- the VIP block, which a requester should not have to choose --------
      #
      # An exposed application needs one and `crossplane_fabric_app.py` RAISES
      # without it -- "is exposed but has no vip_block; the XRD requires
      # expose.vipBlock" -- so today every exposed application has to have a
      # block picked by hand out of the cluster's VIP pool, with nothing
      # preventing two of them from picking the same one.
      #
      # `generate-fabric-app` allocates instead. Stating a SIZE is the request;
      # naming a block is not.
      - name: vip_block_size
        kind: Number
        label: VIP Block Size
        optional: false
        default_value: 28
        description: "Prefix length to allocate for the VIP block when none is named"
        order_weight: 935
        parameters:
          # A /24 would swallow the cluster's whole VIP pool in one application,
          # and anything longer than /30 has no usable addresses left once the
          # network and broadcast are gone.
          min_value: 24
          max_value: 30
      # WHO OWNS THE BLOCK, and the reason withdrawal is safe.
      #
      # `vip_block` is one field holding two very different things: a block a
      # human wrote into `objects/` -- 10.112.240.0/28 for nfd41-demo -- and a
      # block this generator took from the pool. Deleting the first on
      # decommissioning would remove an object the seed data declares.
      #
      # So the generator sets this when, and only when, it allocated the block
      # itself, and withdraws only what it set. Exactly the role
      # `managed_by_service` plays on `SecurityPolicyRule` for the firewall:
      # the guard that makes a generator safe next to hand-maintained data.
      #
      # Never set by hand. Setting it true on a hand-written block tells the
      # generator that block is its to delete.
      - name: vip_block_managed
        kind: Boolean
        label: VIP Block Allocated By Service
        optional: false
        default_value: false
        description: "True when the generator allocated the VIP block, and may withdraw it"
        order_weight: 936
    relationships:
      - name: cluster
        peer: ClusterKubernetes
        label: Cluster
        kind: Attribute
        cardinality: one
        optional: false
        on_delete: no-action
        identifier: service__cluster_apps
        order_weight: 910
      - name: vrf
        peer: IpamVRF
        label: Fabric Tenant VRF
        kind: Attribute
        cardinality: one
        optional: true
        on_delete: no-action
        identifier: service__app_vrf
        order_weight: 920
      - name: vip_block
        peer: IpamPrefix
        label: VIP Block
        kind: Attribute
        cardinality: one
        optional: true
        # Optional so an unexposed application is valid. When exposed, the
        # block has to sit inside the cluster's service prefix or the leaves'
        # inbound route policy refuses the advertisement -- which is the
        # intended behaviour, not a bug to work around. That containment is a
        # graph query, so it belongs to a check rather than a constraint.
        on_delete: no-action
        identifier: service__app_vip_block
        order_weight: 930
      - name: allowed_source_prefixes
        peer: IpamPrefix
        label: Allowed Source Prefixes
        kind: Generic
        cardinality: many
        optional: true
        # The third of three independent gates, and the only one owned by the
        # application rather than the network: the route has to exist, the
        # firewall zone policy has to permit the session, and then this has to
        # name the source. These are relationships rather than CIDR text
        # precisely so all three gates reference the same objects.
        on_delete: no-action
        description: "Networks outside the cluster permitted to reach this application"
        identifier: service__app_allowed_sources
        order_weight: 940
      - name: peering_service
        peer: ServiceFabricPeering
        label: Peering Service
        kind: Attribute
        cardinality: one
        optional: true
        on_delete: no-action
        description: "Which peering carries this application's advertisement"
        identifier: service__app_peering
        order_weight: 950
      - name: values_file
        peer: ServiceFabricAppValuesFile
        label: Chart Values File
        kind: Component
        cardinality: one
        optional: true
        description: "Helm values as an attached file; takes precedence over chart_values"
        identifier: fabricapp__values_file
        order_weight: 960
      - name: manifests_file
        peer: ServiceFabricAppManifestsFile
        label: Manifests File
        kind: Component
        cardinality: one
        optional: true
        description: "Raw manifests as an attached file; takes precedence over manifests"
        identifier: fabricapp__manifests_file
        order_weight: 970

  # ---------------------------------------------------------------------------
  # Application payload attachments
  #
  # Helm values and raw Kubernetes manifests are stored as files rather than as
  # JSON attributes, for three reasons found by inspection:
  #
  #   1. They cannot be seeded as attributes. `infrahubctl object load` returns
  #      HTTP 500 for a JSON key containing a dot or a slash, and every real
  #      Kubernetes payload has them -- app.kubernetes.io/name, grafana.ini,
  #      node-role.kubernetes.io/control-plane. The GraphQL path handles the same
  #      payload correctly, so the defect is in the object-load path.
  #   2. They are large and opaque. One chart's values run to ~150 lines of
  #      nested Helm configuration, none of which is network intent.
  #   3. They are human-authored and reviewed, and a file gives a real diff.
  #
  # Two kinds rather than one kind with a role, following AvdHostvarFile and
  # AvdStructuredConfigFile: the role is carried by the kind, "one per
  # application" falls out of cardinality one, and a consumer writes
  # `app.values_file` instead of filtering a collection.
  # ---------------------------------------------------------------------------
  - name: FabricAppValuesFile
    namespace: Service
    # Precedence: this file wins over the inline chart_values attribute, which
    # is read only when no file is attached. The description below is capped at
    # 128 characters by Infrahub, so the rule is stated tersely there and in
    # full here.
    description: "Helm values as an attached file. Takes precedence over the inline chart_values attribute"
    label: Application Chart Values File
    icon: mdi:file-code-outline
    include_in_menu: false
    inherit_from:
      - CoreFileObject
    human_friendly_id:
      - app__name__value
    uniqueness_constraints:
      - ["app"]
    relationships:
      - name: app
        peer: ServiceFabricApp
        label: Application
        kind: Parent
        cardinality: one
        optional: false
        identifier: fabricapp__values_file
        order_weight: 900

  - name: FabricAppManifestsFile
    namespace: Service
    # Precedence: this file wins over the inline manifests attribute, which is
    # read only when no file is attached.
    description: "Raw manifests as an attached file. Takes precedence over the inline manifests attribute"
    label: Application Manifests File
    icon: mdi:file-document-multiple-outline
    include_in_menu: false
    inherit_from:
      - CoreFileObject
    human_friendly_id:
      - app__name__value
    uniqueness_constraints:
      - ["app"]
    relationships:
      - name: app
        peer: ServiceFabricApp
        label: Application
        kind: Parent
        cardinality: one
        optional: false
        identifier: fabricapp__manifests_file
        order_weight: 900
