# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

# ============================================================================
# The services sitting on top of the provider edge.
#
# Two kinds: the tenant's L3VPN across the provider edge, and its cloud in the
# datacentre.
#
# Unlike the Kubernetes services, none of these is a CoreArtifactTarget: they
# render through device-scoped artifacts (SR Linux on the PE and CE, EOS on the
# fabric), not through a cluster manifest.
#
# SERVICE LAYER.
# ============================================================================

nodes:
  - name: L3vpn
    namespace: Service
    description: "A tenant's VPN across the provider edge"
    label: Tenant L3VPN
    icon: mdi:lan-connect
    include_in_menu: false
    inherit_from:
      - ServiceGeneric
      - GeneratorTarget
    relationships:
      - name: tenant
        peer: OrganizationTenant
        label: Tenant
        kind: Attribute
        cardinality: one
        optional: false
        on_delete: no-action
        identifier: service__l3vpn_tenant
        order_weight: 910
      - name: vrf
        peer: IpamVRF
        label: Provider Edge VRF
        kind: Attribute
        cardinality: one
        optional: true
        on_delete: no-action
        identifier: service__l3vpn_vrf
        order_weight: 920
      - name: circuits
        peer: DcimCircuit
        label: Member Circuits
        kind: Generic
        cardinality: many
        optional: true
        on_delete: no-action
        # The attachment circuits of this tenant's sites. Two sites of one
        # tenant reach each other because they are both in here, not because
        # anything was leaked between them -- which is why there is no
        # site-to-site relationship anywhere in this model.
        description: "The attachment circuits of this tenant's member sites"
        identifier: service__l3vpn_circuits
        order_weight: 930
      - name: dc_service_prefixes
        peer: IpamPrefix
        label: DC Service Prefixes
        kind: Generic
        cardinality: many
        optional: true
        on_delete: no-action
        # The shared half of the import policy: what every tenant may reach in
        # the datacentre regardless of what it buys. Every tenant's prefixes
        # sit in the provider's default table -- they have to, or the DC could
        # not route back -- so if this were "import everything" the tenants
        # would reach each other directly across the provider.
        description: "The datacentre's published service range, common to every tenant"
        identifier: service__l3vpn_dc_prefixes
        order_weight: 940

  - name: TenantCloud
    namespace: Service
    description: "A tenant's isolated compute in the datacentre"
    label: Tenant Cloud
    icon: mdi:cloud-lock
    include_in_menu: false
    inherit_from:
      - ServiceGeneric
      - GeneratorTarget
    relationships:
      # The bridge between the provider edge and the fabric. All three of vrf,
      # zone and prefix are mandatory: a tenant cloud with no zone is
      # unreachable, and one with no VRF is not isolated. The lab's isolation
      # is structural -- no VRF imports another's route targets anywhere in the
      # fabric, so there is no east-west path to filter in the first place --
      # and it takes all three to be so. There is deliberately no
      # cloud-to-cloud relationship: the absence of a path is the feature.
      - name: tenant
        peer: OrganizationTenant
        label: Tenant
        kind: Attribute
        cardinality: one
        optional: false
        on_delete: no-action
        identifier: service__cloud_tenant
        order_weight: 910
      - name: vrf
        peer: IpamVRF
        label: Fabric VRF
        kind: Attribute
        cardinality: one
        optional: false
        on_delete: no-action
        identifier: service__cloud_vrf
        order_weight: 920
      - name: zone
        peer: SecurityZone
        label: Firewall Zone
        kind: Attribute
        cardinality: one
        optional: false
        on_delete: no-action
        # The only way into a tenant cloud is out of the border leaf, through
        # this zone's policy, and back. The firewall matches on source, which
        # is how acme's sites reach acme's cloud and globex's packets simply do
        # not match.
        identifier: service__cloud_zone
        order_weight: 930
      - name: prefix
        peer: IpamPrefix
        label: Subnet
        kind: Attribute
        cardinality: one
        optional: false
        on_delete: no-action
        identifier: service__cloud_prefix
        order_weight: 940
      - name: vlan
        peer: IpamVLAN
        label: VLAN
        kind: Attribute
        cardinality: one
        optional: true
        on_delete: no-action
        identifier: service__cloud_vlan
        order_weight: 950
