---
# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
version: "1.0"

nodes:
  - name: Tenant
    namespace: Evpn
    description: "EVPN network services tenant with VNI base mapping"
    label: EVPN Tenant
    icon: mdi:account-group
    include_in_menu: false
    human_friendly_id:
      - name__value
    order_by:
      - name__value
    display_label: name__value
    uniqueness_constraints:
      - [name__value]
    attributes:
      - name: name
        kind: Text
        unique: true
        order_weight: 1000
      - name: mac_vrf_vni_base
        label: MAC VRF VNI Base
        kind: Number
        optional: true
        description: "Base VNI for MAC VRFs (VLAN VNI = base + VLAN ID). Leave unset for an overlay-free (pure L2 / L2LS) tenant."
        order_weight: 1100
      - name: description
        kind: Text
        optional: true
        order_weight: 1200
    relationships:
      - name: fabrics
        label: "Fabrics"
        peer: NetworkFabric
        cardinality: many
        kind: Attribute
        optional: true
        description: "Fabrics this tenant is deployed on"
        order_weight: 900
      - name: vrfs
        label: "VRFs"
        peer: IpamVRF
        cardinality: many
        kind: Generic
        identifier: "tenant__vrfs"
        order_weight: 1300
      - name: l2vlans
        label: "L2 VLANs"
        peer: EvpnL2Vlan
        cardinality: many
        kind: Component
        identifier: "tenant__l2vlans"
        order_weight: 1400
      - name: tags
        peer: BuiltinTag
        optional: true
        cardinality: many
        kind: Attribute
        order_weight: 3000

  - name: Svi
    namespace: Evpn
    description: "SVI (Switched Virtual Interface) within a VRF for EVPN anycast gateway"
    label: EVPN SVI
    icon: mdi:ip-network
    include_in_menu: false
    human_friendly_id:
      - vrf__name__value
      - name__value
    order_by:
      - vrf__name__value
      - svi_id__value
    display_label: name__value
    uniqueness_constraints:
      - [vrf, svi_id__value]
    attributes:
      - name: name
        kind: Text
        description: "Name of the SVI"
        order_weight: 1000
      - name: svi_id
        label: SVI ID
        kind: Number
        description: "VLAN/SVI ID number"
        order_weight: 1050
      - name: ip_address_virtual
        label: Virtual IP Address
        kind: IPHost
        optional: true
        description: "Anycast gateway virtual IP address (e.g. 10.10.10.1/24)"
        order_weight: 1100
      - name: ip_virtual_router_addresses
        label: Virtual Router Addresses
        kind: List
        optional: true
        # Use these instead of `ip_address_virtual` when each leaf also needs
        # a unique address of its own on the SVI: a BGP-speaking workload has to
        # have an unambiguous neighbour address per leaf, which a shared anycast
        # address cannot give it. Pair with per-node addresses in `nodes`.
        description: "VARP gateway addresses; pair with per-node addresses in `nodes`"
        order_weight: 1150
      - name: enabled
        kind: Boolean
        default_value: true
        description: "Whether this SVI is enabled"
        order_weight: 1200
      - name: description
        kind: Text
        optional: true
        order_weight: 1300
    relationships:
      - name: vrf
        label: "VRF"
        peer: IpamVRF
        cardinality: one
        kind: Parent
        optional: false
        identifier: "vrf__svis"
        description: "VRF this SVI belongs to"
        order_weight: 900
      - name: vlan
        label: "VLAN"
        peer: IpamVLAN
        cardinality: one
        kind: Attribute
        optional: true
        description: "VLAN this SVI maps to"
        order_weight: 950
      - name: rack_tags
        label: "Rack Tags"
        peer: LocationRack
        cardinality: many
        kind: Attribute
        optional: true
        description: "Rack names emitted as AVD SVI tags"
        order_weight: 960
      - name: avd_tags
        label: "AVD Tags"
        peer: AvdTag
        cardinality: many
        kind: Attribute
        optional: true
        description: "AVD tag names emitted as AVD SVI tags"
        order_weight: 970
      - name: nodes
        label: "Per-node Addresses"
        peer: EvpnSviNode
        cardinality: many
        kind: Component
        optional: true
        identifier: "svi__nodes"
        description: "Per-device addresses on this SVI, for VARP designs"
        order_weight: 1400

  - name: SviNode
    namespace: Evpn
    description: "One device's own address on an SVI, alongside the shared VARP gateway"
    label: EVPN SVI Node Address
    icon: mdi:ip-outline
    include_in_menu: false
    # Keyed on the device rather than the SVI: `EvpnSvi.name` is only unique
    # within its VRF, so an HFID through it is not a stable identifier. A device
    # does not carry the same address twice, so device + address is.
    human_friendly_id:
      - device__name__value
      - ip_address__value
    order_by:
      - svi__name__value
      - device__name__value
    # display_label only accepts attributes, so it shows the address rather than
    # the device; the human-friendly ID still identifies it by SVI and device.
    display_label: ip_address__value
    uniqueness_constraints:
      - [svi, device]
    attributes:
      - name: ip_address
        label: IP Address
        kind: IPHost
        optional: false
        description: "This device's unique address on the SVI, e.g. 10.110.0.2/24"
        order_weight: 1100
    relationships:
      - name: svi
        label: SVI
        peer: EvpnSvi
        cardinality: one
        kind: Parent
        optional: false
        identifier: "svi__nodes"
        order_weight: 900
      # An SVI lives on a fabric leaf. 8 objects, all leaves.
      #
      # This relationship has NO forward side on the device kind -- the device
      # end exists only here -- so it is invisible to anyone working from cycle
      # 027's list of moved fields. Three of its neighbours in
      # schemas/routing/vrf_services.yml are the same shape.
      - name: device
        label: Device
        peer: DcimFabricSwitch
        cardinality: one
        kind: Attribute
        optional: false
        identifier: "device__svi_addresses"
        order_weight: 1000

  - name: L2Vlan
    namespace: Evpn
    description: "Pure L2 VLAN within a tenant (no IP gateway), for EVPN with VNI mapping"
    label: EVPN L2 VLAN
    icon: mdi:lan-pending
    include_in_menu: false
    human_friendly_id:
      - tenant__name__value
      - name__value
    order_by:
      - tenant__name__value
      - vlan_id__value
    display_label: name__value
    uniqueness_constraints:
      - [tenant, vlan_id__value]
    attributes:
      - name: name
        kind: Text
        description: "Name of the L2 VLAN"
        order_weight: 1000
      - name: vlan_id
        label: VLAN ID
        kind: Number
        description: "VLAN ID number"
        order_weight: 1050
      - name: vni_override
        label: VNI Override
        kind: Number
        optional: true
        description: "Override the auto-calculated VNI (default: mac_vrf_vni_base + vlan_id)"
        order_weight: 1100
      - name: description
        kind: Text
        optional: true
        order_weight: 1200
    relationships:
      - name: tenant
        label: "Tenant"
        peer: EvpnTenant
        cardinality: one
        kind: Parent
        optional: false
        identifier: "tenant__l2vlans"
        description: "Tenant this L2 VLAN belongs to"
        order_weight: 900
      - name: vlan
        label: "VLAN"
        peer: IpamVLAN
        cardinality: one
        kind: Attribute
        optional: true
        description: "Underlying VLAN object"
        order_weight: 950
      - name: rack_tags
        label: "Rack Tags"
        peer: LocationRack
        cardinality: many
        kind: Attribute
        optional: true
        description: "Rack names emitted as AVD L2 VLAN tags (scopes the VLAN to those leaf pairs)"
        order_weight: 960
      - name: avd_tags
        label: "AVD Tags"
        peer: AvdTag
        cardinality: many
        kind: Attribute
        optional: true
        description: "AVD tag names emitted as AVD L2 VLAN tags (scopes the VLAN to tagged nodes)"
        order_weight: 970
