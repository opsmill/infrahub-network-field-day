# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

nodes:
  - name: Link
    namespace: Network
    description: "A physical cable or connection between two endpoints"
    label: Network Link
    icon: mdi:cable-data
    include_in_menu: false
    inherit_from:
      - DcimConnector
    human_friendly_id:
      - name__value
    display_label: name__value
    attributes:
      - name: role
        kind: Dropdown
        optional: true
        order_weight: 1000
        choices:
          - name: dci
            label: DCI
      - name: include_in_underlay_protocol
        label: Include in Underlay Protocol
        kind: Boolean
        optional: false
        default_value: true
        description: "Whether this DCI link participates in the generated underlay routing protocol."
        order_weight: 1100

extensions:
  nodes:
    - kind: DcimDevice
      attributes:
        - name: index
          kind: Number
          optional: true
        - name: role
          kind: Dropdown
          optional: true
          order_weight: 1400
          choices:
            - name: super_spine
              label: Super spine
            - name: spine
              label: Spine
            - name: leaf
              label: Leaf
            - name: border_leaf
              label: Border Leaf
            - name: l2leaf
              label: L2 Leaf
              description: "L2 Leaf Switch (access layer, no EVPN)"
              color: "#f0e6fa"
            - name: l2spine
              label: L2 Spine
              description: "Standalone L2LS fabric spine (Layer 2)"
            - name: l3spine
              label: L3 Spine
              description: "L2LS/campus spine with L3 SVI routing"
            - name: p
              label: Provider (P)
              description: "MPLS provider core router (ISIS-LDP IPVPN)"
            - name: pe
              label: Provider Edge (PE)
              description: "MPLS provider edge router (ISIS-LDP IPVPN)"
            - name: rr
              label: Route Reflector (RR)
              description: "MPLS/WAN route reflector"
            # Non-EOS lab roles. There is deliberately no `firewall` value:
            # the marketplace security schema supplies SecurityFirewall, which
            # inherits DcimGenericDevice and DcimPhysicalDevice, so a firewall
            # is its own device kind rather than a DcimDevice with a role.
            #
            # These are deliberately ABSENT from
            # ROLE_TO_AVD_TYPE in src/solution_arista_avd/avd.py: get_avd_type
            # raises ValueError on an unmapped role, and that loud failure is
            # the behaviour we want for a firewall or an FRR router. Mapping
            # one would instead let a non-EOS device be rendered as EOS, which
            # is silently wrong. Devices with these roles must also stay out of
            # the avd_devices group, which is the only path into the AVD
            # hostvar generator.
            - name: isp_edge
              label: ISP Edge (PE)
              description: "Customer-facing provider edge holding a VRF per tenant"
              color: "#f4e9dd"
            - name: isp_core
              label: ISP Core
              description: "Provider core; default VRF transit and the DC handoff"
              color: "#f4e9dd"
            - name: internet_edge
              label: Internet Edge
              description: "Border router of the internet autonomous system"
              color: "#e3f0e8"
            - name: customer_edge
              label: Customer Edge (CE)
              description: "Tenant-side router terminating an attachment circuit"
              color: "#eef0f4"
            - name: branch_router
              label: Branch Router
              description: "Branch office router with an integrated switched LAN"
              color: "#eef0f4"
            - name: k8s_node
              label: Kubernetes Node
              description: "Cluster member; may also be a ComputePhysicalServer"
              color: "#dde1e7"
        - name: node_id
          label: Node ID
          kind: Number
          optional: true
        - name: avd_custom_hostvars
          label: AVD Custom Hostvars
          kind: JSON
          optional: true
          description: "Device-scope custom pyAVD hostvars; generated values take precedence."
      relationships:
        - name: loopback_ip
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__ip_address"
        - name: vtep_loopback_ip
          label: VTEP Loopback IP
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__vtep_loopback_ip"
        - name: mgmt_ip
          label: Management IP
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__mgmt_ip"
        - name: rack
          peer: LocationRack
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "rack__device"
        - name: pod
          peer: NetworkPod
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "pod__device"
        - name: asn
          label: BGP ASN
          peer: RoutingAsn
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__asn"
          order_weight: 1650
        - name: avd_artifact
          peer: AvdArtifact
          kind: Attribute
          cardinality: one
          optional: true

    - kind: DcimInterface
      attributes:
        - name: description
          kind: Text
          optional: true
          order_weight: 4000
        - name: role
          kind: Dropdown
          optional: true
          choices:
            - name: uplink
              label: Uplink
            - name: access
              label: Access
            - name: spine
              label: Spine
            - name: super_spine
              label: Super Spine
            - name: leaf
              label: Leaf
            - name: loopback
              label: Loopback
            - name: vtep_loopback
              label: VTEP Loopback
            - name: server
              label: Server
            - name: peering
              label: Peering
            - name: storage
              label: Storage
            - name: mlag_peer
              label: MLAG Peer
              description: "Interface used for MLAG peer-link"
              color: "#d4a9e6"
          order_weight: 3000
        - name: mtu
          label: MTU
          kind: Number
          optional: true
          order_weight: 5000
        - name: index
          kind: Text
          read_only: true
          optional: true
          computed_attribute:
            jinja2_template: "{{ \"%03d\"| format(name__value | split_interface | last | int) }}"
            kind: Jinja2
          order_weight: 20000
      relationships:
        - name: ip_address
          label: IP Address
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: interface__ip_address
          order_weight: 6000

    - kind: DcimConnector
      attributes:
        - name: name
          kind: Text
          unique: true
          optional: false
        - name: medium
          label: Medium
          kind: Dropdown
          optional: false
          choices:
            - name: mmf
              label: Multi-Mode Fibre
            - name: smf
              label: Single-Mode Fibre
            - name: copper
              label: Copper
