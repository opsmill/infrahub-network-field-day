# yaml-language-server: $schema=https://schema.infrahub.app/infrahub/schema/latest.json
---
version: "1.0"

nodes:
  - name: Link
    namespace: Network
    description: "A physical cable or connection between two endpoints"
    label: Network Link
    icon: mdi:cable-data
    include_in_menu: false
    inherit_from:
      - DcimConnector
    human_friendly_id:
      - name__value
    display_label: name__value
    attributes:
      - name: role
        kind: Dropdown
        optional: true
        order_weight: 1000
        choices:
          - name: dci
            label: DCI
      - name: include_in_underlay_protocol
        label: Include in Underlay Protocol
        kind: Boolean
        optional: false
        default_value: true
        description: "Whether this DCI link participates in the generated underlay routing protocol."
        order_weight: 1100

extensions:
  nodes:
    - kind: DcimDevice
      # The WAN's FRR routers, since cycle 027. The fabric's EOS switches are
      # DcimFabricSwitch; anything that must see BOTH should peer the
      # DcimGenericDevice generic, not either concrete kind.
      attributes:
        # Two dropdowns, one per device kind, since cycle 027 split DcimDevice.
        #
        # This one carries the roles pyAVD NEVER renders. They are deliberately
        # ABSENT from ROLE_TO_AVD_TYPE in src/solution_arista_avd/avd.py:
        # get_avd_type raises ValueError on an unmapped role, and that loud
        # failure is the behaviour we want for an FRR router. Mapping one would
        # let a non-EOS device be rendered as EOS, which is silently wrong.
        #
        # There is deliberately no `firewall` value: the marketplace security
        # schema supplies SecurityFirewall, which inherits DcimGenericDevice and
        # DcimPhysicalDevice, so a firewall is its own device kind rather than a
        # DcimDevice with a role. DcimFabricSwitch is that same decision applied
        # a second time -- which is why the fabric roles are no longer here.
        - name: role
          kind: Dropdown
          optional: true
          order_weight: 1400
          choices:
            - name: isp_edge
              label: ISP Edge (PE)
              description: "Customer-facing provider edge holding a VRF per tenant"
              color: "#f4e9dd"
            - name: isp_core
              label: ISP Core
              description: "Provider core; default VRF transit and the DC handoff"
              color: "#f4e9dd"
            - name: internet_edge
              label: Internet Edge
              description: "Border router of the internet autonomous system"
              color: "#e3f0e8"
            - name: customer_edge
              label: Customer Edge (CE)
              description: "Tenant-side router terminating an attachment circuit"
              color: "#eef0f4"
            - name: branch_router
              label: Branch Router
              description: "Branch office router with an integrated switched LAN"
              color: "#eef0f4"
            - name: k8s_node
              label: Kubernetes Node
              description: "Cluster member; may also be a ComputePhysicalServer"
              color: "#dde1e7"
      relationships:
        # Explicit, not derived, and deliberately NOT folded into loopback_ip.
        # Of the six routers the WAN renders, three take their router ID from a
        # loopback (isp-pe1, isp-pe2, branch-rtr) and three do not: the customer
        # edges use their LAN-side address and internet-rtr uses its peering
        # address. Recording either of those in `loopback_ip` would be false,
        # and inferring the router ID from an interface role would be wrong for
        # half the fleet — silently, because a BGP router-id that is merely
        # different still forms a session.
        - name: router_id
          label: Router ID
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          description: "The address used as this device's BGP router ID"
          identifier: "device__router_id"
          order_weight: 1660
        - name: asn
          label: BGP ASN
          peer: RoutingAsn
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__asn"
          order_weight: 1650

    - kind: DcimFabricSwitch
      # The twelve fabric-only fields, moved here from DcimDevice by cycle 027.
      # Measured across the 7 switches and 7 routers before the move: every one
      # of these is populated on switches and on no router. `asn` is the
      # exception that stays on both, which is why RoutingAsn.devices had to
      # widen to the device generic rather than follow the others here.
      attributes:
        - name: index
          kind: Number
          optional: true
        # The ten roles pyAVD renders, and this list must EQUAL the keys of
        # ROLE_TO_AVD_TYPE in src/solution_arista_avd/avd.py. The schema and the
        # code then state the same boundary from two directions;
        # tests/unit/test_dcim_schema_contract.py asserts the equality rather
        # than trusting it.
        #
        # `p`, `pe` and `rr` are mapped but have no instances -- they are marked
        # excluded from the generated topology in supported-capabilities.md.
        # They belong to this kind regardless.
        - name: role
          kind: Dropdown
          optional: true
          order_weight: 1400
          choices:
            - name: super_spine
              label: Super spine
            - name: spine
              label: Spine
            - name: leaf
              label: Leaf
            - name: border_leaf
              label: Border Leaf
            - name: l2leaf
              label: L2 Leaf
              description: "L2 Leaf Switch (access layer, no EVPN)"
              color: "#f0e6fa"
            - name: l2spine
              label: L2 Spine
              description: "Standalone L2LS fabric spine (Layer 2)"
            - name: l3spine
              label: L3 Spine
              description: "L2LS/campus spine with L3 SVI routing"
            - name: p
              label: Provider (P)
              description: "MPLS provider core router (ISIS-LDP IPVPN)"
            - name: pe
              label: Provider Edge (PE)
              description: "MPLS provider edge router (ISIS-LDP IPVPN)"
            - name: rr
              label: Route Reflector (RR)
              description: "MPLS/WAN route reflector"
        - name: node_id
          label: Node ID
          kind: Number
          optional: true
        - name: avd_custom_hostvars
          label: AVD Custom Hostvars
          kind: JSON
          optional: true
          description: "Device-scope custom pyAVD hostvars; generated values take precedence."
      relationships:
        - name: loopback_ip
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__ip_address"
        - name: vtep_loopback_ip
          label: VTEP Loopback IP
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__vtep_loopback_ip"
        - name: mgmt_ip
          label: Management IP
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__mgmt_ip"
        - name: rack
          peer: LocationRack
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "rack__device"
        - name: pod
          peer: NetworkPod
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "pod__device"
        - name: asn
          label: BGP ASN
          peer: RoutingAsn
          kind: Attribute
          cardinality: one
          optional: true
          identifier: "device__asn"
          order_weight: 1650
        - name: avd_artifact
          peer: AvdArtifact
          kind: Attribute
          cardinality: one
          optional: true

    - kind: DcimInterface
      attributes:
        - name: description
          kind: Text
          optional: true
          order_weight: 4000
        - name: role
          kind: Dropdown
          optional: true
          choices:
            - name: uplink
              label: Uplink
            - name: access
              label: Access
            - name: spine
              label: Spine
            - name: super_spine
              label: Super Spine
            - name: leaf
              label: Leaf
            - name: loopback
              label: Loopback
            - name: vtep_loopback
              label: VTEP Loopback
            - name: server
              label: Server
            - name: peering
              label: Peering
            - name: storage
              label: Storage
            - name: mlag_peer
              label: MLAG Peer
              description: "Interface used for MLAG peer-link"
              color: "#d4a9e6"
          order_weight: 3000
        - name: mtu
          label: MTU
          kind: Number
          optional: true
          order_weight: 5000
        - name: index
          kind: Text
          read_only: true
          optional: true
          computed_attribute:
            jinja2_template: "{{ \"%03d\"| format(name__value | split_interface | last | int) }}"
            kind: Jinja2
          order_weight: 20000
      relationships:
        - name: ip_address
          label: IP Address
          peer: IpamIPAddress
          kind: Attribute
          cardinality: one
          optional: true
          identifier: interface__ip_address
          order_weight: 6000

    - kind: DcimConnector
      attributes:
        - name: name
          kind: Text
          unique: true
          optional: false
        - name: medium
          label: Medium
          kind: Dropdown
          optional: false
          choices:
            - name: mmf
              label: Multi-Mode Fibre
            - name: smf
              label: Single-Mode Fibre
            - name: copper
              label: Copper
