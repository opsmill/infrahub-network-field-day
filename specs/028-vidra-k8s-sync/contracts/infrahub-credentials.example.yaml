---
# Contract: the SHAPE of the credential Secret. The real one is never committed.
#
# Two things here are easy to get wrong and fail without a useful error:
#
#   1. The label value has the scheme AND the port stripped. The operator computes
#      it as strings.Split(apiURL, ":")[1] with "//" trimmed, so
#      "http://172.20.41.1:8000" becomes "172.20.41.1". It has to be this way: a
#      colon is not a legal character in a Kubernetes label value. Get it wrong
#      and the operator reports "no secret found".
#
#   2. These are a USERNAME AND PASSWORD, not an API token. The operator exchanges
#      them at POST /api/auth/login. An INFRAHUB_API_TOKEN-shaped secret does not
#      work.
#
# Secrets are selected by label across the whole cluster, newest first, so a
# second matching Secret is a hazard rather than a fallback.
#
# Create the real one with:
#   kubectl -n vidra-system create secret generic infrahub-credentials \
#     --from-literal=username="$INFRAHUB_USERNAME" \
#     --from-literal=password="$INFRAHUB_PASSWORD"
#   kubectl -n vidra-system label secret infrahub-credentials infrahub-api-url=172.20.41.1
apiVersion: v1
kind: Secret
metadata:
  name: infrahub-credentials
  namespace: vidra-system
  labels:
    infrahub-api-url: "172.20.41.1"
type: Opaque
stringData:
  username: "REPLACE_ME"
  password: "REPLACE_ME"
