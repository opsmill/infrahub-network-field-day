---
x-infrahub-custom-build: &infrahub_custom_build
  image: opsmill/infrahub-solution-arista-avd:${INFRAHUB_BASE_VERSION:-1.10.6}
  environment:
    INFRAHUB_GIT_USER_NAME: "infrahub"
    INFRAHUB_GIT_EMAIL: "no-reply@opsmill.com"
    INFRAHUB_GIT_USE_EXPLICIT_MERGE_COMMIT: true
    INFRAHUB_TIMEOUT: 180
    CLOUDVISION_SERVERS: ${CLOUDVISION_SERVERS:-}
    CLOUDVISION_TOKEN: ${CLOUDVISION_TOKEN:-}
    CLOUDVISION_USERNAME: ${CLOUDVISION_USERNAME:-}
    CLOUDVISION_PASSWORD: ${CLOUDVISION_PASSWORD:-}
    CLOUDVISION_VERIFY_CERTS: ${CLOUDVISION_VERIFY_CERTS:-true}
    CLOUDVISION_PROXY_HOST: ${CLOUDVISION_PROXY_HOST:-}
    CLOUDVISION_PROXY_PORT: ${CLOUDVISION_PROXY_PORT:-}
    CLOUDVISION_PROXY_USERNAME: ${CLOUDVISION_PROXY_USERNAME:-}
    CLOUDVISION_PROXY_PASSWORD: ${CLOUDVISION_PROXY_PASSWORD:-}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      INFRAHUB_BASE_VERSION: "${INFRAHUB_BASE_VERSION:-1.10.6}"

services:
  infrahub-server:
    <<: *infrahub_custom_build
    # ------------------------------------------------------------------
    # SSO against the lab's Dex. No Infrahub code is involved: 1.10.6 ships
    # as an OIDC relying party, and this is the whole of the configuration.
    #
    # The DISCOVERY URL is fetched by the SERVER, so it uses the address the
    # server can reach. The URLs *inside* that document are followed by the
    # BROWSER, so Dex must publish itself as 172.20.41.1 -- which is why its
    # issuer is set that way rather than to `dex:5556`. Pointing this at
    # `http://dex:5556` instead would fetch fine and then redirect the browser
    # to a hostname it cannot resolve.
    #
    # `depends_on` is deliberate: Infrahub reads provider configuration at
    # startup, and a server that starts first shows no SSO button at all.
    environment:
      # A JSON ARRAY, not a bare name. The setting is a list field, so
      # pydantic-settings parses it as JSON -- and `provider1` on its own makes
      # the server refuse to boot with `error parsing value for field
      # "oidc_providers"`, which names the field and not the format it wanted.
      # Refusing to boot is the right failure; silently ignoring it would leave
      # a login page with no SSO button and nothing to explain why.
      INFRAHUB_SECURITY_OIDC_PROVIDERS: ${INFRAHUB_SECURITY_OIDC_PROVIDERS:-["provider1"]}
      INFRAHUB_OIDC_PROVIDER1_CLIENT_ID: ${INFRAHUB_OIDC_PROVIDER1_CLIENT_ID:-infrahub}
      INFRAHUB_OIDC_PROVIDER1_CLIENT_SECRET: ${INFRAHUB_OIDC_PROVIDER1_CLIENT_SECRET:-infrahub-dex-secret}
      # THE TOOLING CLUSTER'S DEX, which is the one address every party can
      # reach: this container, the host, pods in that cluster, and the branch
      # desktop through the firewall. That is the whole reason the tooling
      # network exists -- before it there was no single issuer, and Infrahub and
      # the portal had to trust two different ones.
      INFRAHUB_OIDC_PROVIDER1_DISCOVERY_URL: >-
        ${INFRAHUB_OIDC_PROVIDER1_DISCOVERY_URL:-http://10.90.0.11:32556/dex/.well-known/openid-configuration}
      INFRAHUB_OIDC_PROVIDER1_DISPLAY_LABEL: ${INFRAHUB_OIDC_PROVIDER1_DISPLAY_LABEL:-Sign in with Dex}
      INFRAHUB_OIDC_PROVIDER1_ICON: ${INFRAHUB_OIDC_PROVIDER1_ICON:-mdi:account-key}
      # Every SSO user lands here. Without a default group an SSO account is
      # created with no permissions at all, logs in successfully, and then sees
      # nothing -- which reads as a broken integration rather than a missing
      # setting.
      INFRAHUB_SECURITY_SSO_USER_DEFAULT_GROUP: ${INFRAHUB_SECURITY_SSO_USER_DEFAULT_GROUP:-Infrahub Users}
    # NO `depends_on` for the identity provider, deliberately. Dex lives in the
    # tooling cluster now, which comes up long after `invoke start` -- and
    # Infrahub was measured booting cleanly with its discovery URL unreachable,
    # because it fetches discovery on first use rather than at startup. A hard
    # dependency here would invert the bootstrap order for no benefit.
  database:
    ports:
      - 7474:7474
      - 7687:7687

  task-manager:
    <<: *infrahub_custom_build
    ports:
      - 4200:4200

  task-worker:
    <<: *infrahub_custom_build
    volumes:
      - ./:/upstream
      - ./src:/opt/local/src

  # ==========================================================================
  # The Backstage service portal.
  #
  # A SEPARATE relying party from Infrahub, not a client of it. Both trust the
  # lab's Dex, so one identity signs in to each, and each mints its own session.
  # Backstage still talks to Infrahub with a service token: Infrahub's own flow
  # ends in Infrahub's UI, which keeps the token, so there is no per-user
  # Infrahub credential to forward. See auth/README.md.
  #
  # The bundle is built on the host, so run `invoke backstage-build` before this
  # image is built or rebuilt.
  # ==========================================================================
  backstage:
    image: nfd41/backstage:local
    build:
      context: ./backstage
      dockerfile: packages/backend/Dockerfile
    command:
      - node
      - packages/backend
      - --config
      - app-config.yaml
      - --config
      - app-config.docker.yaml
    restart: unless-stopped
    # NOT started by the stack. The portal runs in the tooling cluster, behind
    # the firewall, which is the whole point -- see tooling/20-backstage.yaml.
    # This entry exists so `docker compose build backstage` still produces the
    # image that gets imported into tool-node1's containerd.
    profiles: ["build-only"]
    depends_on:
      infrahub-server:
        condition: service_healthy
    environment:
      INFRAHUB_ADDRESS: http://infrahub-server:8000
      INFRAHUB_API_TOKEN: ${INFRAHUB_INITIAL_ADMIN_TOKEN:-06438eb2-8019-4776-878c-0941b1f1d1ec}
      # The origin the BROWSER is on. It must match a redirect URI registered on
      # the `backstage` client in auth/dex-config.yaml, or sign-in fails at Dex
      # with an error naming the exact string it expected.
      BACKSTAGE_BASE_URL: >-
        ${BACKSTAGE_BASE_URL:-http://agentic-agittings-agittings-dev-vm-02:3001}
      BACKSTAGE_OIDC_METADATA_URL: >-
        ${BACKSTAGE_OIDC_METADATA_URL:-http://agentic-agittings-agittings-dev-vm-02.tailc018d.ts.net:5556/dex/.well-known/openid-configuration}
      BACKSTAGE_OIDC_CLIENT_ID: ${BACKSTAGE_OIDC_CLIENT_ID:-backstage}
      BACKSTAGE_OIDC_CLIENT_SECRET: ${BACKSTAGE_OIDC_CLIENT_SECRET:-backstage-dex-secret}
      # Signs the express session the OIDC strategy keeps its state and nonce
      # in. A lab default so the stack comes up unattended; override it anywhere
      # that matters.
      BACKSTAGE_SESSION_SECRET: ${BACKSTAGE_SESSION_SECRET:-nfd41-lab-backstage-session-secret}
    ports:
      # The backend serves the frontend bundle, so one port does both.
      - "${BACKSTAGE_PORT:-3001}:7007"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://localhost:7007/.backstage/health/v1/readiness').then(r
          => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

  service-catalog:
    build:
      context: .
      dockerfile: Dockerfile.catalog
    restart: unless-stopped
    depends_on:
      infrahub-server:
        condition: service_healthy
    environment:
      INFRAHUB_ADDRESS: http://infrahub-server:8000
      INFRAHUB_UI_URL: ${INFRAHUB_UI_URL:-http://localhost:8000}
      INFRAHUB_API_TOKEN: ${INFRAHUB_INITIAL_ADMIN_TOKEN:-06438eb2-8019-4776-878c-0941b1f1d1ec}
      DEFAULT_BRANCH: ${INFRAHUB_INITIAL_DEFAULT_BRANCH:-main}
    ports:
      - "${STREAMLIT_PORT:-8501}:8501"
    healthcheck:
      test: python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health')" || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # The deployment reconciler. Compares every device against its rendered
  # artifact on a timer and pushes the ones that genuinely differ.
  #
  # **Behind a profile, so `docker compose up` does not start it.** This service
  # replaces device configuration without being asked, including correcting
  # drift someone introduced by hand. Starting it must be a decision:
  #
  #     docker compose --profile reconcile up -d deployment-reconciler
  #
  # Two things it needs that no other service here does, and both are worth
  # understanding before enabling it:
  #
  #   * `network_mode: host` -- the fabric switches are reached over eAPI at
  #     their ContainerLab management addresses (172.20.41.0/24), which are on
  #     the host's docker network rather than the Infrahub compose network.
  #   * the Docker socket -- the FRR routers and the firewall have no address
  #     modelled at all and are reached through `docker exec` on their
  #     containers, because Infrahub's names for them and ContainerLab's names
  #     do not match. Mounting the socket is effectively root on the host. For a
  #     lab that is the same trust level as running `invoke provision` from a
  #     shell; anywhere else it is not, and the reconciler should be given a
  #     narrower route to the devices instead.
  deployment-reconciler:
    <<: *infrahub_custom_build
    profiles: ["reconcile"]
    restart: unless-stopped
    depends_on:
      infrahub-server:
        condition: service_healthy
    network_mode: host
    volumes:
      - "./:/source"
      - "/var/run/docker.sock:/var/run/docker.sock"
    working_dir: /source
    environment:
      INFRAHUB_ADDRESS: ${INFRAHUB_ADDRESS:-http://localhost:8000}
      INFRAHUB_API_TOKEN: ${INFRAHUB_INITIAL_ADMIN_TOKEN:-06438eb2-8019-4776-878c-0941b1f1d1ec}
      # Device credentials come from the environment and nowhere else: never
      # baked into the image, never committed, never written into Infrahub.
      NFD41_EOS_USERNAME: ${NFD41_EOS_USERNAME:-admin}
      NFD41_EOS_PASSWORD: ${NFD41_EOS_PASSWORD:-admin}
      NFD41_VSRX_USERNAME: ${NFD41_VSRX_USERNAME:-admin}
      NFD41_VSRX_PASSWORD: ${NFD41_VSRX_PASSWORD:-admin@123}
      NFD41_RECONCILE_INTERVAL: ${NFD41_RECONCILE_INTERVAL:-600}
    command: python scripts/reconcile.py

  semaphore:
    build:
      context: ./semaphore
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_PASSWORD: semaphore
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: admin@localhost
      SEMAPHORE_FORWARDED_ENV_VARS: '["INFRAHUB_ADDRESS","INFRAHUB_API_TOKEN"]'
      INFRAHUB_ADDRESS: http://infrahub-server:8000
      INFRAHUB_API_TOKEN: ${INFRAHUB_API_TOKEN:-44af444d-3b26-410d-9546-b758657e026c}
    ports:
      - "3000:3000"
    volumes:
      - ./ansible:/opt/semaphore/playbooks
      # deploy_clab.yml copies the committed ContainerLab bind sources
      # (configs/eos-intf-mapping/*.json, configs/servers/*-netplan.yaml) from
      # here onto the ContainerLab host. Read-only: the playbook only reads them.
      - ./lab:/opt/semaphore/lab:ro
      # Where deploy_clab.yml stages the fetched topology and device configs.
      # A bind mount rather than a container path, so the pulled files land on
      # the host and survive the container being recreated.
      #
      # Must be world-writable: this container runs as uid 1001 while the host
      # directory is owned by the invoking user, so a default 0755 leaves the
      # staging write failing with EACCES. `invoke init-semaphore` creates it
      # with the right mode. Gitignored via lab/.gitignore's `clab-*`.
      - ./lab/clab-staging:/opt/semaphore/clab-staging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/ping"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
