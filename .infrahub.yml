---
# Schemas are intentionally NOT declared here. They are loaded explicitly via
# `inv load` / `inv load-schema` (`infrahubctl schema load schemas`) so that the
# load order and timing are controlled during setup. If you want schemas to sync
# automatically with the repository instead, uncomment the block below — but be
# aware it will then load on every repository sync.
# schemas:
#  - schemas

menus:
  - menus/menu.yml

queries:
  # Polled by the Vidra operator, which turns a merge into cluster state. Not
  # consumed by any Python in this repository -- that is why it lives in
  # `queries/` rather than beside a transform. The operator's own default name
  # is `ArtifactIDs`; vidra/vidra-config.yaml points it here instead so the
  # registration can stay snake_case like every other entry below.
  - name: artifact_ids
    file_path: "./queries/artifact_ids.gql"

  - name: avd_device_hostvar
    file_path: "./generators/avd_device_hostvar.gql"
  - name: generate_fabric
    file_path: "./generators/generate_fabric.gql"

  - name: generate_pod
    file_path: "./generators/generate_pod.gql"

  - name: generate_rack
    file_path: "./generators/generate_rack.gql"

  - name: computed_interface_description
    file_path: "./transforms/computed_interface_description.gql"

  - name: cabling_plan
    file_path: "./transforms/cabling_plan.gql"

  # AVD Generator query
  - name: generate_avd
    file_path: "./generators/generate_avd.gql"

  # AVD Transform queries
  - name: avd_device_config
    file_path: "./transforms/avd_device_config.gql"

  - name: avd_fabric_devices
    file_path: "./transforms/avd_fabric_devices.gql"

  - name: avd_anta_catalog
    file_path: "./transforms/avd_anta_catalog.gql"

  - name: backfill_structured_config
    file_path: "./generators/backfill_structured_config.gql"

  - name: generate_server_cabling
    file_path: "./generators/generate_server_cabling.gql"

  - name: containerlab_topology
    file_path: "./transforms/containerlab_topology.gql"

  # Second query used by the containerlab_topology transform to resolve link
  # endpoints in batches; registered so a malformed query is caught at repo
  # sync instead of failing silently at render time.
  - name: containerlab_link_endpoints
    file_path: "./transforms/containerlab_link_endpoints.gql"

  # CloudVision proposed-change check query
  - name: cv_config_check
    file_path: "./checks/cv_config_check.gql"
  - name: fabric_pool_check
    file_path: "./checks/fabric_pool_check.gql"
  # Global peering-consistency check
  - name: peering_consistency_check
    file_path: "./checks/peering_consistency_check.gql"
  # Global WAN service-consistency check
  - name: wan_service_check
    file_path: "./checks/wan_service_check.gql"
  # Global zone-advertisement check
  - name: zone_advertisement_check
    file_path: "./checks/zone_advertisement_check.gql"
  # Global allocation-consistency check
  - name: allocation_consistency_check
    file_path: "./checks/allocation_consistency_check.gql"
  - name: cv_workspace_submission_webhook
    file_path: "./transforms/cv_workspace_submission_webhook.gql"

  # Crossplane manifest rendering
  - name: crossplane_fabric_peering
    file_path: "./transforms/crossplane_fabric_peering.gql"

  - name: crossplane_fabric_app
    file_path: "./transforms/crossplane_fabric_app.gql"

  # The WAN's SR Linux configuration: one device plus the whole WAN context,
  # because a provider edge's import policy is assembled from every tenant's
  # services.
  - name: srl_config
    file_path: "./transforms/srl_config.gql"

  # The perimeter firewall's Junos configuration
  - name: junos_config
    file_path: "./transforms/junos_config.gql"

  # Cycle 034: the collector's whole Telegraf configuration, rendered from the
  # monitoring profiles -- and the freshness generator's lookup of that artifact.
  - name: telemetry_collector_config
    file_path: "./transforms/telemetry_collector_config.gql"
  - name: generate_monitoring_collector
    file_path: "./generators/generate_monitoring_collector.gql"

  # Service-layer generator: derives a cluster's fabric BGP sessions
  - name: generate_fabric_peering
    file_path: "./generators/generate_fabric_peering.gql"

  # Service-layer generator: turns an access grant into firewall rules
  - name: generate_app_access
    file_path: "./generators/generate_app_access.gql"

  # Service-layer generator: allocates a subnet and a VLAN for a segment
  - name: generate_network_segment
    file_path: "./generators/generate_network_segment.gql"

  # Service-layer generator: allocates an exposed application's VIP block
  - name: generate_fabric_app
    file_path: "./generators/generate_fabric_app.gql"

  # Service-layer generators: onboarding a tenant, and placing a machine
  - name: generate_tenant_onboarding
    file_path: "./generators/generate_tenant_onboarding.gql"

  - name: generate_server_placement
    file_path: "./generators/generate_server_placement.gql"


generator_definitions:
  - name: generate-avd-device-hostvar
    file_path: "./generators/generate_avd_device_hostvar.py"
    query: avd_device_hostvar
    targets: avd_devices
    parameters:
      name: name__value
    class_name: GenerateAVDDeviceHostvar
    convert_query_response: false
    # TRUE SO THAT A PROPOSED CHANGE SHOWS ITS OWN FABRIC CONSEQUENCE.
    #
    # Several service generators write fabric intent: `generate-app-access`
    # appends a `permit <vip>` sequence to a border leaf's
    # `avd_custom_hostvars`, `generate-network-segment` creates an `EvpnSvi`
    # whose `avd_tags` decide which switches render it at all. None of that
    # reaches a rendered configuration until this generator runs, and with this
    # false it ran on no trigger and in no pipeline -- so every request path
    # except one produced a proposed change showing changed JSON and no
    # configuration, which is a reviewer approving a consequence they cannot
    # see. `generate-avd-device-structured-config` is already true, and it reads
    # the files this one writes, so leaving this false made that one a no-op in
    # the pipeline as well.
    #
    # The cost is a whole-fabric pass per proposed change -- about 15s for seven
    # switches -- plus a stable bookkeeping diff of AvdArtifact group
    # membership. Cheaper than an invisible change.
    execute_in_proposed_change: true
    # STILL FALSE. After a merge the reconciler is what reaches devices, and it
    # renders from artifacts; a second whole-fabric pass on every merge would
    # duplicate the work the proposed change already did.
    execute_after_merge: false
  - name: generate-fabric
    file_path: "./generators/generate_fabric.py"
    query: generate_fabric
    targets: fabrics
    parameters:
      name: name__value
    class_name: FabricGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  - name: generate-pod
    file_path: "./generators/generate_pod.py"
    query: generate_pod
    targets: pods
    parameters:
      name: name__value
    class_name: PodGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  - name: generate-rack
    file_path: "./generators/generate_rack.py"
    query: generate_rack
    targets: racks
    parameters:
      name: name__value
    class_name: RackGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  # AVD Generator - populates device.avd_inputs and device.avd_structured_config
  - name: generate-avd-device-structured-config
    file_path: "./generators/generate_avd_device_structured_config.py"
    query: generate_avd
    targets: fabrics
    parameters:
      name: name__value
    class_name: AvdDeviceStructuredConfigGenerator
    convert_query_response: false
    execute_in_proposed_change: true
    execute_after_merge: false

  - name: backfill-structured-config
    file_path: "./generators/backfill_structured_config.py"
    query: backfill_structured_config
    targets: avd_structured_configs
    parameters:
      name: artifact__name__value
    class_name: BackfillStructuredConfigGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  # Sits underneath the service layer: one ClusterFabricPeering per fabric
  # device the cluster's nodes are cabled to, with peer_asn read from the
  # fabric's own RoutingAsn so the two ends of the session cannot drift.
  - name: generate-fabric-peering
    file_path: "./generators/generate_fabric_peering.py"
    query: generate_fabric_peering
    targets: service_fabric_peerings
    parameters:
      name: name__value
    class_name: FabricPeeringGenerator
    convert_query_response: false

  # Sits underneath the service layer: turns a ServiceAppAccess into
  # the firewall objects that permit the session -- an address-book entry for
  # the destination VIP, a service object per permitted port, and the rule
  # joining them. Nothing downstream changes: junos_config queries
  # SecurityGenericAddress and SecurityPolicy unfiltered, so the generated
  # objects render into the existing artifact and the reconciler pushes it.
  #
  # There is no `approved` field: the branch is the gate, and merging is the
  # approval. A grant whose `status` is decommissioning/decommissioned is
  # WITHDRAWN rather than built -- its rules are removed -- which reads exactly
  # like a broken generator. Check `status` before debugging anything else.
  - name: generate-app-access
    file_path: "./generators/generate_app_access.py"
    query: generate_app_access
    targets: service_app_accesses
    parameters:
      name: name__value
    class_name: AppAccessGenerator
    convert_query_response: false

  # Sits underneath the service layer, and is the first generator here that
  # ALLOCATES rather than selects: a segment states a size and a tenant, and
  # this takes the next free subnet and VLAN id and builds the IpamPrefix,
  # IpamVLAN and EvpnSvi a tenant network is made of.
  #
  # Nothing reaches a switch on its own. The writes land in the graph and
  # generate-avd-device-hostvar carries them onto the fabric, which is run
  # explicitly -- so a correct segment that is invisible on the device means
  # `invoke avd` has not run yet, not that this failed.
  - name: generate-network-segment
    file_path: "./generators/generate_network_segment.py"
    query: generate_network_segment
    targets: service_network_segments
    parameters:
      name: name__value
    class_name: NetworkSegmentGenerator
    convert_query_response: false

  # Sits underneath the service layer: gives an exposed application a
  # LoadBalancer VIP block from its cluster's pool, instead of a human choosing
  # one by hand with nothing preventing a collision.
  #
  # crossplane_fabric_app.py RAISES on an exposed application with no block, so
  # this is the difference between "state a size" and "pick addresses and hope".
  # A block that already exists is kept, whoever created it -- which is how the
  # seeded otternet-demo keeps 10.112.240.0/28 and its manifest stays byte-identical.
  - name: generate-fabric-app
    file_path: "./generators/generate_fabric_app.py"
    query: generate_fabric_app
    targets: service_fabric_apps
    parameters:
      name: name__value
    class_name: FabricAppGenerator
    convert_query_response: false

  # Puts a tenant on a fabric. The VNI base is DERIVED rather than pooled: every
  # tenant's L2VLAN VNIs are allocated upward from its base, and a CoreNumberPool
  # hands out consecutive integers -- so pooling it would give two tenants
  # overlapping VNI ranges while looking perfectly correct.
  - name: generate-tenant-onboarding
    file_path: "./generators/generate_tenant_onboarding.py"
    query: generate_tenant_onboarding
    targets: service_tenant_onboardings
    parameters:
      name: name__value
    class_name: TenantOnboardingGenerator
    convert_query_response: false

  # Places a machine in a rack and joins it to `servers`, which is the group
  # generate-server-cabling targets. Without that membership the machine is
  # created and never cabled, and nothing reports it.
  - name: generate-server-placement
    file_path: "./generators/generate_server_placement.py"
    query: generate_server_placement
    targets: service_server_placements
    parameters:
      name: name__value
    class_name: ServerPlacementGenerator
    convert_query_response: false

  - name: generate-server-cabling
    file_path: "./generators/generate_server_cabling.py"
    query: generate_server_cabling
    targets: servers
    parameters:
      name: name__value
    class_name: ServerCablingGenerator
    convert_query_response: false
    execute_in_proposed_change: false
    execute_after_merge: false

  # Cycle 034. WRITES NO NODE: it only asks for its collector's
  # `Telemetry Collector Configuration` to be re-rendered on its own branch.
  # That artifact's target is the collector, and almost nothing that changes
  # what should be collected is a change to the collector -- a device joining a
  # group, a profile gaining a measurement -- so without this the proposed
  # change shows the data and no configuration diff.
  #
  # Pipeline and post-merge only. NO trigger rule may name a Monitoring kind:
  # tests/unit/test_deployment_schema_contract.py fails if one does.
  - name: generate-monitoring-collector
    file_path: "./generators/generate_monitoring_collector.py"
    query: generate_monitoring_collector
    targets: monitoring_collectors
    parameters:
      name: name__value
    class_name: MonitoringCollectorGenerator
    convert_query_response: false
    execute_in_proposed_change: true
    execute_after_merge: true

check_definitions:
  - name: cv-config-validation
    file_path: "./checks/cv_config_check.py"
    class_name: CVConfigValidationCheck
    targets: fabrics
    parameters:
      name: name__value
  - name: fabric-pool-validation
    file_path: "./checks/fabric_pool_check.py"
    class_name: FabricPoolValidationCheck
    targets: fabrics
    parameters:
      name: name__value
  # Global: no targets. These rules are statements about the whole graph --
  # "two services claim one cluster" has no natural group to iterate -- unlike
  # the two checks above, which validate per-fabric pools.
  - name: peering-consistency
    file_path: "./checks/peering_consistency_check.py"
    class_name: PeeringConsistencyCheck
  # Also global. The WAN service layer names technical objects rather than
  # creating them, so no generator sits beneath it -- and every one of its
  # references is otherwise unverified. A circuit belonging to another tenant
  # inside an L3VPN joins two tenants' routing, and nothing errors.
  - name: wan-service-consistency
    file_path: "./checks/wan_service_check.py"
    class_name: WanServiceConsistencyCheck
  # Also global, and for the same reason: "some zone names a prefix list nobody
  # declares" is a statement about the whole graph. It discharges the condition
  # cycle 032 attached to modelling that prefix list as a NAME rather than a
  # relationship -- there is no object to reference, so the reference is only
  # defensible if the mismatch is detectable.
  - name: zone-advertisement
    file_path: "./checks/zone_advertisement_check.py"
    class_name: ZoneAdvertisementCheck
  # Also global. The two allocating generators draw from pools beside numbers
  # and blocks typed by hand, and the domains that matter -- a VLAN id per
  # FABRIC, a subnet per VRF, a VIP block per cluster pool -- are ones no schema
  # uniqueness constraint covers. Every collision here loads and merges cleanly.
  - name: allocation-consistency
    file_path: "./checks/allocation_consistency_check.py"
    class_name: AllocationConsistencyCheck

python_transforms:
  - name: computed_interface_description
    class_name: ComputedInterfaceDescription
    file_path: "./transforms/computed_interface_description.py"
  - name: cabling_plan
    class_name: CablingPlan
    file_path: "./transforms/cabling_plan.py"
  - name: avd_eos_config
    class_name: AvdEosConfigTransform
    file_path: "./transforms/avd_eos_config.py"
  - name: avd_fabric_doc
    class_name: AvdFabricDocTransform
    file_path: "./transforms/avd_fabric_doc.py"
  - name: avd_device_doc
    class_name: AvdDeviceDocTransform
    file_path: "./transforms/avd_device_doc.py"
  - name: avd_anta_catalog
    class_name: AvdAntaCatalogTransform
    file_path: "./transforms/avd_anta_catalog.py"
  - name: containerlab_topology
    class_name: ContainerLabTopology
    file_path: "./transforms/containerlab_topology.py"
  - name: cv_workspace_submission_webhook_payload
    class_name: CVWorkspaceSubmissionWebhookPayload
    file_path: "./transforms/cv_workspace_submission_webhook.py"
    convert_query_response: false
  - name: crossplane_fabric_peering
    class_name: CrossplaneFabricPeeringTransform
    file_path: "./transforms/crossplane_fabric_peering.py"
  - name: crossplane_fabric_app
    class_name: CrossplaneFabricAppTransform
    file_path: "./transforms/crossplane_fabric_app.py"
  - name: srl_config
    class_name: SrlConfig
    file_path: "./transforms/srl_config.py"
  - name: junos_config
    class_name: JunosConfig
    file_path: "./transforms/junos_config.py"
  - name: telemetry_collector_config
    class_name: TelemetryCollectorConfig
    file_path: "./transforms/telemetry_collector_config.py"

artifact_definitions:
  - name: "cabling_plan"
    artifact_name: "Cabling Plan"
    parameters:
      name: "name__value"
    content_type: "text/csv"
    targets: "fabrics"
    transformation: "cabling_plan"
  - name: "avd_eos_configuration"
    artifact_name: "AVD EOS Configuration"
    parameters:
      name: "name__value"
    content_type: "text/plain"
    targets: "avd_devices"
    transformation: "avd_eos_config"
  - name: "avd_fabric_documentation"
    artifact_name: "AVD Fabric Documentation"
    parameters:
      name: "name__value"
    content_type: "text/markdown"
    targets: "fabrics"
    transformation: "avd_fabric_doc"
  - name: "avd_device_documentation"
    artifact_name: "AVD Device Documentation"
    parameters:
      name: "name__value"
    content_type: "text/markdown"
    targets: "avd_devices"
    transformation: "avd_device_doc"
  - name: "avd_anta_catalog"
    artifact_name: "AVD ANTA Catalog"
    parameters:
      name: "name__value"
    content_type: "application/yaml"
    targets: "avd_devices"
    transformation: "avd_anta_catalog"
  - name: "containerlab_topology"
    artifact_name: "ContainerLab Topology"
    parameters:
      name: "name__value"
    content_type: "application/yaml"
    targets: "fabrics"
    transformation: "containerlab_topology"
  - name: "crossplane_fabric_peering"
    artifact_name: "Crossplane FabricPeering"
    parameters:
      name: "name__value"
    content_type: "application/yaml"
    targets: "service_fabric_peerings"
    transformation: "crossplane_fabric_peering"
  # A separate target group from the peering artifact: applications and
  # peerings are different sets, and an artifact definition pointed at the
  # wrong one would try to render a resource it cannot.
  - name: "crossplane_fabric_app"
    artifact_name: "Crossplane FabricApp"
    parameters:
      name: "name__value"
    content_type: "application/yaml"
    targets: "service_fabric_apps"
    transformation: "crossplane_fabric_app"

  # The perimeter firewall's WHOLE configuration (cycle 035): the reconciler
  # pushes it with `load override`, so anything it omits is deleted. Every line
  # of junos.conf except its 72 lines of top-level commentary -- `system` and
  # the lab's two existing password hashes included, a recorded exception --
  # plus what vrnetlab's init.conf injects at boot: fxp0, host-name, services,
  # management-instance and the mgmt_junos routing instance. The one thing the
  # model cannot reproduce is the SEQUENCE of the zone-pair blocks; every pair
  # is present and byte-for-byte identical.
  - name: "junos_config"
    artifact_name: "Junos Configuration"
    parameters:
      device: "name__value"
    content_type: "text/plain"
    targets: "junos_firewalls"
    transformation: "junos_config"

  # The WAN's SR Linux configuration, one artifact per router: flat `set`
  # commands, which ContainerLab boots and the reconciler loads into a candidate
  # as a replace of /interface, /network-instance and /routing-policy.
  # `text/plain` because the transform returns a str; a dict would make it
  # application/json and wrap the config in JSON.
  #
  # `srl_routers` names its six members explicitly rather than deriving them
  # from the device role, because cust-acme-dr-ce shares the `customer_edge`
  # role and runs no routing protocol at all.
  - name: "srl_config"
    artifact_name: "SR Linux Configuration"
    parameters:
      device: "name__value"
    content_type: "text/plain"
    targets: "srl_routers"
    transformation: "srl_config"

  # Cycle 034. Telegraf's whole configuration, as ONE Kubernetes ConfigMap that
  # Vidra's third sync delivers into the collector's namespace. `application/yaml`
  # and a single document, because that is what the existing syncs are proven
  # to apply.
  #
  # The target is the COLLECTOR, so a device joining a group does not change the
  # target and would leave this stale -- which is why generate-monitoring-collector
  # exists. It re-renders this on every proposed change and after every merge.
  - name: "telemetry_collector_config"
    artifact_name: "Telemetry Collector Configuration"
    parameters:
      name: "name__value"
    content_type: "application/yaml"
    targets: "monitoring_collectors"
    transformation: "telemetry_collector_config"
