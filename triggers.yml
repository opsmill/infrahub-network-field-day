---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreGeneratorAction
  data:
    - name: run-pod-generator
      generator: generate-pod
    - name: run-rack-generator
      generator: generate-rack
    - name: run-avd-device-structured-config-generator
      generator: generate-avd-device-structured-config
    - name: run-backfill-structured-config-generator
      generator: backfill-structured-config
    - name: run-server-cabling-generator
      generator: generate-server-cabling

    # The service layer. Until these existed, a service created on a branch was
    # expanded only because the PORTAL asked for it -- so a service created any
    # other way (the Streamlit pages, the API, a human in the UI) sat unbuilt
    # until a proposed-change pipeline or a merge picked it up, and the branch
    # diff showed the request with none of its consequences.
    - name: run-network-segment-generator
      generator: generate-network-segment
    - name: run-fabric-app-generator
      generator: generate-fabric-app
    - name: run-app-access-generator
      generator: generate-app-access
    - name: run-tenant-onboarding-generator
      generator: generate-tenant-onboarding
    - name: run-server-placement-generator
      generator: generate-server-placement
    - name: run-fabric-peering-generator
      generator: generate-fabric-peering

---
apiVersion: infrahub.app/v1
kind: Object
spec:
  kind: CoreNodeTriggerRule
  data:

    - name: trigger-pod-generator-update-checksum
      branch_scope: "other_branches"
      node_kind: NetworkPod
      mutation_action: "updated"
      action: run-pod-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: checksum
            value_match: any

    - name: trigger-pod-generator-update-index
      branch_scope: "other_branches"
      node_kind: NetworkPod
      mutation_action: "updated"
      action: run-pod-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: index
            value_match: any

    # Spine sizing lives on the pod's device_designs (role `spine`), so the
    # trigger watches that relationship. `updated` covers a design being added
    # or removed; editing device_quantity on an existing design mutates the
    # design node rather than the pod, so that case needs an explicit run.
    - name: trigger-pod-generator-update-device-designs
      branch_scope: "other_branches"
      node_kind: NetworkPod
      mutation_action: "updated"
      action: run-pod-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: device_designs
            modification_type: updated

    - name: trigger-pod-generator-update-role
      branch_scope: "other_branches"
      node_kind: NetworkPod
      mutation_action: "updated"
      action: run-pod-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: role
            value_match: any

    - name: trigger-rack-generator-update-checksum
      branch_scope: "other_branches"
      node_kind: LocationRack
      mutation_action: "updated"
      action: run-rack-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: checksum
            value_match: any

    - name: trigger-rack-generator-update-index
      branch_scope: "other_branches"
      node_kind: LocationRack
      mutation_action: "updated"
      action: run-rack-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: index
            value_match: any

    - name: trigger-rack-generator-update-rack-type
      branch_scope: "other_branches"
      node_kind: LocationRack
      mutation_action: "updated"
      action: run-rack-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: rack_type
            value_match: any

    - name: trigger-rack-generator-update-mlag
      branch_scope: "other_branches"
      node_kind: LocationRack
      mutation_action: "updated"
      action: run-rack-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: mlag
            value_match: any

    - name: trigger-avd-structured-config-generator-update-avd-hostvars-ready
      branch_scope: "other_branches"
      node_kind: NetworkFabric
      mutation_action: "updated"
      action: run-avd-device-structured-config-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: avd_hostvars_ready
            value: "True"
            value_previous: "False"

    - name: trigger-backfill-structured-config-update-checksum
      branch_scope: "other_branches"
      node_kind: AvdStructuredConfigFile
      mutation_action: "updated"
      action: run-backfill-structured-config-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: checksum
            value_match: any

    - name: trigger-backfill-structured-config-created
      branch_scope: "other_branches"
      node_kind: AvdStructuredConfigFile
      mutation_action: "created"
      action: run-backfill-structured-config-generator

    - name: trigger-server-cabling-generator-created
      branch_scope: "other_branches"
      node_kind: ComputePhysicalServer
      mutation_action: "created"
      action: run-server-cabling-generator

    # ---------------------------------------------------------------- services
    # `other_branches`, never main. A service is requested ON A BRANCH and
    # reviewed as a proposed change; expanding it on main would put the
    # technical objects there with nothing to review.
    #
    # The point is that the branch carries the CONSEQUENCES of the request by
    # the time anyone looks at it. Without these the diff shows a
    # ServiceNetworkSegment and no subnet, no VLAN and no SVI -- which reads as
    # "nothing happened" rather than "not built yet".
    - name: trigger-network-segment-generator-created
      branch_scope: "other_branches"
      node_kind: ServiceNetworkSegment
      mutation_action: "created"
      action: run-network-segment-generator

    - name: trigger-fabric-app-generator-created
      branch_scope: "other_branches"
      node_kind: ServiceFabricApp
      mutation_action: "created"
      action: run-fabric-app-generator

    - name: trigger-tenant-onboarding-generator-created
      branch_scope: "other_branches"
      node_kind: ServiceTenantOnboarding
      mutation_action: "created"
      action: run-tenant-onboarding-generator

    - name: trigger-server-placement-generator-created
      branch_scope: "other_branches"
      node_kind: ServiceServerPlacement
      mutation_action: "created"
      action: run-server-placement-generator

    - name: trigger-fabric-peering-generator-created
      branch_scope: "other_branches"
      node_kind: ServiceFabricPeering
      mutation_action: "created"
      action: run-fabric-peering-generator

    # ServiceAppAccess is now just another service kind. It carried an
    # `approved` Boolean and a second rule watching it, because nothing was
    # composed until someone flipped the field. The branch already decides
    # whether a request reaches a device, so the field is gone and the grant
    # builds on creation like the rest -- the reviewer sees the rule, the
    # service objects and the re-rendered firewall configuration in the
    # proposed change, and merging it is the approval.
    - name: trigger-app-access-generator-created
      branch_scope: "other_branches"
      node_kind: ServiceAppAccess
      mutation_action: "created"
      action: run-app-access-generator

    # ...AND ON UPDATE, which is not symmetry for its own sake. `status` is how
    # every service kind here is withdrawn, and for three cycles nothing watched
    # it: setting `decommissioning` through the UI or the portal fired no
    # generator, so the branch diff showed a status change and none of its
    # consequences -- the exact failure the `created` rules above exist to
    # prevent, arrived at from the other direction. Measured: withdrawing a
    # grant required running `infrahubctl generator generate-app-access` by
    # hand.
    #
    # SCOPED TO THE INPUTS, one rule per field, rather than a bare `updated`.
    # The generator writes back to its own target -- `_set_status` and
    # `_link_granted_rules` -- so an unscoped rule would fire on the
    # generator's own output. `granted_rules` is deliberately absent below for
    # that reason: it is what this generator PRODUCES, and watching it would
    # feed every run straight back into another.
    #
    # The loop terminates even so, because both write-backs are guarded by an
    # equality check: `_set_status` returns before saving when the status
    # already matches, and `_link_granted_rules` saves only when the rule set
    # actually changed. So a creation now costs two runs -- build, then one
    # no-op -- and a withdrawal the same. That is the price of the diff being
    # honest, and it is cheap.
    - name: trigger-app-access-generator-update-status
      branch_scope: "other_branches"
      node_kind: ServiceAppAccess
      mutation_action: "updated"
      action: run-app-access-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: status
            value_match: any

    # Which ports the grant asks for, when it names them rather than letting
    # `advertised_service_ports` derive them from the application's manifests.
    - name: trigger-app-access-generator-update-ports
      branch_scope: "other_branches"
      node_kind: ServiceAppAccess
      mutation_action: "updated"
      action: run-app-access-generator
      matches:
        kind: CoreNodeTriggerAttributeMatch
        data:
          - attribute_name: ports
            value_match: any

    # The destination. Changing the application changes the VIP, the ports and
    # -- through `ServiceFabricApp.vrf` -> `SecurityZone.vrf` -- the zone the
    # rule is written into.
    - name: trigger-app-access-generator-update-application
      branch_scope: "other_branches"
      node_kind: ServiceAppAccess
      mutation_action: "updated"
      action: run-app-access-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: application
            modification_type: updated

    - name: trigger-app-access-generator-update-destination-vip
      branch_scope: "other_branches"
      node_kind: ServiceAppAccess
      mutation_action: "updated"
      action: run-app-access-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: destination_vip
            modification_type: updated

    # The three ways a grant says where the session comes from. A grant naming
    # only a site derives the other two, so all three are inputs.
    - name: trigger-app-access-generator-update-source-site
      branch_scope: "other_branches"
      node_kind: ServiceAppAccess
      mutation_action: "updated"
      action: run-app-access-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: source_site
            modification_type: updated

    - name: trigger-app-access-generator-update-source-zone
      branch_scope: "other_branches"
      node_kind: ServiceAppAccess
      mutation_action: "updated"
      action: run-app-access-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: source_zone
            modification_type: updated

    - name: trigger-app-access-generator-update-source-address
      branch_scope: "other_branches"
      node_kind: ServiceAppAccess
      mutation_action: "updated"
      action: run-app-access-generator
      matches:
        kind: CoreNodeTriggerRelationshipMatch
        data:
          - relationship_name: source_address
            modification_type: updated
