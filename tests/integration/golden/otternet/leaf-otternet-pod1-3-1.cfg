!
no enable password
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$OtternetLab$9OUIc8rD9Tz1nLCqGCVqkB2Jc0hRbMwY0oFA4E4hmrcIUFo7/5n79zdOiNhJDnTnsmVg4t3MAZCcmlrYu6iln1
username avd privilege 15 role network-admin secret sha512 $6$OtternetLab$9OUIc8rD9Tz1nLCqGCVqkB2Jc0hRbMwY0oFA4E4hmrcIUFo7/5n79zdOiNhJDnTnsmVg4t3MAZCcmlrYu6iln1
!
vlan internal order ascending range 1006 1199
!
transceiver qsfp default-mode 4x10G
!
interface defaults
   mtu 9214
!
service routing protocols model multi-agent
!
hostname leaf-otternet-pod1-3-1
ip name-server vrf MGMT 172.20.41.1
dns domain otternet.lab
!
spanning-tree mode mstp
spanning-tree mst 0 priority 4096
!
clock timezone UTC
!
vrf instance APP_PROD
   description Classic bare-metal application tier
!
vrf instance BRANCH
   description Branch office - private circuit, no ISP in path
!
vrf instance K8S_PROD
   description Kubernetes production - Cilium peers BGP from the nodes
!
vrf instance MGMT
!
vrf instance TENANT_ACME
   description acme - isolated cloud instances
!
vrf instance TENANT_GLOBEX
   description globex - isolated cloud instances
!
vrf instance WAN
   description ISP transit - WAN customers
!
management api http-commands
   protocol https
   no protocol http
   no default-services
   no shutdown
   !
   vrf MGMT
      no shutdown
!
aaa authorization exec default local
!
interface Ethernet1
   description P2P_spine-otternet-pod1-1_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.41.255.17/31
!
interface Ethernet2
   description P2P_spine-otternet-pod1-2_Ethernet5
   no shutdown
   mtu 9214
   no switchport
   ip address 10.41.255.19/31
!
interface Ethernet10
   description FW1_ge-0/0/0_ZONE-K8S-PROD
   no shutdown
   no switchport
   vrf K8S_PROD
   ip address 10.250.110.1/30
   ip access-group ACL-FROM-FIREWALL in
   ip access-group ACL-K8S-ANTISPOOF out
!
interface Ethernet11
   description FW1_ge-0/0/1_ZONE-APP-PROD
   no shutdown
   no switchport
   vrf APP_PROD
   ip address 10.250.210.1/30
   ip access-group ACL-FROM-FIREWALL in
!
interface Ethernet12
   description ISP_PE2_WAN_HANDOFF
   no shutdown
   no switchport
   vrf WAN
   ip address 10.250.50.1/30
   ip access-group ACL-FROM-WAN in
!
interface Ethernet13
   description BRANCH_RTR_CIRCUIT
   no shutdown
   no switchport
   vrf BRANCH
   ip address 10.250.70.1/30
   ip access-group ACL-FROM-BRANCH in
!
interface Ethernet14
   description FW1_ZONE-WAN
   no shutdown
   no switchport
   vrf WAN
   ip address 10.250.150.1/30
   ip access-group ACL-FROM-FIREWALL in
!
interface Ethernet15
   description FW1_ZONE-BRANCH
   no shutdown
   no switchport
   vrf BRANCH
   ip address 10.250.170.1/30
   ip access-group ACL-FROM-FIREWALL in
!
interface Ethernet16
   description FW1_ge-0/0/4_ZONE-ACME-CLOUD
   no shutdown
   no switchport
   vrf TENANT_ACME
   ip address 10.250.10.1/30
   ip access-group ACL-FROM-FIREWALL in
!
interface Ethernet17
   description FW1_ge-0/0/5_ZONE-GLOBEX-CLOUD
   no shutdown
   no switchport
   vrf TENANT_GLOBEX
   ip address 10.250.20.1/30
   ip access-group ACL-FROM-FIREWALL in
!
interface Loopback0
   description ROUTER_ID
   no shutdown
   ip address 10.41.0.15/32
!
interface Loopback1
   description VXLAN_TUNNEL_SOURCE
   no shutdown
   ip address 10.41.1.15/32
!
interface Management0
   description OOB_MANAGEMENT
   no shutdown
   vrf MGMT
   ip address 172.20.41.25/24
!
interface Vxlan1
   description leaf-otternet-pod1-3-1_VTEP
   vxlan source-interface Loopback1
   vxlan udp-port 4789
   vxlan vrf APP_PROD vni 210
   vxlan vrf BRANCH vni 70
   vxlan vrf K8S_PROD vni 110
   vxlan vrf TENANT_ACME vni 310
   vxlan vrf TENANT_GLOBEX vni 320
   vxlan vrf WAN vni 50
!
ip virtual-router mac-address 00:1c:73:00:00:99
!
ip access-list ACL-FROM-BRANCH
   10 permit ip 10.70.0.0/24 any
   100 deny ip any any log
!
ip access-list ACL-FROM-FIREWALL
   10 deny ip 10.41.0.0/16 any log
   20 permit ip any any
!
ip access-list ACL-FROM-WAN
   10 permit ip 10.60.0.0/16 any
   100 deny ip any any log
!
ip access-list ACL-K8S-ANTISPOOF
   10 permit ip 10.110.0.0/24 any
   20 permit ip 10.111.0.0/16 any
   30 permit ip 10.112.0.0/16 any
   100 deny ip any any log
!
ip access-list ACL-MGMT-IN
   10 permit ip 172.20.41.0/24 any
   100 deny ip any any log
!
ip routing
ip routing vrf APP_PROD
ip routing vrf BRANCH
ip routing vrf K8S_PROD
no ip routing vrf MGMT
ip routing vrf TENANT_ACME
ip routing vrf TENANT_GLOBEX
ip routing vrf WAN
!
ip prefix-list PL-BRANCH-PERMITTED
   seq 10 permit 10.70.0.0/24
!
ip prefix-list PL-CILIUM-PERMITTED
   seq 10 permit 10.111.0.0/16 le 26
   seq 20 permit 10.112.0.0/16 le 32
!
ip prefix-list PL-DC-ADVERTISED
   seq 10 permit 10.112.240.0/24 le 32
   seq 20 permit 10.220.10.0/24 le 32
   seq 30 permit 10.220.20.0/24 le 32
!
ip prefix-list PL-DC-ADVERTISED-BRANCH
   seq 10 permit 10.112.240.0/24 le 32
   seq 20 permit 10.110.0.0/24
!
ip prefix-list PL-FABRIC-TO-CILIUM
   seq 10 permit 0.0.0.0/0
   seq 20 permit 10.110.0.0/24
!
ip prefix-list PL-LOOPBACKS-EVPN-OVERLAY
   seq 10 permit 10.41.0.0/24 eq 32
   seq 20 permit 10.41.1.0/24 eq 32
!
ip prefix-list PL-WAN-PERMITTED
   seq 10 permit 10.60.0.0/16 le 24
!
ip route vrf APP_PROD 0.0.0.0/0 10.250.210.2
ip route vrf BRANCH 10.110.0.0/24 10.250.170.2
ip route vrf BRANCH 10.112.240.0/24 10.250.170.2
ip route vrf K8S_PROD 0.0.0.0/0 10.250.110.2
ip route vrf MGMT 0.0.0.0/0 172.20.41.1
ip route vrf TENANT_ACME 0.0.0.0/0 10.250.10.2
ip route vrf TENANT_GLOBEX 0.0.0.0/0 10.250.20.2
ip route vrf WAN 10.112.240.0/24 10.250.150.2
ip route vrf WAN 10.220.10.0/24 10.250.150.2
ip route vrf WAN 10.220.20.0/24 10.250.150.2
!
ntp server vrf MGMT 172.20.41.1 prefer iburst
!
route-map RM-BRANCH-IN permit 10
   description Accept only the branch LAN
   match ip address prefix-list PL-BRANCH-PERMITTED
   set community 65103:70 additive
!
route-map RM-BRANCH-IN deny 99
   description Explicit deny
!
route-map RM-CILIUM-IN permit 10
   description Accept only sanctioned pod and service CIDRs
   match ip address prefix-list PL-CILIUM-PERMITTED
   set community 65101:110 additive
!
route-map RM-CILIUM-IN deny 99
   description Explicit deny - anything else is a policy violation
!
route-map RM-CONN-2-BGP permit 10
   match ip address prefix-list PL-LOOPBACKS-EVPN-OVERLAY
!
route-map RM-DC-TO-BRANCH permit 10
   description Advertise DC services and the node subnet to our own office
   match ip address prefix-list PL-DC-ADVERTISED-BRANCH
!
route-map RM-DC-TO-BRANCH deny 99
   description Explicit deny - still no pod CIDR, still no app tenant
!
route-map RM-DC-TO-EXTERNAL permit 10
   description Advertise the DC service VIP range only
   match ip address prefix-list PL-DC-ADVERTISED
!
route-map RM-DC-TO-EXTERNAL deny 99
   description Explicit deny - do not leak DC internals to the outside
!
route-map RM-FABRIC-TO-CILIUM permit 10
   description Default route and node subnet only
   match ip address prefix-list PL-FABRIC-TO-CILIUM
!
route-map RM-FABRIC-TO-CILIUM deny 99
!
route-map RM-WAN-IN permit 10
   description Accept only assigned customer supernets
   match ip address prefix-list PL-WAN-PERMITTED
   set community 65103:50 additive
!
route-map RM-WAN-IN deny 99
   description Explicit deny - the provider announced something it should not
!
router bfd
   multihop interval 300 min-rx 300 multiplier 3
!
router bgp 65103
   router-id 10.41.0.15
   update wait-install
   no bgp default ipv4-unicast
   graceful-restart restart-time 300
   graceful-restart
   maximum-paths 4
   no bgp default ipv4-unicast
   distance bgp 20 200 200
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS bfd
   neighbor EVPN-OVERLAY-PEERS ebgp-multihop 3
   neighbor EVPN-OVERLAY-PEERS password 7 2NHils94onK6nE2MMNWijxxOsOCeCOFQ
   neighbor EVPN-OVERLAY-PEERS send-community
   neighbor EVPN-OVERLAY-PEERS maximum-routes 0
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS password 7 87RLGnboZoKej7hS1nQ1gmvCbOzSvXef
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor IPv4-UNDERLAY-PEERS maximum-routes 256000
   neighbor 10.41.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.41.0.1 remote-as 65100
   neighbor 10.41.0.1 description spine-otternet-pod1-1_Loopback0
   neighbor 10.41.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.41.0.2 remote-as 65100
   neighbor 10.41.0.2 description spine-otternet-pod1-2_Loopback0
   neighbor 10.41.255.16 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.41.255.16 remote-as 65100
   neighbor 10.41.255.16 description spine-otternet-pod1-1_Ethernet5
   neighbor 10.41.255.18 peer group IPv4-UNDERLAY-PEERS
   neighbor 10.41.255.18 remote-as 65100
