---
extends: default

ignore: |
  /.git
  /.github
  /.venv
  # The lab's AVD toolchain virtualenv and collections (`make -C lab setup`).
  /lab/.venv
  /lab/.ansible
  # Rendered by lab/wan/render.py; gitignored.
  /lab/wan/rendered
  /.specify
  /node_modules
  # Backstage scaffolding. Vendored from the upstream portal example and
  # regenerated by its own tooling, so it follows Backstage's conventions
  # rather than this repository's -- linting it would report defects nobody
  # here should fix by hand.
  /backstage
  /docs/node_modules
  # Third-party Vale style packages, fetched by `vale sync` and git-ignored.
  /.vale
  # Generated by pnpm. Tracked for reproducible builds, but not hand-edited.
  /docs/pnpm-lock.yaml
  # Rendered by arista.avd.eos_designs; AVD's emitter does not indent sequences.
  /lab/avd/intended
  # ContainerLab runtime state; generated on deploy and git-ignored.
  /lab/clab-*
  # The k3s kubeconfigs, written at deploy time and git-ignored. yamllint does
  # not read .gitignore, so without this `invoke lint` fails on any host with
  # the lab up.
  /lab/k8s/.kubeconfig
  /lab/k8s/.kubeconfig-tooling
  # Local git worktrees. Excluded through .git/info/exclude rather than
  # .gitignore, so they are invisible to git and visible to yamllint -- which
  # made `invoke lint` fail on hundreds of findings in files nobody here wrote.
  /.emdash
  # Agent worktrees. Each carries its own copy of the whole repository,
  # including lab/avd/intended -- and the ignore above is anchored, so it does
  # not cover a nested copy. One stray worktree put 623 errors in front of
  # every `invoke lint-yaml` run until cycle 026 removed it; this is what stops
  # the next one doing the same. yamllint does not read .gitignore, so being
  # git-excluded is not enough.
  /.claude

rules:
  new-lines: disable
  comments-indentation: disable
  truthy:
    # GitHub Actions uses `on:` as a mapping key, which the default rule reads as
    # the boolean `on`. Set independently of the ignore list below so any YAML
    # outside .github is covered too.
    check-keys: false
  comments:
    # Changed this to stop a mess between linters from Prettier (vscode) to yamllint
    # See https://github.com/prettier/prettier/pull/10926 or https://github.com/redhat-developer/vscode-yaml/issues/433
    min-spaces-from-content: 1
  line-length:
    max: 140
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: false
    ignore: |
      # One Go-template line inside a block scalar. A yamllint directive there
      # would become part of the template, and wrapping it changes the template.
      /lab/crossplane/apps/01-composition-fabric-app.yaml
