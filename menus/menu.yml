# yaml-language-server:
#   $schema=https://schema.infrahub.app/infrahub/menu/latest.json
#
# Register this file in .infrahub.yml:
#
#   menus:
#     - menus/menu.yml
#
# THE RULE: a kind named here must not also be listed by Infrahub's own
# auto-generated menu, or it appears in the sidebar twice -- once here and
# once at the bottom, at weight 5000 or under "Other". There are two ways to
# satisfy it, and which one applies depends on who owns the schema file:
#
#   1. Schemas authored in this repository set `include_in_menu: false` on
#      every kind listed here. That is the normal case.
#   2. Marketplace schemas (`security/security.yml`, `circuit/circuit.yml`,
#      `tenancy/tenancy.yml`; see schemas/MARKETPLACE.md) are kept
#      byte-identical to the published version and ship with
#      `include_in_menu: true`, and a node extension cannot change the flag.
#      For those kinds the entry's `namespace` + `name` IS the kind --
#      `Security` + `Firewall` for `SecurityFirewall` -- because Infrahub
#      skips the auto-generated entry for a kind whose identifier is already
#      in the menu. Renaming one of those entries brings the duplicate back.
#
# tests/unit/test_service_layer_menu_contract.py asserts both halves, and that
# every kind with `include_in_menu: false` and seed data is reachable here or
# through a parent object.
#
# Seven top-level sections:
#
#   1. Service Requests: what somebody asks for.
#   2. Data Center: locations, tenants, the switches and servers, their
#      interfaces and cabling, and whether each device runs its intended
#      configuration.
#   3. Backbone: the WAN routers, circuits and their routing.
#   4. Security: the firewall.
#   5. Arista AVD: the EVPN overlay, VRF services and design data the AVD
#      pipeline reads, and the files it writes.
#   6. Compute Services: Kubernetes and monitoring.
#   7. IPAM: Infrahub's built-in section. The entries at the end of this file
#      attach to it with `parent: [Builtin, IPAM]` instead of declaring a
#      second "IPAM" heading.
#
# Top-level `order_weight` is explicit because Infrahub otherwise gives every
# top-level item the same weight; children are weighted by their position in
# this file. All weights stay below 9500, where Infrahub's built-in IPAM
# section sits.
#
# Renaming or removing an entry leaves the old CoreMenuItem in the database --
# `menu load` and the repository import only upsert. `uv run invoke
# load-menu` prunes entries this file no longer declares.
#
# Moving an existing entry under a different group needs `uv run invoke
# load-menu --reset`. Infrahub attaches menu children in creation order, so an
# older item moved under a newer group is dropped from the sidebar without an
# error. `--reset` deletes every menu item this repository owns and loads the
# file again, so the creation order matches the file.
---
apiVersion: infrahub.app/v1
kind: Menu
spec:
  data:
    # --------- Service Requests ---------
    # What somebody asks for. Every kind here inherits ServiceGeneric, is
    # requested through the portal on a branch, and is built by a generator
    # into the technical objects in the sections below. The catalogue comes
    # first because an application request picks one of its entries.
    - namespace: Service
      name: ServiceMenu
      label: Service Requests
      icon: "mdi:clipboard-text-outline"
      order_weight: 1000
      children:
        data:
          - namespace: Service
            name: ApplicationDefinitionCatalogue
            label: Application Catalogue
            kind: ServiceApplicationDefinition
            icon: "mdi:store-outline"

          - namespace: Service
            name: FabricAppServices
            label: Applications
            kind: ServiceFabricApp
            icon: "mdi:apps"

          - namespace: Service
            name: AppAccessServices
            label: Application Access
            kind: ServiceAppAccess
            icon: "mdi:key-chain"

          - namespace: Service
            name: TenantOnboardingServices
            label: Tenant Onboarding
            kind: ServiceTenantOnboarding
            icon: "mdi:account-plus"

          - namespace: Service
            name: NetworkSegmentServices
            label: Network Segments
            kind: ServiceNetworkSegment
            icon: "mdi:lan"

          - namespace: Service
            name: ServerPlacementServices
            label: Server Placements
            kind: ServiceServerPlacement
            icon: "mdi:server-plus"

          - namespace: Service
            name: FabricPeeringServices
            label: Cluster Peering
            kind: ServiceFabricPeering
            icon: "mdi:handshake"

          - namespace: Service
            name: L3vpnServices
            label: WAN L3VPNs
            kind: ServiceL3vpn
            icon: "mdi:vpn"

          - namespace: Service
            name: TenantCloudServices
            label: Tenant Clouds
            kind: ServiceTenantCloud
            icon: "mdi:cloud-lock"

    # --------- Data Center ---------
    # Where things are and what is in them: locations, tenants, the fabric's
    # switches and servers, their interfaces and cabling, and whether each
    # device runs its intended configuration.
    - namespace: Network
      name: FabricMenu
      label: Data Center
      icon: "mdi:lan"
      order_weight: 1500
      children:
        data:
          - namespace: Location
            name: LocationsMenu
            label: Locations
            icon: "mdi:map-marker-radius"
            children:
              data:
                - namespace: Location
                  name: Site
                  label: Sites
                  kind: LocationSite
                  icon: "mdi:map-marker-radius"

                - namespace: Location
                  name: Hall
                  label: Data Centre Halls
                  kind: LocationHall
                  icon: "mdi:office-building"

                - namespace: Location
                  name: Rack
                  label: Racks
                  kind: LocationRack
                  icon: "mdi:server-network"

                # Tags are what a segment request names to say which racks it
                # lands on, so they sit with the racks.
                - namespace: Avd
                  name: AvdTags
                  label: Rack Tags
                  kind: AvdTag
                  icon: "mdi:tag-outline"

          - namespace: Organization
            name: Tenant
            label: Tenants
            kind: OrganizationTenant
            icon: "mdi:account-tie"

          - namespace: Network
            name: Fabric
            label: Fabrics
            kind: NetworkFabric
            icon: "mdi:lan"

          - namespace: Network
            name: Pod
            label: Pods
            kind: NetworkPod
            icon: "mdi:hexagon-multiple"

          # One entry per CONCRETE device kind, each in the section of the
          # system it belongs to: switches and servers here, routers under
          # Backbone, the firewall under Security. DcimGenericDevice is a generic
          # with `include_in_menu: false`, and no entry in this file names a
          # generic.
          - namespace: Dcim
            name: FabricSwitches
            label: Switches
            kind: DcimFabricSwitch
            icon: "mdi:switch"

          - namespace: Compute
            name: PhysicalServers
            label: Servers
            kind: ComputePhysicalServer
            icon: "mdi:server"

          - namespace: Mlag
            name: MlagDomains
            label: MLAG Domains
            kind: MlagDomain
            icon: "mdi:link-variant"

          - namespace: Interface
            name: InterfacesMenu
            label: Interfaces
            icon: "mdi:ethernet"
            children:
              data:
                - namespace: Interface
                  name: PhysicalInterfaces
                  label: Physical Interfaces
                  kind: InterfacePhysical
                  icon: "mdi:ethernet"

                - namespace: Interface
                  name: VirtualInterfaces
                  label: Virtual Interfaces
                  kind: InterfaceVirtual
                  icon: "mdi:lan-pending"

                - namespace: Interface
                  name: LagInterfaces
                  label: LAG Interfaces
                  kind: InterfaceLag
                  icon: "mdi:drag-horizontal-variant"

                - namespace: Mlag
                  name: MlagInterfaces
                  label: MLAG Interfaces
                  kind: MlagInterface
                  icon: "mdi:link-variant"

          - namespace: Network
            name: Connections
            label: Connections
            kind: NetworkLink
            icon: "mdi:cable-data"


          - namespace: Dcim
            name: TypesAndModelsMenu
            label: Device Catalogue
            icon: "mdi:package-variant"
            children:
              data:
                - namespace: Organization
                  name: Manufacturers
                  label: Manufacturers
                  kind: OrganizationManufacturer
                  icon: "mdi:factory"

                - namespace: Dcim
                  name: DeviceTypes
                  label: Device Types
                  kind: DcimDeviceType
                  icon: "mdi:package-variant"

                - namespace: Dcim
                  name: Platforms
                  label: Platforms
                  kind: DcimPlatform
                  icon: "mdi:chip"

          # Whether intent reached the devices. One DeploymentState record covers
          # each device with a rendered configuration, across all four device
          # kinds; its diff file is reached through the record. There is no
          # CloudVision Workspaces entry: this lab has no CloudVision and
          # `cv-config-validation` is not registered (.infrahub.yml), so the list
          # would always be empty.
          - namespace: Deployment
            name: DeploymentState
            label: Device Sync State
            kind: DeploymentState
            icon: "mdi:cloud-check-outline"

    # --------- Backbone ---------
    # The provider network outside the fabric: SR Linux routers, the circuits
    # between them, how each customer site attaches, and their routing.
    - namespace: Wan
      name: WanMenu
      label: Backbone
      icon: "mdi:wan"
      order_weight: 2000
      children:
        data:
          - namespace: Dcim
            name: Routers
            label: Routers
            kind: DcimDevice
            icon: "mdi:router"

          - namespace: Wan
            name: WanSites
            label: Site Attachments
            kind: WanSite
            icon: "mdi:office-building-marker"

          - namespace: Dcim
            name: Circuit
            label: Circuits
            kind: DcimCircuit
            icon: "mdi:cable-data"

          - namespace: Dcim
            name: CircuitEndpoint
            label: Circuit Endpoints
            kind: DcimCircuitEndpoint
            icon: "mdi:connection"

          - namespace: Wan
            name: WanInternetPeerings
            label: Internet Peerings
            kind: WanInternetPeering
            icon: "mdi:web"

          - namespace: Organization
            name: Providers
            label: Providers
            kind: OrganizationProvider
            icon: "mdi:domain"

          # The WAN routers' and the firewall's own BGP sessions and routes, and
          # the ASN pool every system draws from. The fabric's VRF services are
          # under Arista AVD.
          - namespace: Routing
            name: RoutingMenu
            label: Routing
            icon: "mdi:routes"
            children:
              data:
                - namespace: Routing
                  name: Asn
                  label: BGP ASNs
                  kind: RoutingAsn
                  icon: "mdi:numeric"

                - namespace: Routing
                  name: BGPPeerGroup
                  label: BGP Peer Groups
                  kind: RoutingBGPPeerGroup
                  icon: "mdi:account-multiple"

                - namespace: Routing
                  name: BGPNeighbor
                  label: BGP Neighbors
                  kind: RoutingBGPNeighbor
                  icon: "mdi:connection"

                - namespace: Routing
                  name: PrefixList
                  label: Prefix Lists
                  kind: RoutingPrefixList
                  icon: "mdi:format-list-bulleted"

                - namespace: Routing
                  name: RouteMap
                  label: Route Maps
                  kind: RoutingRouteMap
                  icon: "mdi:map-outline"

                - namespace: Routing
                  name: StaticRoute
                  label: Static Routes
                  kind: RoutingStaticRoute
                  icon: "mdi:routes"

    # --------- Security ---------
    # What exists on fw1. Every entry naming a marketplace kind keeps
    # namespace + name equal to the kind -- see the header.
    - namespace: Security
      name: SecurityMenu
      label: Security
      icon: "mdi:security"
      order_weight: 2500
      children:
        data:
          - namespace: Security
            name: Firewall
            label: Firewalls
            kind: SecurityFirewall
            icon: "mdi:wall-fire"

          - namespace: Security
            name: FirewallInterfaces
            label: Firewall Interfaces
            kind: SecurityFirewallInterface
            icon: "mdi:ethernet"

          - namespace: Security
            name: Zone
            label: Zones
            kind: SecurityZone
            icon: "mdi:shield-half-full"

          - namespace: Security
            name: Policy
            label: Policies
            kind: SecurityPolicy
            icon: "mdi:shield-check"

          - namespace: Security
            name: PolicyRule
            label: Policy Rules
            kind: SecurityPolicyRule
            icon: "mdi:format-list-checks"

          - namespace: Security
            name: AddressBookMenu
            label: Address Book
            icon: "mdi:book-open-variant"
            children:
              data:
                - namespace: Security
                  name: IPAddress
                  label: Host Addresses
                  kind: SecurityIPAddress
                  icon: "mdi:ip-outline"

                - namespace: Security
                  name: Prefix
                  label: Prefixes
                  kind: SecurityPrefix
                  icon: "mdi:ip-network-outline"

                - namespace: Security
                  name: IPRange
                  label: Address Ranges
                  kind: SecurityIPRange
                  icon: "mdi:arrow-expand-horizontal"

                - namespace: Security
                  name: FQDN
                  label: FQDNs
                  kind: SecurityFQDN
                  icon: "mdi:dns"

                - namespace: Security
                  name: IPAMIPAddress
                  label: IPAM-linked Addresses
                  kind: SecurityIPAMIPAddress
                  icon: "mdi:link"

                - namespace: Security
                  name: IPAMIPPrefix
                  label: IPAM-linked Prefixes
                  kind: SecurityIPAMIPPrefix
                  icon: "mdi:link"

                - namespace: Security
                  name: AddressGroup
                  label: Address Groups
                  kind: SecurityAddressGroup
                  icon: "mdi:folder-network"

          # Junos calls these "applications". Labelled "Service Objects" so
          # the sidebar does not offer two different things called
          # Applications.
          - namespace: Security
            name: ServiceObjectsMenu
            label: Service Objects
            icon: "mdi:format-list-numbered"
            children:
              data:
                - namespace: Security
                  name: Service
                  label: Ports
                  kind: SecurityService
                  icon: "mdi:numeric"

                - namespace: Security
                  name: ServiceRange
                  label: Port Ranges
                  kind: SecurityServiceRange
                  icon: "mdi:arrow-expand-horizontal"

                - namespace: Security
                  name: IPProtocol
                  label: IP Protocols
                  kind: SecurityIPProtocol
                  icon: "mdi:protocol"

                - namespace: Security
                  name: ServiceGroup
                  label: Service Groups
                  kind: SecurityServiceGroup
                  icon: "mdi:folder-multiple"

    # --------- Arista AVD ---------
    # What the AVD pipeline reads and writes: the EVPN overlay, the VRF
    # services, the design data, and the generated files.
    - namespace: Avd
      name: DesignMenu
      label: Arista AVD
      icon: "mdi:cog-transfer"
      order_weight: 3000
      children:
        data:
          - namespace: Evpn
            name: EvpnMenu
            label: EVPN
            icon: "mdi:cloud-outline"
            children:
              data:
                - namespace: Evpn
                  name: Tenants
                  label: EVPN Tenants
                  kind: EvpnTenant
                  icon: "mdi:account-group"

                # Gateway groups are reached from a domain's relationship
                # view, deliberately (see docs/docs/developer-guide/schemas.md).
                - namespace: Evpn
                  name: Domains
                  label: Domains
                  kind: EvpnDomain
                  icon: "mdi:domain"

                - namespace: Evpn
                  name: L2VLANs
                  label: L2 VLANs
                  kind: EvpnL2Vlan
                  icon: "mdi:tag-multiple"

                - namespace: Evpn
                  name: SVIs
                  label: SVIs
                  kind: EvpnSvi
                  icon: "mdi:lan-connect"

                - namespace: Evpn
                  name: SviNodes
                  label: SVI Node Addresses
                  kind: EvpnSviNode
                  icon: "mdi:ip-outline"

          # AVD inputs: authored here and rendered into the fabric's
          # configuration.
          - namespace: Routing
            name: VrfServicesMenu
            label: VRF Services
            icon: "mdi:routes-clock"
            children:
              data:
                - namespace: Routing
                  name: VrfL3Interface
                  label: VRF L3 Interfaces
                  kind: RoutingVrfL3Interface
                  icon: "mdi:ethernet"

                - namespace: Routing
                  name: VrfStaticRoute
                  label: VRF Static Routes
                  kind: RoutingVrfStaticRoute
                  icon: "mdi:routes-clock"

                - namespace: Routing
                  name: VrfBgpPeer
                  label: VRF BGP Peers
                  kind: RoutingVrfBgpPeer
                  icon: "mdi:vector-polyline"

          - namespace: Network
            name: DeviceDesignsMenu
            label: Device Designs
            icon: "mdi:pencil-ruler"
            children:
              data:
                - namespace: Network
                  name: FabricDeviceDesigns
                  label: Fabric Device Designs
                  kind: NetworkFabricDeviceDesign
                  icon: "mdi:pencil-ruler"

                - namespace: Network
                  name: PodDeviceDesigns
                  label: Pod Device Designs
                  kind: NetworkPodDeviceDesign
                  icon: "mdi:pencil-ruler"

                - namespace: Network
                  name: RackDeviceDesigns
                  label: Rack Device Designs
                  kind: NetworkRackDeviceDesign
                  icon: "mdi:pencil-ruler"

          - namespace: Network
            name: SpanningTreePriorities
            label: Spanning Tree Priorities
            kind: NetworkSpanningTreePriority
            icon: "mdi:family-tree"

          - namespace: Avd
            name: AvdEvpn
            label: AVD EVPN Settings
            kind: AvdEvpn
            icon: "mdi:cog"

          - namespace: Network
            name: ManagementMenu
            label: Management Services
            icon: "mdi:shield-account"
            children:
              data:
                - namespace: Network
                  name: DnsServers
                  label: DNS Servers
                  kind: NetworkDnsServer
                  icon: "mdi:dns"

                - namespace: Network
                  name: NtpServers
                  label: NTP Servers
                  kind: NetworkNtpServer
                  icon: "mdi:clock-outline"

                - namespace: Network
                  name: LocalUsers
                  label: Local Users
                  kind: NetworkLocalUser
                  icon: "mdi:account-key"

          # Written by the AVD generators, never by hand. Listed so a
          # pipeline can be debugged without hunting for a UUID.
          - namespace: Avd
            name: GeneratedMenu
            label: Generated AVD Data
            icon: "mdi:file-cog-outline"
            children:
              data:
                - namespace: Avd
                  name: Artifacts
                  label: AVD Artifacts
                  kind: AvdArtifact
                  icon: "mdi:file-document-outline"

                - namespace: Avd
                  name: HostvarFiles
                  label: Hostvar Files
                  kind: AvdHostvarFile
                  icon: "mdi:file-code-outline"

                - namespace: Avd
                  name: StructuredConfigFiles
                  label: Structured Config Files
                  kind: AvdStructuredConfigFile
                  icon: "mdi:file-tree-outline"

    # --------- Compute Services ---------
    - namespace: Cluster
      name: ClusterMenu
      label: Compute Services
      icon: "mdi:kubernetes"
      order_weight: 3500
      children:
        data:
          - namespace: Cluster
            name: KubernetesMenu
            label: Kubernetes
            icon: "mdi:kubernetes"
            children:
              data:
                - namespace: Cluster
                  name: KubernetesClusters
                  label: Clusters
                  kind: ClusterKubernetes
                  icon: "mdi:kubernetes"

                # The BGP sessions a Cluster Peering request built. Created by the
                # generator, not by hand.
                - namespace: Cluster
                  name: FabricPeerings
                  label: Fabric Peerings
                  kind: ClusterFabricPeering
                  icon: "mdi:handshake-outline"

          # What is watched, as intent (cycle 034). A profile names device groups
          # and measurements; the collector's whole configuration is the artifact
          # rendered from them. Edit here, review in a proposed change -- never in
          # the collector.
          - namespace: Monitoring
            name: MonitoringMenu
            label: Monitoring
            icon: "mdi:chart-line"
            children:
              data:
                - namespace: Monitoring
                  name: Profiles
                  label: Profiles
                  kind: MonitoringProfile
                  icon: "mdi:tune"

                - namespace: Monitoring
                  name: Measurements
                  label: Measurements
                  kind: MonitoringMeasurement
                  icon: "mdi:gauge"

                - namespace: Monitoring
                  name: Collectors
                  label: Collectors
                  kind: MonitoringCollector
                  icon: "mdi:chart-line"

    # --------- IPAM ---------
    # Attached to Infrahub's built-in IPAM section rather than declared as a
    # second "IPAM" heading. The section is shown because IpamPrefix and
    # IpamIPAddress inherit BuiltinIPPrefix and BuiltinIPAddress, and its own
    # "IP Prefixes" and "IP Addresses" entries list those two kinds, so this
    # file does not list them again.
    - namespace: Ipam
      name: VRFs
      label: VRFs
      kind: IpamVRF
      icon: "mdi:table-network"
      parent: [Builtin, IPAM]

    - namespace: Ipam
      name: RouteTargets
      label: Route Targets
      kind: IpamRouteTarget
      icon: "mdi:bullseye-arrow"
      parent: [Builtin, IPAM]

    - namespace: Ipam
      name: L2Domains
      label: L2 Domains
      kind: IpamL2Domain
      icon: "mdi:vector-square"
      parent: [Builtin, IPAM]

    - namespace: Ipam
      name: VLANs
      label: VLANs
      kind: IpamVLAN
      icon: "mdi:tag-outline"
      parent: [Builtin, IPAM]
