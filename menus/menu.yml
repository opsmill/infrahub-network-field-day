# yaml-language-server:
#   $schema=https://schema.infrahub.app/infrahub/menu/latest.json
#
# Register this file in .infrahub.yml:
#
#   menus:
#     - menus/menu.yml
#
# To prevent duplicate menu entries, set
# include_in_menu: false on schema nodes that
# appear in this menu.
---
apiVersion: infrahub.app/v1
kind: Menu
spec:
  data:
    # --------- Fabric Design ---------
    - namespace: Network
      name: FabricDesignMenu
      label: Fabric Design
      icon: "mdi:lan"
      children:
        data:
          - namespace: Network
            name: Fabric
            label: Fabrics
            kind: NetworkFabric
            icon: "mdi:lan"

          - namespace: Network
            name: Pod
            label: Pods
            kind: NetworkPod
            icon: "mdi:hexagon-multiple"

          - namespace: Avd
            name: AvdEvpn
            label: AVD Configuration
            kind: AvdEvpn
            icon: "mdi:cog-transfer"

          - namespace: Avd
            name: AvdArtifacts
            label: AVD Artifacts
            kind: AvdArtifact
            icon: "mdi:file-document-outline"

          - namespace: Avd
            name: AvdTags
            label: AVD Tags
            kind: AvdTag
            icon: "mdi:tag-outline"

    # --------- Devices ---------
    - namespace: Dcim
      name: DeviceMenu
      label: Devices
      icon: "mdi:server"
      children:
        data:
          # One entry per CONCRETE kind, since cycle 027 split DcimDevice.
          #
          # An earlier attempt pointed a single "All Devices" item at
          # DcimGenericDevice, reasoning that the generic lists every kind at
          # once. That was wrong twice over: the generic carries
          # `include_in_menu: false`, and no other item in this file -- out of
          # roughly sixty -- names a generic. ComputePhysicalServer and
          # SecurityFirewall already have their own concrete entries further
          # down, so per-kind is the convention here. It also left the WAN's
          # routers with no menu entry at all.
          - namespace: Dcim
            name: FabricSwitches
            label: Fabric Switches
            kind: DcimFabricSwitch
            icon: "clarity:network-switch-solid"

          - namespace: Dcim
            name: Routers
            label: Routers
            kind: DcimDevice
            icon: "mdi:router"

          # Deployment state sits with the devices rather than in its own
          # top-level group, because it is a per-device fact and this is where
          # somebody asking "did my merge reach this switch?" looks first.
          #
          # It is the one entry here that is NOT per concrete kind: one record
          # covers every device with a rendered configuration artifact, across
          # all four device kinds. That is deliberate -- a device either matches
          # its intent or it does not, and which kind it is does not change the
          # question.
          - namespace: Deployment
            name: DeploymentState
            label: Deployment State
            kind: DeploymentState
            icon: "mdi:cloud-check-outline"

          - namespace: Interface
            name: InterfacesMenu
            label: Interfaces
            icon: "mdi:ethernet"
            children:
              data:
                - namespace: Interface
                  name: PhysicalInterfaces
                  label: Physical Interfaces
                  kind: InterfacePhysical
                  icon: "mdi:ethernet"

                - namespace: Interface
                  name: VirtualInterfaces
                  label: Virtual Interfaces
                  kind: InterfaceVirtual
                  icon: "mdi:lan-pending"

                - namespace: Interface
                  name: LagInterfaces
                  label: LAG Interfaces
                  kind: InterfaceLag
                  icon: "mdi:drag-horizontal-variant"

          - namespace: Mlag
            name: MlagDomains
            label: MLAG Domains
            kind: MlagDomain
            icon: "mdi:link-variant"

          - namespace: Network
            name: Connections
            label: Connections
            kind: NetworkLink
            icon: "mdi:cable-data"

          - namespace: Dcim
            name: TypesAndModelsMenu
            label: Types & Models
            icon: "mdi:package-variant"
            children:
              data:
                - namespace: Dcim
                  name: DeviceTypes
                  label: Device Types
                  kind: DcimDeviceType
                  icon: "mdi:package-variant"

                - namespace: Dcim
                  name: Platforms
                  label: Platforms
                  kind: DcimPlatform
                  icon: "mdi:chip"

                - namespace: Organization
                  name: Manufacturers
                  label: Manufacturers
                  kind: OrganizationManufacturer
                  icon: "mdi:factory"

    # --------- IPAM ---------
    - namespace: Ipam
      name: IpamMenu
      label: IPAM
      icon: "mdi:ip-network"
      children:
        data:
          - namespace: Ipam
            name: Prefixes
            label: Prefixes
            kind: IpamPrefix
            icon: "mdi:ip-network"

          - namespace: Ipam
            name: IPAddresses
            label: IP Addresses
            kind: IpamIPAddress
            icon: "mdi:ip"

          - namespace: Ipam
            name: VLANs
            label: VLANs
            kind: IpamVLAN
            icon: "mdi:tag-outline"

          - namespace: Ipam
            name: L2Domains
            label: L2 Domains
            kind: IpamL2Domain
            icon: "mdi:vector-square"

          - namespace: Ipam
            name: VRFs
            label: VRFs
            kind: IpamVRF
            icon: "mdi:table-network"

          - namespace: Ipam
            name: RouteTargets
            label: Route Targets
            kind: IpamRouteTarget
            icon: "mdi:bullseye-arrow"

    # --------- Routing ---------
    - namespace: Routing
      name: RoutingMenu
      label: Routing
      icon: "mdi:router"
      children:
        data:
          - namespace: Routing
            name: Asn
            label: Autonomous Systems
            kind: RoutingAsn
            icon: "mdi:numeric"

          - namespace: Routing
            name: BGPPeerGroup
            label: BGP Peer Groups
            kind: RoutingBGPPeerGroup
            icon: "mdi:router"

          - namespace: Routing
            name: BGPNeighbor
            label: BGP Neighbors
            kind: RoutingBGPNeighbor
            icon: "mdi:connection"

          - namespace: Routing
            name: PrefixList
            label: Prefix Lists
            kind: RoutingPrefixList
            icon: "mdi:format-list-bulleted"

          - namespace: Routing
            name: RouteMap
            label: Route Maps
            kind: RoutingRouteMap
            icon: "mdi:map-outline"

          - namespace: Routing
            name: StaticRoute
            label: Static Routes
            kind: RoutingStaticRoute
            icon: "mdi:routes"

          # The three VRF-scoped services below are AVD *inputs* -- authored
          # here and rendered into config -- unlike the four above, which the
          # backfill generator reconciles from what AVD derived.
          - namespace: Routing
            name: VrfStaticRoute
            label: VRF Static Routes
            kind: RoutingVrfStaticRoute
            icon: "mdi:routes-clock"

          - namespace: Routing
            name: VrfBgpPeer
            label: VRF BGP Peers
            kind: RoutingVrfBgpPeer
            icon: "mdi:vector-polyline"

          - namespace: Routing
            name: VrfL3Interface
            label: VRF L3 Interfaces
            kind: RoutingVrfL3Interface
            icon: "mdi:ethernet"

    # --------- EVPN Services ---------
    - namespace: Evpn
      name: EvpnMenu
      label: EVPN Services
      icon: "mdi:cloud-outline"
      children:
        data:
          - namespace: Evpn
            name: Tenants
            label: Tenants
            kind: EvpnTenant
            icon: "mdi:account-group"

          - namespace: Evpn
            name: SVIs
            label: SVIs
            kind: EvpnSvi
            icon: "mdi:lan-connect"

          - namespace: Evpn
            name: SviNodes
            label: SVI Node Addresses
            kind: EvpnSviNode
            icon: "mdi:ip-outline"

          - namespace: Evpn
            name: L2VLANs
            label: L2 VLANs
            kind: EvpnL2Vlan
            icon: "mdi:tag-multiple"

          - namespace: Evpn
            name: Domains
            label: Domains
            kind: EvpnDomain
            icon: "mdi:domain"

    # --------- Locations ---------
    - namespace: Location
      name: LocationMenu
      label: Locations
      icon: "mdi:map-marker"
      children:
        data:
          - namespace: Location
            name: Site
            label: Sites
            kind: LocationSite
            icon: "mdi:map-marker-radius"

          - namespace: Location
            name: Hall
            label: Halls
            kind: LocationHall
            icon: "mdi:office-building"

          - namespace: Location
            name: Rack
            label: Racks
            kind: LocationRack
            icon: "mdi:server-network"

          - namespace: Organization
            name: Providers
            label: Providers
            kind: OrganizationProvider
            icon: "mdi:handshake"

    # --------- Compute ---------
    - namespace: Compute
      name: ComputeMenu
      label: Compute
      icon: "mdi:chip"
      children:
        data:
          - namespace: Compute
            name: PhysicalServers
            label: Physical Servers
            kind: ComputePhysicalServer
            icon: "mdi:server"

          - namespace: Virtualization
            name: VirtualMachines
            label: Virtual Machines
            kind: VirtualizationVirtualMachine
            icon: "mdi:monitor-dashboard"

    # --------- Management ---------
    - namespace: Network
      name: ManagementMenu
      label: Management
      icon: "mdi:shield-lock"
      children:
        data:
          - namespace: Network
            name: DnsServers
            label: DNS Servers
            kind: NetworkDnsServer
            icon: "mdi:dns"

          - namespace: Network
            name: NtpServers
            label: NTP Servers
            kind: NetworkNtpServer
            icon: "mdi:clock-outline"

          - namespace: Network
            name: LocalUsers
            label: Local Users
            kind: NetworkLocalUser
            icon: "mdi:account-key"

    # --------- Services ---------
    # FR-065: the service layer gets its own top-level grouping, so the UI
    # reflects the two-layer split the schema enforces structurally. These are
    # ordered intent -- what somebody asked for -- and every one of them
    # inherits ServiceGeneric.
    - namespace: Service
      name: ServiceMenu
      label: Services
      icon: "mdi:clipboard-text-outline"
      children:
        data:
          - namespace: Service
            name: FabricPeeringServices
            label: Fabric Peering
            kind: ServiceFabricPeering
            icon: "mdi:handshake"

          - namespace: Service
            name: NetworkSegmentServices
            label: Network Segments
            kind: ServiceNetworkSegment
            icon: "mdi:lan"

          - namespace: Service
            name: FabricAppServices
            label: Fabric Applications
            kind: ServiceFabricApp
            icon: "mdi:apps"

          - namespace: Service
            name: AppAccessServices
            label: Application Access
            kind: ServiceAppAccess
            icon: "mdi:key-chain"

          - namespace: Service
            name: L3vpnServices
            label: Tenant L3VPN
            kind: ServiceL3vpn
            icon: "mdi:lan-connect"

          - namespace: Service
            name: InternetAccessServices
            label: Internet Access
            kind: ServiceInternetAccess
            icon: "mdi:web-check"

          - namespace: Service
            name: TenantCloudServices
            label: Tenant Cloud
            kind: ServiceTenantCloud
            icon: "mdi:cloud-lock"

    # --------- Security ---------
    # Technical layer: what exists on the firewall. The address book and the
    # service catalogue are nested rather than flat, because sixteen sibling
    # entries is a list nobody reads.
    - namespace: Security
      name: SecurityMenu
      label: Security
      icon: "mdi:security"
      children:
        data:
          - namespace: Security
            name: Firewalls
            label: Firewalls
            kind: SecurityFirewall
            icon: "mdi:firewall"

          - namespace: Security
            name: SecurityZones
            label: Zones
            kind: SecurityZone
            icon: "game-icons:fire-zone"

          - namespace: Security
            name: SecurityPolicies
            label: Policies
            kind: SecurityPolicy
            icon: "material-symbols:policy"

          - namespace: Security
            name: SecurityPolicyRules
            label: Policy Rules
            kind: SecurityPolicyRule
            icon: "material-symbols:policy"

          - namespace: Security
            name: AddressBookMenu
            label: Address Book
            icon: "material-symbols:menu-book-outline-rounded"
            children:
              data:
                - namespace: Security
                  name: SecurityAddresses
                  label: IP Addresses
                  kind: SecurityIPAddress
                  icon: "mdi:ip-outline"

                - namespace: Security
                  name: SecurityPrefixes
                  label: Prefixes
                  kind: SecurityPrefix
                  icon: "mdi:ip-network-outline"

                - namespace: Security
                  name: SecurityIPRanges
                  label: IP Ranges
                  kind: SecurityIPRange
                  icon: "mdi:ip-outline"

                - namespace: Security
                  name: SecurityFQDNs
                  label: FQDNs
                  kind: SecurityFQDN
                  icon: "eos-icons:dns"

                - namespace: Security
                  name: SecurityAddressGroups
                  label: Address Groups
                  kind: SecurityAddressGroup
                  icon: "material-symbols:menu-book-outline-rounded"

                - namespace: Security
                  name: SecurityIpamAddresses
                  label: IPAM Addresses
                  kind: SecurityIPAMIPAddress
                  icon: "mdi:ip-outline"

                - namespace: Security
                  name: SecurityIpamPrefixes
                  label: IPAM Prefixes
                  kind: SecurityIPAMIPPrefix
                  icon: "mdi:ip-network-outline"

          - namespace: Security
            name: ServiceCatalogueMenu
            label: Applications
            icon: "eos-icons:application-outlined"
            children:
              data:
                - namespace: Security
                  name: SecurityServices
                  label: Services
                  kind: SecurityService
                  icon: "eos-icons:application-outlined"

                - namespace: Security
                  name: SecurityServiceRanges
                  label: Service Ranges
                  kind: SecurityServiceRange
                  icon: "eos-icons:application-outlined"

                - namespace: Security
                  name: SecurityServiceGroups
                  label: Service Groups
                  kind: SecurityServiceGroup
                  icon: "material-symbols:menu-book-outline-rounded"

                - namespace: Security
                  name: SecurityIpProtocols
                  label: IP Protocols
                  kind: SecurityIPProtocol
                  icon: "mdi:protocol"

    # --------- Kubernetes ---------
    - namespace: Cluster
      name: ClusterMenu
      label: Kubernetes
      icon: "mdi:kubernetes"
      children:
        data:
          - namespace: Cluster
            name: KubernetesClusters
            label: Clusters
            kind: ClusterKubernetes
            icon: "mdi:kubernetes"

    # --------- WAN ---------
    - namespace: Wan
      name: WanMenu
      label: WAN
      icon: "mdi:wan"
      children:
        data:
          - namespace: Wan
            name: WanSites
            label: Sites
            kind: WanSite
            icon: "mdi:office-building-marker"

          - namespace: Wan
            name: WanInternetPeerings
            label: Internet Peerings
            kind: WanInternetPeering
            icon: "mdi:web"

          - namespace: Wan
            name: WanCircuits
            label: Circuits
            kind: DcimCircuit
            icon: "mdi:cable-data"

          - namespace: Wan
            name: WanCircuitEndpoints
            label: Circuit Endpoints
            kind: DcimCircuitEndpoint
            icon: "mdi:ethernet"

    # --------- Tenancy ---------
    - namespace: Organization
      name: TenancyMenu
      label: Tenancy
      icon: "mdi:domain"
      children:
        data:
          - namespace: Organization
            name: Tenants
            label: Tenants
            kind: OrganizationTenant
            icon: "mdi:domain"
