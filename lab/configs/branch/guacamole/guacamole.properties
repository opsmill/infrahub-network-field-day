# Apache Guacamole, configured for the branch office gateway.
#
# guacd is a separate node on the branch LAN (10.70.0.31) because it is the half
# that actually opens the VNC session to the desktop, and that session should
# cross the site network like any other branch traffic. This web front end has
# no branch LAN interface at all -- it reaches guacd over the lab's management
# network, which is exactly the split a real deployment uses.
guacd-hostname: 172.20.41.85
guacd-port: 4822
