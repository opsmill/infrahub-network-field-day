/*
 * OTTERNET lab firewall - vSRX profile
 *
 * The one firewall in this lab. Four zones, and every tenant, customer and
 * site reaches every other one by being routed out of the border leaf into a
 * zone here and back in -- so there is no path between any two of those
 * networks that does not cross this policy.
 *
 *   ge-0/0/0  10.250.110.2/30  <-> border-leaf1 Et10 (10.250.110.1)  zone k8s-prod
 *   ge-0/0/1  10.250.210.2/30  <-> border-leaf1 Et11 (10.250.210.1)  zone app-prod
 *   ge-0/0/2  10.250.150.2/30  <-> border-leaf1 Et14 (10.250.150.1)  zone wan
 *   ge-0/0/3  10.250.170.2/30  <-> border-leaf1 Et15 (10.250.170.1)  zone branch
 *   ge-0/0/4  10.250.10.2/30   <-> border-leaf1 Et16 (10.250.10.1)   zone acme-cloud
 *   ge-0/0/5  10.250.20.2/30   <-> border-leaf1 Et17 (10.250.20.1)   zone globex-cloud
 *   fxp0                           containerlab management            (vrnetlab)
 *
 * The last two are per-TENANT rather than per-function, and that is the point:
 * each WAN tenant's cloud instances live in their own VRF in the fabric, so
 * each needs its own handoff and its own zone. A tenant reaches its own cloud
 * and no other, and the rule that says so names two zones rather than
 * enumerating addresses.
 *
 * Interface naming matters: for the juniper_vsrx kind containerlab wires
 * fw1:eth1 to ge-0/0/0, because fxp0 takes eth0 as management. A policy written
 * against the wrong interface commits cleanly and never matches a packet.
 *
 * THIS FILE IS APPENDED TO vrnetlab's init.conf, not loaded instead of it.
 * launch.py does `cat init.conf $STARTUP_CONFIG_FILE >> juniper.conf`, so
 * everything in init.conf -- the admin user, fxp0, the mgmt_junos routing
 * instance, ssh and netconf -- is already present and must NOT be repeated
 * here. Redefining `system` or `routing-instances` fights with it.
 *
 * There is no policy budget to manage here. Junos licenses throughput and
 * feature bundles (IPS, AppSecure, Content Security), not object counts, so the
 * rules below are written one-per-intent rather than merged to fit under a
 * ceiling, and the anti-spoofing deny is repeated as the first policy of each
 * zone pair instead of being a single global rule.
 */

/*
 * The admin password, set properly.
 *
 * vrnetlab's init.conf writes it as `plain-text-password-value "admin@123"`,
 * and Junos does NOT hash that when the file is the boot configuration -- it
 * stores the leaf verbatim, `show configuration system login` shows
 * plain-text-password-value rather than the encrypted-password you would
 * normally see after a commit, and the account has no usable credential. The
 * commit succeeds, every other part of the config applies, and the only symptom
 * is "Login incorrect" on a box that otherwise looks perfectly healthy.
 *
 * Repeating the `system` stanza here is therefore deliberate, and it is the one
 * thing in this file that intentionally overlaps init.conf. The hash below is
 * SHA-512 of the same password vrnetlab and containerlab already use, so
 * `make fw-console`, clab's own tooling and the access controller all keep
 * working with one credential:
 *
 *     openssl passwd -6 -salt otternetlab 'admin@123'
 */
system {
    root-authentication {
        encrypted-password "$6$otternetlab$1ni88meu2WmQvWmveReLJXVojb6LSSOmcM75qXpzCLKzUzoU63yFywA2YQLoFI2QDjo4RXF28DbWY9wg9gKT71";
    }
    login {
        user admin {
            class super-user;
            authentication {
                encrypted-password "$6$otternetlab$1ni88meu2WmQvWmveReLJXVojb6LSSOmcM75qXpzCLKzUzoU63yFywA2YQLoFI2QDjo4RXF28DbWY9wg9gKT71";
            }
        }
    }
}

interfaces {
    /*
     * MTU, and the one place this profile cannot match the rest of the lab.
     *
     * The fabric runs an IP MTU of 9214. Junos counts MTU including the 14-byte
     * Ethernet header, so matching it would need 9228 -- and vSRX rejects that:
     *
     *   Value 9228 is not within range (256..9192)
     *
     * 9192 is the platform maximum, which is an IP MTU of 9178: 36 bytes short
     * of the fabric. A full-size 9214-byte packet from a host therefore does
     * not fit through the firewall, and the symptom is the expensive one this
     * lab warns about everywhere else -- ping works, sessions establish, bulk
     * transfers stall with data stuck in Send-Q.
     *
     * `security flow tcp-mss` below is what makes that safe rather than
     * theoretical: the firewall rewrites the MSS in every TCP handshake it
     * forwards, so endpoints never build a segment too large for the path
     * instead of relying on PMTUD and ICMP getting back to them through a
     * default-deny firewall.
     */
    ge-0/0/0 {
        description "ZONE-K8S-PROD handoff - border-leaf1 Et10";
        mtu 9192;
        unit 0 {
            family inet {
                address 10.250.110.2/30;
            }
        }
    }
    ge-0/0/1 {
        description "ZONE-APP-PROD handoff - border-leaf1 Et11";
        mtu 9192;
        unit 0 {
            family inet {
                address 10.250.210.2/30;
            }
        }
    }
    ge-0/0/2 {
        description "ZONE-WAN handoff - ISP transit customers";
        mtu 9192;
        unit 0 {
            family inet {
                address 10.250.150.2/30;
            }
        }
    }
    ge-0/0/3 {
        description "ZONE-BRANCH handoff - private circuit";
        mtu 9192;
        unit 0 {
            family inet {
                address 10.250.170.2/30;
            }
        }
    }
    ge-0/0/4 {
        description "ZONE-ACME-CLOUD handoff - VRF TENANT_ACME";
        mtu 9192;
        unit 0 {
            family inet {
                address 10.250.10.2/30;
            }
        }
    }
    ge-0/0/5 {
        description "ZONE-GLOBEX-CLOUD handoff - VRF TENANT_GLOBEX";
        mtu 9192;
        unit 0 {
            family inet {
                address 10.250.20.2/30;
            }
        }
    }
    ge-0/0/6 {
        description "ZONE-TOOLING handoff - the tooling cluster bridge";
        mtu 9192;
        unit 0 {
            family inet {
                address 10.90.0.254/24;
            }
        }
    }
}

/*
 * Static, deliberately. The border leaf points a default route in each tenant
 * VRF at this firewall, and the firewall points the tenant prefixes back at the
 * leaf. Running BGP here instead would be more realistic and would also hide
 * the service-insertion path behind a protocol -- the static routes make it
 * obvious that traffic leaves the fabric and comes back.
 *
 * These live in the default routing instance. fxp0 is in mgmt_junos (init.conf
 * sets `management-instance`), so the management default route cannot leak into
 * the transit table and steal tenant traffic.
 */
routing-options {
    static {
        route 10.110.0.0/24 next-hop 10.250.110.1;   /* k8s nodes */
        route 10.111.0.0/16 next-hop 10.250.110.1;   /* k8s pod CIDR */
        route 10.112.0.0/16 next-hop 10.250.110.1;   /* k8s service CIDR incl. LoadBalancer VIPs */
        route 10.210.0.0/24 next-hop 10.250.210.1;   /* app tenant hosts */
        route 10.60.0.0/16  next-hop 10.250.150.1;   /* WAN customer supernet */
        route 10.70.0.0/24  next-hop 10.250.170.1;   /* branch office LAN */
        route 10.220.10.0/24 next-hop 10.250.10.1;  /* acme cloud instances */
        route 10.220.20.0/24 next-hop 10.250.20.1;  /* globex cloud instances */
    }
}

security {
    /*
     * Clamp TCP to what the path behind this firewall can actually carry.
     * Two limits apply and the fabric's is the tighter: this interface's
     * 9192 - 14 (Ethernet) allows 9138, but traffic onward into a tenant VRF
     * crosses the EVPN fabric as VXLAN, which adds 50 bytes against a 9214
     * underlay: 9214 - 50 (VXLAN) - 20 (IP) - 20 (TCP) = 9124. At 9138 the
     * full-size segments were dropped inside the fabric with nothing
     * reported, and only small replies ever arrived.
     */
    flow {
        tcp-mss {
            all-tcp {
                mss 9124;
            }
        }
    }

    /*
     * Named objects rather than bare CIDRs, so the generated grants the access
     * broker appends read the same way as the rules written here.
     */
    address-book {
        global {
            address k8s-nodes 10.110.0.0/24;
            address k8s-pods 10.111.0.0/16;
            address k8s-services 10.112.0.0/16;
            address access-portal 10.112.240.33/32;
            address dns-resolver 10.112.240.96/32;
            address app-hosts 10.210.0.0/24;
            address fabric-infra 10.41.0.0/16;
            address wan-customers 10.60.0.0/16;
            address branch-users 10.70.0.0/24;
            /*
             * Per-tenant objects. A tenant's sites are an address-set rather
             * than one prefix, because a tenant is not a site: acme has two,
             * attached two different ways, and both must reach acme's cloud.
             * Adding a third site is one line here, not a new policy.
             */
            address acme-hq 10.60.10.0/24;
            address acme-dr 10.60.11.0/24;
            address acme-cloud 10.220.10.0/24;
            address globex-hq 10.60.20.0/24;
            address globex-cloud 10.220.20.0/24;
            address tooling-services 10.90.0.0/24;
            address-set acme-sites {
                address acme-hq;
                address acme-dr;
            }
            address-set globex-sites {
                address globex-hq;
            }
            address-set k8s-all {
                address k8s-nodes;
                address k8s-pods;
            }
            address-set k8s-reachable {
                address k8s-nodes;
                address k8s-services;
            }
        }
    }

    /*
     * NAT is absent from this file, and that absence is load-bearing. The
     * entire premise of the lab is that the leaves and the firewall act on real
     * pod addresses; a source-nat rule here would translate them to the
     * firewall's own interface address and quietly make every ACL and policy
     * downstream meaningless while traffic still flowed. Junos does no NAT
     * unless told to, so there is nothing to disable -- but `make verify`
     * checks that no nat stanza has appeared.
     */

    zones {
        security-zone k8s-prod {
            /*
             * host-inbound-traffic ping only: the firewall answers traceroute
             * and reachability tests from either tenant, and nothing else. No
             * SSH and no HTTPS on a data interface -- management is fxp0.
             */
            interfaces {
                ge-0/0/0.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                        }
                    }
                }
            }
        }
        security-zone app-prod {
            interfaces {
                ge-0/0/1.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                        }
                    }
                }
            }
        }
        security-zone wan {
            interfaces {
                ge-0/0/2.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                        }
                    }
                }
            }
        }
        security-zone branch {
            interfaces {
                ge-0/0/3.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                        }
                    }
                }
            }
        }
        security-zone acme-cloud {
            interfaces {
                ge-0/0/4.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                        }
                    }
                }
            }
        }
        security-zone globex-cloud {
            interfaces {
                ge-0/0/5.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                        }
                    }
                }
            }
        }
        security-zone tooling {
            interfaces {
                ge-0/0/6.0 {
                    host-inbound-traffic {
                        system-services {
                            ping;
                        }
                    }
                }
            }
        }
    }

    policies {
        /*
         * Junos evaluates the policies of the matching from-zone/to-zone pair
         * in order, then falls through to the default policy. Global policies
         * are consulted AFTER zone-pair policies, not before -- so the
         * anti-spoofing deny cannot be one global rule at the top. It is
         * repeated as the first policy of each pair instead, which costs
         * nothing because Junos does not cap policy count.
         */
        from-zone app-prod to-zone k8s-prod {
            policy deny-spoofed-infra {
                match {
                    source-address fabric-infra;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log {
                        session-init;
                    }
                }
            }
            policy app-to-k8s-services {
                match {
                    source-address app-hosts;
                    destination-address k8s-services;
                    application [ junos-http junos-https ];
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
            policy app-to-k8s-icmp {
                match {
                    source-address app-hosts;
                    destination-address [ k8s-nodes k8s-pods k8s-services ];
                    application junos-ping;
                }
                then {
                    permit;
                    log {
                        session-init;
                    }
                }
            }
        }

        from-zone k8s-prod to-zone app-prod {
            policy deny-spoofed-infra {
                match {
                    source-address fabric-infra;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log {
                        session-init;
                    }
                }
            }
            policy k8s-to-app {
                match {
                    source-address k8s-all;
                    destination-address app-hosts;
                    application any;
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
        }

        from-zone wan to-zone k8s-prod {
            policy deny-spoofed-infra {
                match {
                    source-address fabric-infra;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log {
                        session-init;
                    }
                }
            }
            /*
             * A WAN customer consumes published DC services. Destination is the
             * service range only -- no node address, no pod address -- and this
             * is standing access, in contrast to the branch below.
             */
            policy wan-to-k8s-services {
                match {
                    source-address wan-customers;
                    destination-address k8s-services;
                    application [ junos-http junos-https ];
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
        }

        from-zone branch to-zone k8s-prod {
            policy deny-spoofed-infra {
                match {
                    source-address fabric-infra;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log {
                        session-init;
                    }
                }
            }
            /*
             * The branch's ONLY standing permit into the DC: the portal it asks
             * for access through. Everything else a branch user can reach was
             * granted by an AppAccess and appears in this zone pair as a policy
             * named aa-<request>, appended after this one by
             * k8s/access/fw-controller.
             *
             * Appending is correct: there is no explicit trailing deny to
             * get above, because the default policy is consulted only after
             * every policy in the pair has been tried, so a grant added at the
             * end is reached normally.
             */
            policy branch-to-access-portal {
                match {
                    source-address branch-users;
                    destination-address access-portal;
                    application [ junos-http junos-https ];
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
            policy branch-to-dns {
                match {
                    source-address branch-users;
                    destination-address dns-resolver;
                    application [ junos-dns-tcp junos-dns-udp ];
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
            /*
             * Our own office may troubleshoot; a WAN customer may not. The
             * branch gets the node subnet as well as the service range, which
             * is the trust difference made real -- and note it is NOT given the
             * pod CIDR, which the app tenant does get above.
             */
            policy branch-to-k8s-icmp {
                match {
                    source-address branch-users;
                    destination-address k8s-reachable;
                    application junos-ping;
                }
                then {
                    permit;
                    log {
                        session-init;
                    }
                }
            }
        }
        from-zone branch to-zone tooling {
            policy deny-spoofed-infra {
                match {
                    source-address fabric-infra;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log {
                        session-init;
                    }
                }
            }
            policy branch-to-tooling-portal {
                match {
                    source-address branch-users;
                    destination-address tooling-services;
                    application [ tooling-portal tooling-oidc infrahub-api ];
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
        }

        /*
         * ---- tenant cloud access ------------------------------------------
         *
         * The rule that makes a tenant's cloud its own. Traffic from a tenant
         * site arrives in zone `wan` -- the provider handoff is shared, all
         * tenants come in over it -- and leaves into that tenant's own zone.
         * The source match is what separates them: acme's sites are permitted
         * into acme-cloud, and globex's packets simply do not match, so the
         * default policy drops them.
         *
         * There is no `from-zone wan to-zone globex-cloud` rule naming acme,
         * and there does not need to be. Isolation here is the absence of a
         * permit, backed by the VRFs in the fabric having no route between
         * them in the first place. That is two independent gates, and
         * `make verify` asserts the negative as well as the positive.
         *
         * `application any` rather than a port list, unlike the DC service
         * rules: a tenant owns both ends of this conversation. What the
         * provider polices is WHO may open the session, not what they run
         * over it.
         */
        from-zone wan to-zone acme-cloud {
            policy deny-spoofed-infra {
                match {
                    source-address fabric-infra;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log {
                        session-init;
                    }
                }
            }
            policy acme-sites-to-acme-cloud {
                match {
                    source-address acme-sites;
                    destination-address acme-cloud;
                    application any;
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
        }

        from-zone wan to-zone globex-cloud {
            policy deny-spoofed-infra {
                match {
                    source-address fabric-infra;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log {
                        session-init;
                    }
                }
            }
            policy globex-sites-to-globex-cloud {
                match {
                    source-address globex-sites;
                    destination-address globex-cloud;
                    application any;
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
        }

        /*
         * The return direction, for sessions the cloud instance starts itself
         * -- a backup pushing to the tenant's site, say. Stateful return
         * traffic for sessions opened from the site needs no rule; this is
         * only for the cloud initiating.
         *
         * Deliberately NOT a permit to `any`: acme's cloud may reach acme's
         * sites and nothing else, so a compromised instance cannot use the
         * provider handoff to reach another tenant or the internet.
         */
        from-zone acme-cloud to-zone wan {
            policy acme-cloud-to-acme-sites {
                match {
                    source-address acme-cloud;
                    destination-address acme-sites;
                    application any;
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
        }
        from-zone globex-cloud to-zone wan {
            policy globex-cloud-to-globex-sites {
                match {
                    source-address globex-cloud;
                    destination-address globex-sites;
                    application any;
                }
                then {
                    permit;
                    log {
                        session-init;
                        session-close;
                    }
                }
            }
        }

        /*
         * A transit customer has no business in the classic app tenant, and
         * customers and our own office never meet through this firewall. The
         * default policy already denies all three; these exist so the drop is
         * counted and named where `make fw-log` can show it.
         */
        from-zone wan to-zone app-prod {
            policy deny-wan-to-app {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log {
                        session-init;
                    }
                }
            }
        }
        from-zone wan to-zone branch {
            policy deny-wan-to-branch {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log {
                        session-init;
                    }
                }
            }
        }
        from-zone branch to-zone wan {
            policy deny-branch-to-wan {
                match {
                    source-address any;
                    destination-address any;
                    application any;
                }
                then {
                    deny;
                    log {
                        session-init;
                    }
                }
            }
        }

        /* Everything not named above. Junos denies by default; saying so
         * explicitly means the intent is in the config rather than in the
         * reader's knowledge of Junos. */
        default-policy {
            deny-all;
        }
    }
}
applications {
    application infrahub-api {
        protocol tcp;
        destination-port 8000;
    }
    application tooling-oidc {
        protocol tcp;
        destination-port 32556;
    }
    application tooling-portal {
        protocol tcp;
        destination-port 32001;
    }
}
snmp {
    /* Read-only, polled by the telemetry collector the monitoring profiles
     * configure. A v2c community has to be in the configuration the device
     * receives; it is restricted to the one client prefix below. */
    community otternet-ro {
        authorization read-only;
        routing-instance mgmt_junos {
            clients {
                172.20.41.0/24;
            }
        }
    }
    routing-instance-access;
}
