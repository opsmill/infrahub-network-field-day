---
# Crossplane packages for the OTTERNET lab.
#
# Two providers, because the lab needs two different things from Crossplane:
#
#   provider-helm        installs real applications from upstream charts. This
#                        is what makes "deploy an app" mean a genuine Helm
#                        release rather than a hand-written Deployment.
#
#   provider-kubernetes  manages arbitrary API objects, which is how Cilium is
#                        driven. Cilium's control surface is entirely CRDs
#                        (CiliumBGPClusterConfig, CiliumBGPAdvertisement,
#                        CiliumLoadBalancerIPPool, CiliumNetworkPolicy) and
#                        there is no dedicated Cilium provider, so each one is
#                        wrapped in an Object.
#
# Versions are pinned. `crossplane.io/v1` Provider resolves the tag from the
# registry at install time, and an unpinned package will silently move under you
# between deploys -- which for a lab that is meant to be reproducible is worse
# than being a few releases behind.
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-helm
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-helm:v1.4.0
  runtimeConfigRef:
    name: provider-helm
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: provider-kubernetes
spec:
  package: xpkg.crossplane.io/crossplane-contrib/provider-kubernetes:v1.3.1
  runtimeConfigRef:
    name: provider-kubernetes
---
# Composition functions.
#
# Crossplane 2.x removed the old `mode: Resources` composition style entirely --
# every Composition is a function pipeline now. go-templating is the right
# choice here over patch-and-transform because the compositions below have to
# emit a *variable number* of resources: one CiliumNetworkPolicy per allowed
# source CIDR, one BGP peer per leaf. Patch-and-transform can only patch a
# fixed, pre-declared resource list, which would mean hard-coding a maximum.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-go-templating
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-go-templating:v0.12.4
---
# Derives the XR's Ready condition from the readiness of everything it composed,
# so `kubectl get fabricapp` tells the truth without the composition having to
# state readiness rules for each resource by hand.
apiVersion: pkg.crossplane.io/v1
kind: Function
metadata:
  name: function-auto-ready
spec:
  package: xpkg.crossplane.io/crossplane-contrib/function-auto-ready:v0.7.0
