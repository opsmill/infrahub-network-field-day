---
# ansible_host is set explicitly per switch. AVD's `mgmt_ip` populates the
# *generated config*, not Ansible's connection target, so without these the
# httpapi connection would try to DNS-resolve "spine1" and fail.
all:
  children:
    OTTERNET_FABRIC:
      children:
        OTTERNET_SPINES:
          hosts:
            spine1:
              ansible_host: 172.20.41.11
            spine2:
              ansible_host: 172.20.41.12
        OTTERNET_L3LEAFS:
          children:
            K8S_LEAFS:
              hosts:
                k8s-leaf1:
                  ansible_host: 172.20.41.21
                k8s-leaf2:
                  ansible_host: 172.20.41.22
            APP_LEAFS:
              hosts:
                app-leaf1:
                  ansible_host: 172.20.41.23
                app-leaf2:
                  ansible_host: 172.20.41.24
            BORDER_LEAFS:
              hosts:
                border-leaf1:
                  ansible_host: 172.20.41.25
